<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>French Drills V3</title>
<meta name="theme-color" content="#4F46E5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="canonical" href="https://syedalimoiz.com/french-drills-v3/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇫🇷</text></svg>">
<style>
:root {
  --bg: #F8F7F4;
  --surface: #FFFFFF;
  --text: #1A1714;
  --text-dim: #6E6960;
  --accent: #4F46E5;
  --accent-hover: #4338CA;
  --accent-on: #FFFFFF;
  --accent-faint: #EEF2FF;
  --ok: #059669;
  --ok-bg: #ECFDF5;
  --ok-border: #6EE7B7;
  --err: #DC2626;
  --err-bg: #FEF2F2;
  --err-border: #FECACA;
  --warn: #D97706;
  --warn-bg: #FFFBEB;
  --warn-border: #FDE68A;
  --line: #E8E5E1;
  --field-bg: #FFFFFF;
  --field-border: #D6D2CC;
  --field-focus: #4F46E5;
  --key-bg: #F3F1ED;
  --key-hover: #E8E5E1;
  --key-border: #D6D2CC;
  --key-text: #1A1714;
  --bar-track: #E8E5E1;
  --bar-fill: #4F46E5;
  --card-shadow: 0 1px 2px rgba(0,0,0,.03), 0 4px 16px rgba(0,0,0,.04);
  --surface-elevated: #F3F1ED;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-pill: 99px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0C0B0A;--surface:#252321;--text:#F5F3EF;--text-dim:#9A958E;
  --accent:#818CF8;--accent-hover:#A5B4FC;--accent-on:#FFFFFF;--accent-faint:#1E1B4B;
  --ok:#34D399;--ok-bg:#0D2818;--ok-border:#065F46;
  --err:#F87171;--err-bg:#2D1515;--err-border:#7F1D1D;
  --warn:#FBBF24;--warn-bg:#2D2410;--warn-border:#854D0E;
  --line:#403C38;--field-bg:#1A1917;--field-border:#4D4844;--field-focus:#818CF8;
  --key-bg:#302D2A;--key-hover:#3A3735;--key-border:#4D4844;--key-text:#D4D0CB;
  --bar-track:#353230;--bar-fill:#818CF8;--card-shadow:0 2px 8px rgba(0,0,0,.25);
  --surface-elevated:#302D2A;
}}
:root[data-theme="dark"]{
  --bg:#0C0B0A;--surface:#252321;--text:#F5F3EF;--text-dim:#9A958E;
  --accent:#818CF8;--accent-hover:#A5B4FC;--accent-on:#FFFFFF;--accent-faint:#1E1B4B;
  --ok:#34D399;--ok-bg:#0D2818;--ok-border:#065F46;
  --err:#F87171;--err-bg:#2D1515;--err-border:#7F1D1D;
  --warn:#FBBF24;--warn-bg:#2D2410;--warn-border:#854D0E;
  --line:#403C38;--field-bg:#1A1917;--field-border:#4D4844;--field-focus:#818CF8;
  --key-bg:#302D2A;--key-hover:#3A3735;--key-border:#4D4844;--key-text:#D4D0CB;
  --bar-track:#353230;--bar-fill:#818CF8;--card-shadow:0 2px 8px rgba(0,0,0,.25);
  --surface-elevated:#302D2A;
}
:root[data-theme="light"]{
  --bg:#F8F7F4;--surface:#FFFFFF;--text:#1A1714;--text-dim:#6E6960;
  --accent:#4F46E5;--accent-hover:#4338CA;--accent-on:#FFFFFF;--accent-faint:#EEF2FF;
  --ok:#059669;--ok-bg:#ECFDF5;--ok-border:#6EE7B7;
  --err:#DC2626;--err-bg:#FEF2F2;--err-border:#FECACA;
  --warn:#D97706;--warn-bg:#FFFBEB;--warn-border:#FDE68A;
  --line:#E8E5E1;--field-bg:#FFFFFF;--field-border:#D6D2CC;--field-focus:#4F46E5;
  --key-bg:#F3F1ED;--key-hover:#E8E5E1;--key-border:#D6D2CC;--key-text:#1A1714;
  --bar-track:#E8E5E1;--bar-fill:#4F46E5;--card-shadow:0 1px 2px rgba(0,0,0,.03), 0 4px 16px rgba(0,0,0,.04);
  --surface-elevated:#F3F1ED;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
button,input,select,textarea{color:inherit;font:inherit}
body{font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.wrap{max-width:480px;margin:0 auto;padding:1.25rem 1rem}
.serif{font-family:Georgia,"Times New Roman",serif}
.hdr{font-size:1.375rem;font-weight:700;letter-spacing:-0.01em}
.sub{font-size:.8125rem;color:var(--text-dim)}
.label{font-size:.6875rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim)}
.tabnum{font-variant-numeric:tabular-nums}
.prog-track{height:4px;background:var(--bar-track);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-hover));border-radius:3px;transition:width .35s ease;box-shadow:0 0 8px rgba(129,140,248,.35)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:1.25rem;box-shadow:var(--card-shadow);margin-bottom:.75rem}
.card-accent{border-left:3px solid var(--accent)}
.card-ok{border-left-color:var(--ok)}
.card-err{border-left-color:var(--err)}
.card-title{font-weight:600;margin-bottom:.25rem}
.card-sub{font-size:.8125rem;color:var(--text-dim)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;width:100%;font-family:inherit;font-size:1rem;font-weight:600;padding:.75rem 1.5rem;border:none;border-radius:var(--radius-md);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .15s,opacity .15s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-p{background:linear-gradient(180deg,var(--accent) 0%,var(--accent-hover) 100%);color:var(--accent-on);box-shadow:0 1px 3px rgba(79,70,229,.25)}
.btn-p:hover:not(:disabled){filter:brightness(1.08)}
.btn-p:active:not(:disabled){transform:scale(.98);filter:brightness(.95)}
.btn-g{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn-g:hover:not(:disabled){background:var(--accent-faint)}
.btn-sm{font-size:.875rem;padding:.5rem 1rem}
.btn-ok{background:var(--ok);color:#fff}
.btn-link{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;padding:.5rem;font-size:.875rem;text-decoration:underline;text-underline-offset:2px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.field{width:100%;font-family:Georgia,"Times New Roman",serif;font-size:1.125rem;padding:.75rem;background:var(--field-bg);color:var(--text);border:1.5px solid var(--field-border);border-radius:var(--radius-sm);outline:none;transition:border-color .15s}
.field:focus{border-color:var(--field-focus)}
.field:disabled{opacity:.6;cursor:not-allowed}
.field-ok{border-color:var(--ok)!important;background:var(--ok-bg)!important}
.field-err{border-color:var(--err)!important;background:var(--err-bg)!important}
.field-pw{font-family:inherit;font-size:1rem}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin:.625rem 0}
.key{font-family:Georgia,serif;font-size:1rem;min-width:38px;height:36px;display:flex;align-items:center;justify-content:center;padding:0 4px;background:var(--key-bg);color:var(--key-text);border:1px solid var(--key-border);border-radius:var(--radius-sm);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .1s,transform .08s}
.key:hover{background:var(--surface-elevated)}
.key:active{transform:scale(.93)}
.key:disabled{opacity:.3;pointer-events:none}
.opts{display:flex;flex-direction:column;gap:.5rem;margin:.75rem 0}
.opt{display:flex;align-items:center;gap:.75rem;width:100%;padding:.875rem 1rem;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius-md);cursor:pointer;color:var(--text);font-family:Georgia,serif;font-size:1.0625rem;text-align:left;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:border-color .15s,background .15s}
.opt:hover:not(.opt-locked){border-color:var(--accent);background:var(--accent-faint)}
.opt-letter{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--accent-faint);color:var(--accent);font-family:system-ui,sans-serif;font-size:.8125rem;font-weight:700;flex-shrink:0}
.opt-locked{cursor:default;opacity:.5}
.opt-sel{border-color:var(--accent);background:var(--accent-faint)}
.opt-right{border-color:var(--ok)!important;background:var(--ok-bg)!important;opacity:1!important;animation:pop .25s ease}
.opt-right .opt-letter{background:var(--ok);color:#fff}
.opt-wrong{border-color:var(--err)!important;background:var(--err-bg)!important;opacity:1!important;animation:shake .35s ease}
.opt-wrong .opt-letter{background:var(--err);color:#fff}
.fb{padding:.875rem;border-radius:var(--radius-sm);font-size:.9375rem;line-height:1.5;margin-top:.75rem}
.fb-ok{background:var(--ok-bg);border:1px solid var(--ok-border);color:var(--ok)}
.fb-err{background:var(--err-bg);border:1px solid var(--err-border);color:var(--err)}
.fb-warn{background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn)}
.fb-head{font-weight:700;display:block;margin-bottom:.2rem}
.fb-rule{display:block;margin-top:.35rem;font-size:.8125rem;opacity:.85}
.fb-answer{font-family:Georgia,serif;font-weight:600}
.row{display:flex;align-items:center;gap:.75rem}
.col{display:flex;flex-direction:column;gap:.75rem}
.mt{margin-top:1rem}.mt-sm{margin-top:.5rem}.mb{margin-bottom:1rem}
.gap-sm{gap:.5rem}
.center{text-align:center}
.between{justify-content:space-between}
.flex1{flex:1}
.dash-section{margin-bottom:1.25rem}
.dash-section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:.5rem;padding-left:.25rem}
.stat-row{display:flex;gap:.5rem;flex-wrap:wrap}
.stat-box{flex:1;min-width:90px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:.875rem;text-align:center;box-shadow:var(--card-shadow)}
.stat-val{font-size:1.5rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.stat-label{font-size:.6875rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin-top:.125rem}
.res-score{font-family:Georgia,serif;font-size:3rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.res-msg{font-size:1.125rem;color:var(--text-dim);margin-bottom:1.5rem}

.dp{min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.dp-top{padding:1rem 1.25rem 0;width:100%;max-width:800px;margin:0 auto}
.dp-body{flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding:3rem 1.25rem 2rem;width:100%;max-width:800px;margin:0 auto;gap:.5rem}
.dp .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:1.5rem;box-shadow:var(--card-shadow)}
.dp .card.card-ok{background:var(--ok-bg);border-color:var(--ok-border)}
.dp .card.card-err{background:var(--err-bg);border-color:var(--err-border)}
.dp .serif{font-size:1.75rem;line-height:1.45;color:#F5F3EF;font-weight:700;overflow-wrap:break-word}
.dp .sub{font-size:1.375rem;line-height:1.5;margin-top:.75rem;color:#C4BFBA;font-weight:500}
@media(prefers-color-scheme:light){.dp .serif{color:#1A1714}.dp .sub{color:#6E6960}}
:root[data-theme="light"] .dp .serif{color:#1A1714}
:root[data-theme="light"] .dp .sub{color:#6E6960}
.dp .field{font-size:clamp(1.25rem,3vw,1.5rem);padding:1.125rem 1.25rem;border-radius:var(--radius-md);margin-top:1.25rem}
.dp .keys{gap:10px;margin:.75rem 0;justify-content:center}
.dp .key{min-width:48px;height:48px;font-size:1.25rem;border-radius:var(--radius-md)}
.dp .keys-toggle{background:none;border:none;color:var(--text-dim);font-size:.875rem;cursor:pointer;padding:.5rem;margin-top:.5rem;-webkit-tap-highlight-color:transparent}
.dp .keys-toggle:hover{color:var(--text)}
.dp .btn{padding:1.125rem;font-size:clamp(1.0625rem,2.5vw,1.25rem);border-radius:var(--radius-md)}
.dp .opts{gap:.875rem;margin-top:1.5rem}
.dp .opt{padding:1.25rem 1.375rem;font-size:clamp(1.125rem,2.8vw,1.375rem);border-radius:var(--radius-md);border-width:1.5px;background:var(--surface);border-color:var(--field-border);box-shadow:var(--card-shadow)}
.dp .opt:hover:not(.opt-locked){background:var(--accent-faint)}
.dp .opt-right{border-radius:var(--radius-md)!important}
.dp .opt-wrong{border-radius:var(--radius-md)!important}
.dp .opt-letter{width:36px;height:36px;font-size:.9375rem;border-radius:50%}
.dp .fb{padding:1.25rem 1.375rem;border-radius:var(--radius-md);font-size:clamp(1rem,2.5vw,1.1875rem);margin-top:1.5rem}
.dp .fb-head{font-size:clamp(1.0625rem,2.5vw,1.25rem)}
.dp .fb-rule{font-size:clamp(.9375rem,2.2vw,1.0625rem);line-height:1.55}
.dp .fb-answer{font-size:clamp(1.0625rem,2.5vw,1.25rem)}
.dp .prog-track{height:6px;border-radius:3px}
.dp-count{font-size:.875rem;color:var(--text-dim);font-variant-numeric:tabular-nums}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.015)}100%{transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes ringFill{to{stroke-dashoffset:var(--target)}}
.shake{animation:shake .35s ease}
.pop{animation:pop .3s ease}
.fade-up{animation:fadeUp .4s ease-out both}
.stagger>*{animation:fadeUp .4s ease-out both}
.stagger>:nth-child(1){animation-delay:0s}
.stagger>:nth-child(2){animation-delay:.06s}
.stagger>:nth-child(3){animation-delay:.12s}
.stagger>:nth-child(4){animation-delay:.18s}
.stagger>:nth-child(5){animation-delay:.24s}
.stagger>:nth-child(6){animation-delay:.3s}
.stagger>:nth-child(7){animation-delay:.36s}
.stagger>:nth-child(8){animation-delay:.42s}
.score-ring-fill{animation:ringFill 1.2s ease-out .3s forwards}
.score-wrap{position:relative;width:160px;height:160px;margin:0 auto}
.score-inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
@media(prefers-reduced-motion:reduce){.shake,.pop,.fade-up,.stagger>*,.score-ring-fill,.opt-right,.opt-wrong{animation:none}.prog-fill{transition:none}#app{transition:none}}

.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sync{display:flex;align-items:center;gap:.375rem;font-size:.75rem;color:var(--text-dim);padding:.375rem .75rem;border-radius:var(--radius-pill);background:var(--surface);border:1px solid var(--line)}
.sync-ok{color:var(--ok);border-color:var(--ok-border)}
.sync-err{color:var(--err);border-color:var(--err-border)}
.auth-logo{font-size:3rem;margin-bottom:.5rem}
.auth-title{font-family:'Inter',system-ui,sans-serif;font-size:1.5rem;font-weight:700;margin-bottom:.25rem;letter-spacing:-.01em}
.auth-sub{color:var(--text-dim);font-size:.875rem;margin-bottom:1.5rem}
.form-group{margin-bottom:1rem}
.form-label{display:block;font-size:.8125rem;font-weight:600;margin-bottom:.375rem;color:var(--text-dim)}
.form-help{font-size:.75rem;color:var(--text-dim);margin-top:.25rem}
.error-msg{color:var(--err);font-size:.875rem;font-weight:500;margin-bottom:.75rem}
.checkbox-row{display:flex;align-items:center;gap:.5rem;font-size:.875rem;margin:.75rem 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.checkbox-row input{width:18px;height:18px;accent-color:var(--accent)}
.streak-badge{display:inline-flex;align-items:center;gap:.375rem;font-size:.875rem;font-weight:700;color:#92400E;padding:.3125rem .875rem;background:linear-gradient(135deg,#FEF3C7,#FDE68A);border:none;border-radius:var(--radius-pill);box-shadow:0 1px 4px rgba(217,119,6,.15)}

.fuel-row{display:flex;align-items:center;gap:.75rem;padding:.625rem 0;border-bottom:1px solid var(--line)}
.fuel-row:last-child{border-bottom:none}
.fuel-label{flex:1;font-size:.875rem;font-weight:500}
.fuel-count{font-size:.875rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:2.5rem;text-align:right}
.fuel-bar{flex:2;height:6px;border-radius:3px;background:var(--bar-track);overflow:hidden}
.fuel-bar-fill{height:100%;border-radius:3px;transition:width .3s}
.fuel-ok{background:var(--ok)}
.fuel-low{background:var(--warn)}
.fuel-empty{background:var(--err)}

.zone-indicator{display:flex;align-items:center;gap:.5rem;padding:.75rem 1rem;border-radius:var(--radius-md);font-size:.875rem;font-weight:600}
.zone-sweet{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-border)}
.zone-easy{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border)}
.zone-hard{background:var(--err-bg);color:var(--err);border:1px solid var(--err-border)}

.type-badge{display:inline-block;font-size:.6875rem;font-weight:600;padding:.125rem .5rem;border-radius:var(--radius-pill);text-transform:uppercase;letter-spacing:.04em}
.type-grammar{background:var(--accent-faint);color:var(--accent)}
.type-vocab{background:var(--ok-bg);color:var(--ok)}
.type-reading{background:var(--warn-bg);color:var(--warn)}
.type-writing{background:#F3E8FF;color:#7C3AED}
@media(prefers-color-scheme:dark){.type-writing{background:#2D1B4E;color:#A78BFA}}
:root[data-theme="dark"] .type-writing{background:#2D1B4E;color:#A78BFA}
:root[data-theme="light"] .type-writing{background:#F3E8FF;color:#7C3AED}
.type-reach{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border)}
.reach-label{font-size:.75rem;color:var(--warn);font-weight:600;letter-spacing:.04em}
.writing-fb-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:1rem;margin-bottom:.75rem;border-left:3px solid #7C3AED;box-shadow:var(--card-shadow)}
.writing-fb-original{font-style:italic;color:var(--text-dim);font-size:.875rem;margin-bottom:.5rem}
.writing-fb-correction{font-size:.9375rem;line-height:1.6}
.writing-fb-correction mark{background:var(--ok-bg);color:var(--ok);border-radius:2px;padding:0 .125rem}

.speak-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:none;background:var(--accent-faint);color:var(--accent);border-radius:50%;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .15s,transform .08s;flex-shrink:0;vertical-align:middle;margin-left:.25rem}
.speak-btn:hover{background:var(--accent);color:var(--accent-on)}
.speak-btn:active{transform:scale(.9)}
.speak-btn svg{width:16px;height:16px;fill:currentColor}
.dp .speak-btn{width:40px;height:40px}
.dp .speak-btn svg{width:20px;height:20px}
.speak-lg{width:72px!important;height:72px!important;margin:0}
.speak-lg svg{width:36px!important;height:36px!important}
.dictation-controls{display:flex;align-items:center;justify-content:center;gap:1rem;margin:.75rem 0}
.type-dictation{background:#ECFEFF;color:#0891B2}
@media(prefers-color-scheme:dark){.type-dictation{background:#083344;color:#22D3EE}}
:root[data-theme="dark"] .type-dictation{background:#083344;color:#22D3EE}
:root[data-theme="light"] .type-dictation{background:#ECFEFF;color:#0891B2}

.tpl-toggle{display:flex;align-items:center;gap:.375rem;background:none;border:none;color:var(--accent);font-size:.8125rem;font-weight:600;cursor:pointer;padding:.375rem 0;-webkit-tap-highlight-color:transparent}
.tpl-toggle svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;transition:transform .2s}
.tpl-toggle.open svg{transform:rotate(90deg)}
.tpl-body{display:none;padding:.75rem 1rem;background:var(--accent-faint);border-radius:var(--radius-sm);margin-top:.375rem;font-size:.875rem;line-height:1.6}
.tpl-body.show{display:block}
.tpl-body ol{padding-left:1.25rem;margin:0}
.tpl-body li{margin-bottom:.25rem;color:var(--text-dim)}

<script>
'use strict';


/* ═══════════════════════════════════════════════════════════════

const CFG = { owner: 'syedalimoiz', repo: 'french-drills-v3' };
const ACCENTS = ['é','è','ê','ë','à','â','î','ï','ô','ù','û','ç'];
const SPEAK_SVG = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 8.5v7a4.49 4.49 0 002.5-3.5zM14 3.23v2.06a7.007 7.007 0 010 13.42v2.06c4.73-.91 8.31-5.06 8.31-9.77s-3.58-8.86-8.31-9.77z"/></svg>';

/* ═══════════════════════════════════════════════════════════════
   SPEECH SYNTHESIS — French TTS via Web Speech API
   ═══════════════════════════════════════════════════════════════ */

const Speech = {
  voice: null,
  ready: false,
  hasFrenchVoice: false,
  init() {
    if (!window.speechSynthesis) return;
    const pick = () => {
      const voices = speechSynthesis.getVoices();
      this.voice = voices.find(v => v.lang === 'fr-FR') ||
                   voices.find(v => v.lang.startsWith('fr')) || null;
      this.ready = voices.length > 0;
      const hadVoice = this.hasFrenchVoice;
      this.hasFrenchVoice = !!this.voice;
      if (!hadVoice && this.hasFrenchVoice) {
        document.querySelectorAll('.speak-btn-off').forEach(el => el.classList.remove('speak-btn-off'));
        document.querySelectorAll('.speak-link-off').forEach(el => el.classList.remove('speak-link-off'));
      }
    };
    pick();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = pick;
    }
  },
  speak(text, rate) {
    if (!window.speechSynthesis || !text) return;
    speechSynthesis.cancel();
    if (!this.voice) {
      const voices = speechSynthesis.getVoices();
      this.voice = voices.find(v => v.lang === 'fr-FR') ||
                   voices.find(v => v.lang.startsWith('fr')) || null;
    }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    if (this.voice) u.voice = this.voice;
    u.rate = rate || 1;
    speechSynthesis.speak(u);
  }
};


/* ═══════════════════════════════════════════════════════════════
   CRYPTO — AES-256-GCM password encryption for PAT
   ═══════════════════════════════════════════════════════════════ */

const Cry = {
  async deriveKey(pw, salt) {
    const raw = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:100000, hash:'SHA-256' }, raw, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
  },
  async encrypt(pw, text) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await this.deriveKey(pw, salt);
    const enc = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(text));
    return { s: this.b64(salt), i: this.b64(iv), d: this.b64(new Uint8Array(enc)) };
  },
  async decrypt(pw, bundle) {
    const salt = this.unb64(bundle.s), iv = this.unb64(bundle.i), data = this.unb64(bundle.d);
    const key = await this.deriveKey(pw, salt);
    const dec = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, data);
    return new TextDecoder().decode(dec);
  },
  b64(u8) { return btoa(String.fromCharCode(...u8)); },
  unb64(s) { return new Uint8Array(atob(s).split('').map(c => c.charCodeAt(0))); }
};


/* ═══════════════════════════════════════════════════════════════
   GITHUB API — Read/write files to the repo
   ═══════════════════════════════════════════════════════════════ */

class GH {
  constructor(token) {
    this.token = token;
    this.api = `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents`;
    this.shas = {};
  }
  headers() {
    const h = { 'Accept': 'application/vnd.github.v3+json' };
    if (this.token) h['Authorization'] = `Bearer ${this.token}`;
    return h;
  }
  encodePath(path) {
    return path.split('/').map(s => encodeURIComponent(s)).join('/');
  }
  async get(path) {
    const r = await fetch(`${this.api}/${this.encodePath(path)}`, { headers: this.headers() });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error(`GitHub ${r.status}: ${(await r.json()).message}`);
    const d = await r.json();
    this.shas[path] = d.sha;
    const bin = atob(d.content.replace(/\n/g, ''));
    return new TextDecoder().decode(new Uint8Array([...bin].map(c => c.charCodeAt(0))));
  }
  async put(path, content, msg) {
    const bytes = new TextEncoder().encode(content);
    const b64 = btoa(String.fromCharCode(...bytes));
    const body = { message: msg, content: b64 };
    if (this.shas[path]) body.sha = this.shas[path];
    const r = await fetch(`${this.api}/${this.encodePath(path)}`, {
      method: 'PUT',
      headers: { ...this.headers(), 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!r.ok) {
      const e = await r.json();
      if (r.status === 409 && !this.shas[path]) {
        await this.get(path);
        return this.put(path, content, msg);
      }
      throw new Error(`GitHub ${r.status}: ${e.message}`);
    }
    const d = await r.json();
    this.shas[path] = d.content.sha;
  }
}


/* ═══════════════════════════════════════════════════════════════
   SRS ENGINE — SM-2 spaced repetition for vocabulary
   ═══════════════════════════════════════════════════════════════ */

const SRS = {
  defaultCard() {
    return { ef: 2.5, interval: 0, reps: 0, nextReview: null, lastReview: null };
  },

  update(card, grade) {
    const today = todayStr();
    card.lastReview = today;
    if (grade >= 3) {
      if (card.reps === 0) card.interval = 1;
      else if (card.reps === 1) card.interval = 3;
      else card.interval = Math.round(card.interval * card.ef);
      card.ef = Math.max(1.3, card.ef + 0.1 - (5 - grade) * (0.08 + (5 - grade) * 0.02));
      card.reps++;
    } else {
      card.reps = 0;
      card.interval = 1;
    }
    const d = new Date(today + 'T00:00:00');
    d.setDate(d.getDate() + card.interval);
    card.nextReview = d.toISOString().slice(0, 10);
    return card;
  },

  isDue(card) {
    if (!card.nextReview) return true;
    return card.nextReview <= todayStr();
  },

  daysOverdue(card) {
    if (!card.nextReview) return 999;
    const diff = Math.floor((new Date(todayStr() + 'T00:00:00') - new Date(card.nextReview + 'T00:00:00')) / 86400000);
    return Math.max(0, diff);
  },

  gradeFromPct(pct) {
    if (pct >= 1.0) return 5;
    if (pct >= 0.8) return 4;
    if (pct >= 0.6) return 3;
    if (pct >= 0.4) return 2;
    if (pct >= 0.2) return 1;
    return 0;
  }
};


/* ═══════════════════════════════════════════════════════════════
   ANSWER CHECKING — accent-tolerant matching
   ═══════════════════════════════════════════════════════════════ */

function normText(s) {
  return s.trim().normalize('NFC').replace(/['’ʼ`′]/g, "'").replace(/\s+/g, ' ').replace(/[.!?,;…]+$/, '').toLowerCase();
}

function stripAccents(s) {
  return s.normalize('NFD').replace(/[̀-ͯ]/g, '');
}

function checkAnswer(given, correct, alternates) {
  const g = normText(given), c = normText(correct);
  if (g === c || stripAccents(g) === stripAccents(c)) return true;
  if (alternates) {
    for (const alt of alternates) {
      const a = normText(alt);
      if (g === a || stripAccents(g) === stripAccents(a)) return true;
    }
  }
  return false;
}


/* ═══════════════════════════════════════════════════════════════
   PROGRESS — V4 data model (spaced retrieval + tag mastery)
   ═══════════════════════════════════════════════════════════════ */

function defaultProgress() {
  return {
    v: 4,
    updated: null,
    exercises: {},
    srs: {},
    errorPatterns: {},
    tagMastery: {},
    writingSubmissions: [],
    sessions: [],
    streak: { current: 0, best: 0, lastDate: null },
    batch: { id: null, loaded: null },
    seenIds: []
  };
}

function migrateProgress(p) {
  if (p.v <= 3) {
    if (p.exhaustedIds) { p.seenIds = p.exhaustedIds; delete p.exhaustedIds; }
    if (!p.tagMastery) p.tagMastery = {};
    for (const [id, rec] of Object.entries(p.exercises || {})) {
      if (!rec.streak) rec.streak = rec.correct > 0 ? 1 : 0;
      if (!rec.nextDue) rec.nextDue = todayStr();
      if (!rec.mastery) rec.mastery = rec.streak >= 4 ? 'locked' : rec.streak >= 2 ? 'familiar' : 'learning';
    }
    p.v = 4;
  }
  if (!p.seenIds) p.seenIds = [];
  if (!p.tagMastery) p.tagMastery = {};
  return p;
}

function exerciseInterval(streak) {
  if (streak <= 1) return 0;
  if (streak === 2) return 1;
  if (streak === 3) return 3;
  if (streak === 4) return 7;
  return Math.min(30, 7 * Math.pow(1.5, streak - 4));
}

function recordExercise(id, correct, tags) {
  const p = S.progress;
  if (!p.exercises[id]) p.exercises[id] = { attempts: 0, correct: 0, streak: 0, lastSeen: null, nextDue: null, mastery: 'learning' };
  const rec = p.exercises[id];
  rec.attempts++;
  if (correct) {
    rec.correct++;
    rec.streak++;
  } else {
    rec.streak = 0;
  }
  rec.lastSeen = todayStr();
  if (rec.streak >= 4) rec.mastery = 'locked';
  else if (rec.streak >= 2) rec.mastery = 'familiar';
  else rec.mastery = 'learning';
  const interval = exerciseInterval(rec.streak);
  const d = new Date(todayStr() + 'T00:00:00');
  d.setDate(d.getDate() + interval);
  rec.nextDue = d.toISOString().slice(0, 10);
  if (!p.seenIds.includes(id)) p.seenIds.push(id);
  if (tags) {
    if (!correct) {
      for (const tag of tags) p.errorPatterns[tag] = (p.errorPatterns[tag] || 0) + 1;
    }
    updateTagMastery(tags, correct, S.queue[S.qi]);
  }
  saveLocal();
}

function updateTagMastery(tags, correct, exercise) {
  if (!exercise || !exercise.type) return;
  const p = S.progress;
  const type = exercise.type;
  for (const tag of tags) {
    if (!p.tagMastery[tag]) p.tagMastery[tag] = {};
    const tm = p.tagMastery[tag];
    const key = (type === 'mcq' || type === 'why') ? 'mcq' : (type === 'blank') ? 'blank' : 'open';
    if (!tm[key]) tm[key] = { attempts: 0, correct: 0 };
    tm[key].attempts++;
    if (correct) tm[key].correct++;
  }
}

function tagUnlockedType(tag) {
  const tm = S.progress.tagMastery[tag];
  if (!tm) return 'mcq';
  const mcq = tm.mcq || { attempts: 0, correct: 0 };
  const blank = tm.blank || { attempts: 0, correct: 0 };
  if (blank.attempts >= 4 && blank.correct / blank.attempts >= 0.75) return 'open';
  if (mcq.attempts >= 6 && mcq.correct / mcq.attempts >= 0.75) return 'blank';
  return 'mcq';
}

function exercisePassesGate(exercise) {
  if (!exercise.tags || exercise.tags.length === 0) return true;
  if (exercise.type === 'why') return true;
  const maxUnlocked = exercise.tags.reduce((best, tag) => {
    const level = tagUnlockedType(tag);
    const rank = { mcq: 0, blank: 1, open: 2 };
    return rank[level] > rank[best] ? level : best;
  }, 'mcq');
  const typeRank = { mcq: 0, blank: 1, open: 2 };
  const exType = (exercise.type === 'mcq' || exercise.type === 'why') ? 'mcq' : (exercise.type === 'blank') ? 'blank' : 'open';
  return typeRank[exType] <= typeRank[maxUnlocked];
}

function getVocabCard(wordId) {
  if (!S.progress.srs[wordId]) S.progress.srs[wordId] = SRS.defaultCard();
  return S.progress.srs[wordId];
}

function updateStreak() {
  const p = S.progress;
  const today = todayStr();
  if (p.streak.lastDate === today) return;
  const yesterday = new Date(today + 'T00:00:00');
  yesterday.setDate(yesterday.getDate() - 1);
  const yStr = yesterday.toISOString().slice(0, 10);
  if (p.streak.lastDate === yStr) {
    p.streak.current++;
  } else if (p.streak.lastDate !== today) {
    p.streak.current = 1;
  }
  if (p.streak.current > p.streak.best) p.streak.best = p.streak.current;
  p.streak.lastDate = today;
}

function recordSession(correct, total, durationMs) {
  const errorRate = total > 0 ? Math.round(((total - correct) / total) * 100) : 0;
  S.progress.sessions.push({
    date: todayStr(),
    duration: Math.round(durationMs / 1000),
    exercises: total,
    correct: correct,
    errorRate: errorRate
  });
  if (S.progress.sessions.length > 30) S.progress.sessions = S.progress.sessions.slice(-30);
  updateStreak();
}


/* ═══════════════════════════════════════════════════════════════
   BATCH MANAGEMENT — load and query exercise batches
   ═══════════════════════════════════════════════════════════════ */

const Batch = {
  batches: [],
  registry: null,

  addBatch(json) {
    const batch = typeof json === 'string' ? JSON.parse(json) : json;
    if (!this.batches.find(b => b.batch_id === batch.batch_id)) {
      this.batches.push(batch);
    }
  },

  get current() {
    return this.batches.length > 0 ? this.batches[this.batches.length - 1] : null;
  },

  all(type) {
    return this.batches.flatMap(b => b[type] || []);
  },

  fuel() {
    if (this.batches.length === 0) return { grammar: 0, vocab: 0, reading: 0, writing: 0, dictation: 0 };
    const seen = S.progress.seenIds;
    return {
      grammar: this.all('grammar').filter(q => !seen.includes(q.id)).length,
      vocab: this.all('vocabulary').filter(q => !seen.includes(q.id)).length,
      reading: this.all('reading').filter(q => !seen.includes(q.id)).length,
      writing: this.all('writing').filter(q => !seen.includes(q.id)).length,
      dictation: this.all('dictation').filter(q => !seen.includes(q.id)).length,
    };
  },

  totalFuel() {
    const f = this.fuel();
    return f.grammar + f.vocab + f.reading + f.writing + f.dictation;
  },

  getReachExercises(tag) {
    for (const batch of [...this.batches].reverse()) {
      if (batch.reach && batch.reach[tag]) {
        const pool = batch.reach[tag].filter(q => !S.progress.seenIds.includes(q.id));
        if (pool.length > 0) return pool;
      }
    }
    return [];
  },

  reachFuel() {
    const result = {};
    for (const batch of this.batches) {
      if (!batch.reach) continue;
      for (const [tag, exs] of Object.entries(batch.reach)) {
        if (!result[tag]) result[tag] = 0;
        result[tag] += exs.filter(q => !S.progress.seenIds.includes(q.id)).length;
      }
    }
    return result;
  },

  needsRefuel() {
    const f = this.fuel();
    return this.batches.length === 0 || f.grammar <= 5 || f.vocab <= 3 || f.reading === 0 || f.writing === 0;
  }
};


/* ═══════════════════════════════════════════════════════════════
   REFUEL.md GENERATOR — self-contained handoff for any Claude session
   ═══════════════════════════════════════════════════════════════ */

function generateRefuel() {
  const p = S.progress;
  const fuel = Batch.fuel();
  const reachFuel = Batch.reachFuel();
  const curriculum = Batch.current ? Batch.current.curriculum : { chapter: 1, section: 'unknown', phase: 'LEARN' };

  const recentSessions = p.sessions.slice(-5);
  const avgErrorRate = recentSessions.length > 0
    ? Math.round(recentSessions.reduce((s, r) => s + r.errorRate, 0) / recentSessions.length)
    : 0;

  const topErrors = Object.entries(p.errorPatterns)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 8)
    .map(([tag, count]) => `${tag} (${count} errors)`)
    .join(', ');

  const weakReachTags = Object.entries(reachFuel)
    .filter(([, count]) => count <= 2)
    .map(([tag]) => tag);

  const srsJson = JSON.stringify(p.srs, null, 2);

  const pendingWriting = p.writingSubmissions
    .map(ws => `### ${ws.id} [${ws.type || 'essay'}] (submitted ${ws.submitted})\n${ws.text}`)
    .join('\n\n');

  const exhaustedStr = p.seenIds.join(', ');

  const grammarTarget = Math.max(0, 25 - fuel.grammar);
  const vocabTarget = Math.max(0, 10 - fuel.vocab);
  const readingTarget = Math.max(0, 2 - fuel.reading);
  const writingTarget = Math.max(0, 3 - fuel.writing);
  const dictationTarget = Math.max(0, 5 - (fuel.dictation || 0));

  let difficultyDirective;
  const last3 = p.sessions.slice(-3);
  const avg3 = last3.length > 0 ? Math.round(last3.reduce((s, r) => s + r.errorRate, 0) / last3.length) : 0;
  if (last3.length < 2) {
    difficultyDirective = 'NOT ENOUGH DATA — use difficulty 2 (moderate) as default.';
  } else if (avg3 < 15) {
    difficultyDirective = `TOO EASY (${avg3}% errors). Increase difficulty to 3-4. Reduce MCQ to 30%, blank 40%, open 30%. Harder distractors. Less context hints.`;
  } else if (avg3 <= 25) {
    difficultyDirective = `SWEET ZONE (${avg3}% errors). Maintain current difficulty. Keep the mix balanced.`;
  } else {
    difficultyDirective = `TOO HARD (${avg3}% errors). Decrease difficulty to 1-2. Increase MCQ to 60%. Add more context hints. Reduce batch to 15 grammar.`;
  }

  const tagMasteryLines = Object.entries(p.tagMastery).map(([tag, tm]) => {
    const mcq = tm.mcq || { attempts: 0, correct: 0 };
    const blank = tm.blank || { attempts: 0, correct: 0 };
    const open = tm.open || { attempts: 0, correct: 0 };
    const mcqPct = mcq.attempts > 0 ? Math.round(mcq.correct / mcq.attempts * 100) : 0;
    const blankPct = blank.attempts > 0 ? Math.round(blank.correct / blank.attempts * 100) : 0;
    const unlocked = tagUnlockedType(tag);
    const types = unlocked === 'open' ? 'MCQ+Blank+Open' : unlocked === 'blank' ? 'MCQ+Blank' : 'MCQ only';
    return `- ${tag}: MCQ ${mcqPct}% (${mcq.attempts}), Blank ${blankPct}% (${blank.attempts}). Generate: ${types}`;
  }).join('\n');

  const exerciseStats = Object.values(p.exercises);
  const totalSeen = exerciseStats.length;
  const learning = exerciseStats.filter(e => e.mastery === 'learning').length;
  const familiar = exerciseStats.filter(e => e.mastery === 'familiar').length;
  const locked = exerciseStats.filter(e => e.mastery === 'locked').length;
  const dueToday = exerciseStats.filter(e => e.nextDue && e.nextDue <= todayStr()).length;

  return `# French Drill App — Refuel Request

## What This Is
Paste this into a Claude Code session. Run \`/french-batch\` or tell Claude to generate the next batch.
The app repo is at \`~/Projects/french-drills-v3/\`. Push the generated batch to \`batches/current.json\`.

## Current Position
- Chapter: ${curriculum.chapter}, Section: ${curriculum.section}, Phase: ${curriculum.phase}
- Batch ID: ${p.batch.id || 'none'}

## Difficulty Directive
${difficultyDirective}

## Performance (last ${recentSessions.length} sessions)
- Average error rate: ${avgErrorRate}%
- Top error patterns: ${topErrors || 'none yet'}

## Tag Mastery (determines which exercise types to generate per pattern)
${tagMasteryLines || 'No tag data yet — generate MCQ-only for all patterns.'}

## Exercise Pool State
- Total exercises seen: ${totalSeen}
- Due for review today: ${dueToday}
- Learning (every session): ${learning}
- Familiar (2-3 day intervals): ${familiar}
- Locked (7+ day intervals): ${locked}

## What's Running Low
- Grammar exercises remaining: ${fuel.grammar} ${fuel.grammar <= 5 ? '⚠️' : ''}
- Vocab words remaining: ${fuel.vocab} ${fuel.vocab <= 3 ? '⚠️' : ''}
- Reading passages remaining: ${fuel.reading} ${fuel.reading === 0 ? '⚠️' : ''}
- Writing prompts remaining: ${fuel.writing} ${fuel.writing === 0 ? '⚠️' : ''}

async function copyRefuel() {
  const md = generateRefuel();
  try {
    await navigator.clipboard.writeText(md);
    return true;
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = md;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }
}

const $ = id => document.getElementById(id);
const app = () => document.getElementById('app');
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

function todayStr() { return new Date().toISOString().slice(0, 10); }

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function formatDuration(ms) {
  const secs = Math.floor(ms / 1000);
  if (secs < 60) return secs + 's';
  const mins = Math.floor(secs / 60);
  const rem = secs % 60;
  return mins + 'm ' + (rem < 10 ? '0' : '') + rem + 's';
}

let _activeInput = null;

function insertAccent(ch) {
  if (!_activeInput || _activeInput.disabled) return;
  const s = _activeInput.selectionStart, e = _activeInput.selectionEnd;
  _activeInput.value = _activeInput.value.slice(0, s) + ch + _activeInput.value.slice(e);
  _activeInput.selectionStart = _activeInput.selectionEnd = s + 1;
  _activeInput.focus();
}

function renderAccentBar(disabled) {
  return (!disabled ? '<div class="center"><button class="keys-toggle" id="keys-toggle">accents ↑</button></div>' : '') +
    '<div class="keys" id="keys">' +
    ACCENTS.map(c => '<button class="key" data-c="' + c + '"' + (disabled ? ' disabled' : '') + '>' + c + '</button>').join('') +
    '</div>';
}

function bindAccentKeys() {
  const inputs = document.querySelectorAll('.field:not(:disabled)');
  inputs.forEach(inp => inp.addEventListener('focus', () => { _activeInput = inp; }));
  if (inputs.length > 0) {
    setTimeout(() => inputs[0].focus(), 60);
    setTimeout(() => {
      if (inputs[0]) inputs[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);
    _activeInput = inputs[0];
  }
  const toggle = $('keys-toggle'), keysEl = $('keys');
  if (toggle && keysEl) {
    toggle.onclick = () => {
      const open = keysEl.style.display === 'none';
      keysEl.style.display = open ? 'flex' : 'none';
      toggle.textContent = open ? 'accents ↑' : 'accents ↓';
    };
  }
  document.querySelectorAll('.key').forEach(k => {
    k.addEventListener('mousedown', e => e.preventDefault());
    k.onclick = () => insertAccent(k.dataset.c);
  });
}

function scoreRing(pct) {
  const r = 70, c = Math.round(2 * Math.PI * r);
  const offset = Math.round(c * (1 - pct / 100));
  return `<div class="score-wrap"><svg width="160" height="160" viewBox="0 0 160 160"><circle cx="80" cy="80" r="${r}" fill="none" stroke="var(--bar-track)" stroke-width="6"/><circle cx="80" cy="80" r="${r}" fill="none" stroke="var(--accent)" stroke-width="6" stroke-dasharray="${c}" stroke-dashoffset="${c}" stroke-linecap="round" transform="rotate(-90 80 80)" class="score-ring-fill" style="--target:${offset}"/></svg><div class="score-inner"><div class="res-score">${pct}%</div></div></div>`;
}

function speakBtn(text, cls) {
  if (!text) return '';
  if (!window.speechSynthesis) return '';
  const off = !Speech.hasFrenchVoice ? ' speak-btn-off' : '';
  return `<button class="speak-btn${off}${cls ? ' ' + cls : ''}" data-speak="${esc(text)}">${SPEAK_SVG}</button>`;
}

   BATCH LOADING — fetch current batch from repo
   ═══════════════════════════════════════════════════════════════ */

async function loadBatches() {
  if (!S.gh) return;
  Batch.batches = [];
  try {
    const regRaw = await S.gh.get('batches/registry.json');
    if (regRaw) {
      const reg = JSON.parse(regRaw);
      Batch.registry = reg;
      for (const entry of reg.batches) {
        try {
          const raw = await S.gh.get(`batches/${entry.file}`);
          if (raw) Batch.addBatch(raw);
        } catch (e) { /* skip missing batch */ }
      }
    }
  } catch (e) { /* no registry */ }
  if (Batch.batches.length === 0) {
    try {
      const raw = await S.gh.get('batches/current.json');
      if (raw) Batch.addBatch(raw);
    } catch (e) { /* no batch */ }
  }
  if (Batch.current) {
    S.progress.batch.id = Batch.current.batch_id;
    S.progress.batch.loaded = new Date().toISOString();
  }
}

/* ═══════════════════════════════════════════════════════════════
   SESSION — drill exercises one at a time
   ═══════════════════════════════════════════════════════════════ */

function startSession() {
  if (Batch.batches.length === 0) return;
  S.sessionCorrect = 0;
  S.sessionTotal = 0;
  S.sessionStartTime = Date.now();
  S.queue = buildSessionQueue();
  S.qi = 0;
  S.answered = false;
  S.currentAnswer = null;
  S.reachQueue = [];
  if (S.queue.length === 0) { S.screen = 'home'; render(); return; }
  S.screen = 'session';
  render();
}

function buildSessionQueue() {
  if (Batch.batches.length === 0) return [];
  const today = todayStr();
  const allGrammar = Batch.all('grammar').filter(q => exercisePassesGate(q));
  const vocab = Batch.all('vocabulary');
  const reading = Batch.all('reading');
  const writing = Batch.all('writing');
  const dictation = Batch.all('dictation');

  const due = [], errored = [], fresh = [];
  for (const q of allGrammar) {
    const rec = S.progress.exercises[q.id];
    if (!rec) { fresh.push(q); continue; }
    if (rec.streak === 0 && rec.attempts > 0) { errored.push(q); continue; }
    if (rec.nextDue && rec.nextDue <= today) { due.push(q); continue; }
  }

  due.sort((a, b) => {
    const ra = S.progress.exercises[a.id], rb = S.progress.exercises[b.id];
    return (ra.nextDue || '').localeCompare(rb.nextDue || '');
  });

  const grammarPool = [
    ...interleaveByTag(errored).slice(0, 5),
    ...interleaveByTag(due).slice(0, 5),
    ...interleaveByTag(fresh).slice(0, 5)
  ];

  const dueVocab = vocab.filter(q => SRS.isDue(getVocabCard(q.id)));
  shuffle(dueVocab);
  const newVocab = vocab.filter(q => !getVocabCard(q.id).lastReview && !dueVocab.includes(q));

  const writingFb = Batch.batches.flatMap(b => b.writing_feedback || []);
  const hasPendingWriting = S.progress.writingSubmissions.some(ws => {
    return !writingFb.find(f => f.id === ws.id);
  });

  const dictPool = dictation.filter(q => !S.progress.exercises[q.id]).slice(0, 3);
  dictPool.forEach(q => { q._isDictation = true; });

  const queue = [
    ...grammarPool,
    ...dueVocab.slice(0, 5),
    ...newVocab.slice(0, 3),
    ...dictPool,
    ...reading.filter(q => !S.progress.exercises[q.id]).slice(0, 1),
    ...(!hasPendingWriting ? writing.filter(q => !S.progress.exercises[q.id]).slice(0, 3) : [])
  ];

  return queue;
}

function interleaveByTag(exercises) {
  if (exercises.length <= 1) return exercises;
  const groups = {};
  for (const q of exercises) {
    const tag = (q.tags && q.tags[0]) || '_none';
    if (!groups[tag]) groups[tag] = [];
    groups[tag].push(q);
  }
  for (const tag in groups) shuffle(groups[tag]);
  const tags = Object.keys(groups);
  const result = [];
  let round = 0, added = true;
  while (added) {
    added = false;
    for (const tag of tags) {
      if (round < groups[tag].length) {
        result.push(groups[tag][round]);
        added = true;
      }
    }
    round++;
  }
  return result;
}

function queueReach(tags) {
  if (!tags || Batch.batches.length === 0) return;
  for (const tag of tags) {
    const pool = Batch.getReachExercises(tag);
    if (pool.length > 0) {
      const ex = { ...pool[0], _isReach: true };
      S.queue.splice(S.qi + 1, 0, ex);
      if (!S.progress.seenIds.includes(pool[0].id)) S.progress.seenIds.push(pool[0].id);
      return;
    }
  }
}

function renderSession() {
  if (S.qi >= S.queue.length) {
    endSession();
    return;
  }
  const q = S.queue[S.qi];
  const progress = Math.round(((S.qi) / S.queue.length) * 100);

  if (q.type === 'mcq') renderMCQ(q, progress);
  else if (q.type === 'blank' || q.type === 'open') renderBlank(q, progress);
  else if (q.type === 'why') renderMCQ(q, progress);
  else if (q._isDictation) renderDictation(q, progress);
  else if (q.word) renderVocabCard(q, progress);
  else if (q.passage) renderReading(q, progress);
  else if (q.prompt && q.guidelines) renderWriting(q, progress);
  else advanceSession();
}

function vocabMode(q) {
  const card = getVocabCard(q.id);
  if (card.reps >= 2 && (q.sentence_blank_en || q.sentence_en)) return 'production';
  return 'recognition';
}

function renderVocabCard(q, progress) {
  const card = getVocabCard(q.id);
  const mode = vocabMode(q);

  if (mode === 'recognition') return renderVocabRecognition(q, card, progress);
  return renderVocabProduction(q, card, progress);
}

  const tpl = q.template && TCF_TEMPLATES[q.template];
  if (!tpl) return '';
  return `
    <div class="tpl-toggle" id="tpl-toggle">${CHEVRON_SVG} ${esc(tpl.name)}</div>
    <div class="tpl-body" id="tpl-body">
      <ol>${tpl.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
    </div>`;
}

function renderWriting(q, progress) {
  const wtype = q.type || 'essay';
  const rows = wtype === 'micro' ? 3 : wtype === 'translate' ? 4 : 6;
  const placeholder = wtype === 'translate' ? 'Write the French translation...' : 'Write in French...';
  const typeLabel = wtype === 'micro' ? 'Quick Write' : wtype === 'translate' ? 'Translation' : 'Writing';

  app().innerHTML = `
    <div class="dp">
      ${renderSessionHeader(progress, typeLabel, 'type-writing')}
      <div class="dp-body">
        <div class="card">
          <div class="writing-type">${esc(typeLabel)}</div>
          <div class="serif" style="font-size:1.25rem">${esc(q.prompt)}</div>
          ${q.guidelines ? `<div class="sub mt-sm">${esc(q.guidelines)}</div>` : ''}
          <div class="sub" style="margin-top:.25rem">Level: ${esc(q.level || 'A1')}</div>
          ${wtype === 'translate' && q.source_en ? `<div class="source-text">${esc(q.source_en)}</div>` : ''}
          ${renderWritingTemplate(q)}
        </div>
        <textarea class="field mt" id="writing-area" rows="${rows}" placeholder="${placeholder}" style="resize:vertical;font-size:1rem;line-height:1.6"></textarea>
        ${renderAccentBar(false)}
        <button class="btn btn-p mt" id="submit-writing-btn">Submit</button>
        <button class="btn-link" id="skip-writing-btn">Skip for now</button>
      </div>
    </div>`;

  bindAccentKeys();
  const toggle = $('tpl-toggle'), body = $('tpl-body');
  if (toggle && body) {
    toggle.onclick = () => {
      toggle.classList.toggle('open');
      body.classList.toggle('show');
    };
  }
  $('submit-writing-btn').onclick = () => {
    const text = $('writing-area').value.trim();
    if (!text) return;
    S.progress.writingSubmissions.push({ id: q.id, type: wtype, text, submitted: new Date().toISOString() });
    if (!S.progress.seenIds.includes(q.id)) S.progress.seenIds.push(q.id);
    S.sessionTotal++;
    S.sessionCorrect++;
    advanceSession();
  };
  $('skip-writing-btn').onclick = advanceSession;
}

function advanceSession() {
  S.qi++;
  S.answered = false;
  S.currentAnswer = null;
  S.selfExplainPhase = false;
  S.readingSelections = {};
  S._lastTyped = '';
  if (S.qi >= S.queue.length) {
    endSession();
  } else {
    const appEl = document.getElementById('app');
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      appEl.style.opacity = '0';
    }
    render();
    requestAnimationFrame(() => { appEl.style.opacity = '1'; });
  }
}

function endSession() {
  const duration = Date.now() - (S.sessionStartTime || Date.now());
  recordSession(S.sessionCorrect, S.sessionTotal, duration);
  saveLocal();
  syncToGitHub();
  S.screen = 'results';
  render();
}


/* ═══════════════════════════════════════════════════════════════
   RESULTS — end-of-session summary
   ═══════════════════════════════════════════════════════════════ */

function renderResults() {
  const total = S.sessionTotal;
  const correct = S.sessionCorrect;
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
  const errorRate = total > 0 ? 100 - pct : 0;
  const duration = Date.now() - (S.sessionStartTime || Date.now());

  let zoneClass, zoneLabel;
  if (errorRate >= 15 && errorRate <= 25) { zoneClass = 'zone-sweet'; zoneLabel = 'Sweet zone — right level of challenge'; }
  else if (errorRate < 15) { zoneClass = 'zone-easy'; zoneLabel = 'Too easy — difficulty should increase'; }
  else { zoneClass = 'zone-hard'; zoneLabel = 'Too hard — review the basics first'; }

  app().innerHTML = `
    <div class="wrap" style="padding-top:8vh">
      <div class="center mb fade-up">
        ${scoreRing(pct)}
        <div class="res-msg mt-sm">${correct} of ${total} correct · ${formatDuration(duration)}</div>
      </div>

      <div class="zone-indicator ${zoneClass}">${zoneLabel}</div>
      <div class="sub mt-sm center">Coyle's 20% Rule: aim for 15–25% errors. That's where growth happens.</div>

      ${S.progress.streak.current > 0 ? `
        <div class="center mt">
          <div class="streak-badge">\u{1F525} ${S.progress.streak.current} day streak</div>
        </div>
      ` : ''}

      <div class="stat-row mt">
        <div class="stat-box">
          <div class="stat-val">${errorRate}%</div>
          <div class="stat-label">Error Rate</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${total}</div>
          <div class="stat-label">Exercises</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${formatDuration(duration)}</div>
          <div class="stat-label">Time</div>
        </div>
      </div>

      ${Batch.needsRefuel() ? `
        <div class="card mt" style="border-left:3px solid var(--warn)">
          <div class="card-title" style="color:var(--warn)">Fuel is low</div>
          <div class="card-sub">Copy the refuel file and paste it into Claude Code to generate more exercises.</div>
          <button class="btn btn-g btn-sm mt-sm" id="res-refuel-btn" style="width:auto;padding:.5rem 1rem">Copy REFUEL.md</button>
          <span class="sub" id="res-refuel-status" style="margin-left:.5rem"></span>
        </div>
      ` : ''}

      <button class="btn btn-p mt" id="home-btn">Back to Home</button>
      ${Batch.totalFuel() > 0 ? '<button class="btn btn-g mt-sm" id="again-btn">Practice More</button>' : ''}
    </div>`;

  $('home-btn').onclick = () => { S.screen = 'home'; render(); };
  if ($('again-btn')) $('again-btn').onclick = startSession;
  if ($('res-refuel-btn')) $('res-refuel-btn').onclick = async () => {
    const ok = await copyRefuel();
    $('res-refuel-status').textContent = ok ? 'Copied!' : 'Copy failed';
    $('res-refuel-btn').textContent = ok ? 'Copied' : 'Try again';
  };
}


/* ═══════════════════════════════════════════════════════════════
   SAVE & SYNC — localStorage + GitHub
   ═══════════════════════════════════════════════════════════════ */

function saveLocal() {
  if (!S.progress) return;
  S.progress.updated = new Date().toISOString();
  try { localStorage.setItem('fdv3_progress', JSON.stringify(S.progress)); } catch (e) { /* storage full */ }
}

function loadLocal() {
  try {
    const raw = localStorage.getItem('fdv3_progress');
    if (raw) return JSON.parse(raw);
  } catch (e) { /* corrupted */ }
  return null;
}

async function syncToGitHub() {
  if (!S.gh || !S.progress) return;
  try {
    S.progress.updated = new Date().toISOString();
    await S.gh.put('PROGRESS.json', JSON.stringify(S.progress, null, 2), `Progress update ${todayStr()}`);
  } catch (e) {
    // silent fail
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) saveLocal();
});


/* ═══════════════════════════════════════════════════════════════
   BOOT — check auth, load data, show appropriate screen
   ═══════════════════════════════════════════════════════════════ */

document.addEventListener('click', e => {
  const btn = e.target.closest('.speak-btn');
  if (btn) {
    e.stopPropagation();
    if (btn.classList.contains('speak-btn-off')) {
      if (!window.speechSynthesis) return;
      const voices = speechSynthesis.getVoices();
      const fr = voices.find(v => v.lang === 'fr-FR') || voices.find(v => v.lang.startsWith('fr'));
      if (fr) {
        Speech.voice = fr;
        Speech.hasFrenchVoice = true;
        btn.classList.remove('speak-btn-off');
      } else return;
    }
    Speech.speak(btn.dataset.speak, parseFloat(btn.dataset.rate) || 1);
  }
});

async function init() {
  Speech.init();
  const savedToken = localStorage.getItem('fdv3_token');
  const wasSetUp = localStorage.getItem('fdv3_setup');

  if (savedToken) {
    try {
      const gh = new GH(savedToken);
      const progRaw = await gh.get('PROGRESS.json');
      S.gh = gh;
      S.progress = progRaw ? migrateProgress(JSON.parse(progRaw)) : defaultProgress();
      const localProg = loadLocal();
      if (localProg) {
        const migrated = migrateProgress(localProg);
        if (migrated.updated && S.progress.updated && migrated.updated > S.progress.updated) {
          S.progress = migrated;
        }
      }
      await loadBatches();
      S.screen = 'home';
    } catch (e) {
      localStorage.removeItem('fdv3_token');
      S.screen = wasSetUp ? 'login' : 'setup';
    }
  } else {
    S.screen = wasSetUp ? 'login' : 'setup';
  }
  render();
}

init();
</script>
</body>
