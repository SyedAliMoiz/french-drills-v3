<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>French Drills V3</title>
<meta name="theme-color" content="#0E0E0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="canonical" href="https://syedalimoiz.com/french-drills-v3/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇫🇷</text></svg>">
<style>
:root {
  --bg: #FAFAF8;
  --surface: #FFFFFF;
  --text: #1A1A1A;
  --text-dim: #71706E;
  --accent: #7A6E5D;
  --accent-hover: #5E5347;
  --accent-on: #FFFFFF;
  --accent-faint: #F0ECE6;
  --ok: #4A7C55;
  --ok-bg: #EFF6F0;
  --ok-border: #A3CDA8;
  --err: #B04040;
  --err-bg: #FCF0F0;
  --err-border: #E0AAAA;
  --warn: #9A7B2F;
  --warn-bg: #FBF6EA;
  --warn-border: #E0CC8A;
  --line: #E5E3DF;
  --field-bg: #FFFFFF;
  --field-border: #D4D2CE;
  --field-focus: #7A6E5D;
  --key-bg: #F2F0EC;
  --key-hover: #E8E5E1;
  --key-border: #D4D2CE;
  --key-text: #1A1A1A;
  --bar-track: #E5E3DF;
  --bar-fill: #7A6E5D;
  --card-shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.03);
  --surface-elevated: #F2F0EC;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-pill: 99px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0E0E0D;--surface:#1A1A18;--text:#E8E6E1;--text-dim:#8A8884;
  --accent:#C9B99A;--accent-hover:#DDD0B8;--accent-on:#1A1A18;--accent-faint:#1C1A15;
  --ok:#6B9F78;--ok-bg:#121E14;--ok-border:#2D5435;
  --err:#C47070;--err-bg:#1E1212;--err-border:#5C2626;
  --warn:#C9A23E;--warn-bg:#1E1A0E;--warn-border:#5C4A1A;
  --line:#2A2926;--field-bg:#141413;--field-border:#3A3836;--field-focus:#C9B99A;
  --key-bg:#242320;--key-hover:#2E2D2A;--key-border:#3A3836;--key-text:#C8C5BF;
  --bar-track:#2A2926;--bar-fill:#C9B99A;--card-shadow:0 1px 4px rgba(0,0,0,.3);
  --surface-elevated:#222120;
}}
:root[data-theme="dark"]{
  --bg:#0E0E0D;--surface:#1A1A18;--text:#E8E6E1;--text-dim:#8A8884;
  --accent:#C9B99A;--accent-hover:#DDD0B8;--accent-on:#1A1A18;--accent-faint:#1C1A15;
  --ok:#6B9F78;--ok-bg:#121E14;--ok-border:#2D5435;
  --err:#C47070;--err-bg:#1E1212;--err-border:#5C2626;
  --warn:#C9A23E;--warn-bg:#1E1A0E;--warn-border:#5C4A1A;
  --line:#2A2926;--field-bg:#141413;--field-border:#3A3836;--field-focus:#C9B99A;
  --key-bg:#242320;--key-hover:#2E2D2A;--key-border:#3A3836;--key-text:#C8C5BF;
  --bar-track:#2A2926;--bar-fill:#C9B99A;--card-shadow:0 1px 4px rgba(0,0,0,.3);
  --surface-elevated:#222120;
}
:root[data-theme="light"]{
  --bg:#FAFAF8;--surface:#FFFFFF;--text:#1A1A1A;--text-dim:#71706E;
  --accent:#7A6E5D;--accent-hover:#5E5347;--accent-on:#FFFFFF;--accent-faint:#F0ECE6;
  --ok:#4A7C55;--ok-bg:#EFF6F0;--ok-border:#A3CDA8;
  --err:#B04040;--err-bg:#FCF0F0;--err-border:#E0AAAA;
  --warn:#9A7B2F;--warn-bg:#FBF6EA;--warn-border:#E0CC8A;
  --line:#E5E3DF;--field-bg:#FFFFFF;--field-border:#D4D2CE;--field-focus:#7A6E5D;
  --key-bg:#F2F0EC;--key-hover:#E8E5E1;--key-border:#D4D2CE;--key-text:#1A1A1A;
  --bar-track:#E5E3DF;--bar-fill:#7A6E5D;--card-shadow:0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.03);
  --surface-elevated:#F2F0EC;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
button,input,select,textarea{color:inherit;font:inherit}
body{font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.wrap{max-width:640px;margin:0 auto;padding:2rem 1.5rem}
.serif{font-family:Georgia,"Times New Roman",serif}
.hdr{font-size:1.375rem;font-weight:700;letter-spacing:-0.01em}
.sub{font-size:.8125rem;color:var(--text-dim)}
.label{font-size:.6875rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim)}
.tabnum{font-variant-numeric:tabular-nums}
.prog-track{height:4px;background:var(--bar-track);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:var(--bar-fill);border-radius:3px;transition:width .35s ease}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:1.25rem;box-shadow:var(--card-shadow);margin-bottom:.75rem}
.card-accent{border-left:3px solid var(--accent)}
.card-ok{border-left-color:var(--ok)}
.card-err{border-left-color:var(--err)}
.card-title{font-weight:600;margin-bottom:.25rem}
.card-sub{font-size:.8125rem;color:var(--text-dim)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;width:100%;font-family:inherit;font-size:1rem;font-weight:600;padding:.75rem 1.5rem;border:none;border-radius:var(--radius-md);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .15s,opacity .15s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-p{background:var(--accent);color:var(--accent-on);box-shadow:none}
.btn-p:hover:not(:disabled){filter:brightness(1.08)}
.btn-p:active:not(:disabled){transform:scale(.98);filter:brightness(.95)}
.btn-g{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn-g:hover:not(:disabled){background:var(--accent-faint)}
.btn-sm{font-size:.875rem;padding:.5rem 1rem}
.btn-ok{background:var(--ok);color:#fff}
.btn-link{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;padding:.5rem;font-size:.875rem;text-decoration:underline;text-underline-offset:2px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.field{width:100%;font-family:Georgia,"Times New Roman",serif;font-size:1.125rem;padding:.75rem;background:var(--field-bg);color:var(--text);border:1.5px solid var(--field-border);border-radius:var(--radius-sm);outline:none;transition:border-color .15s}
.field:focus{border-color:var(--field-focus)}
.field:disabled{opacity:.6;cursor:not-allowed}
.field-ok{border-color:var(--ok)!important;background:var(--ok-bg)!important}
.field-err{border-color:var(--err)!important;background:var(--err-bg)!important}
.field-pw{font-family:inherit;font-size:1rem}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin:.625rem 0}
.key{font-family:Georgia,serif;font-size:1rem;min-width:38px;height:36px;display:flex;align-items:center;justify-content:center;padding:0 4px;background:var(--key-bg);color:var(--key-text);border:1px solid var(--key-border);border-radius:var(--radius-sm);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .1s,transform .08s}
.key:hover{background:var(--surface-elevated)}
.key:active{transform:scale(.93)}
.key:disabled{opacity:.3;pointer-events:none}
.opts{display:flex;flex-direction:column;gap:.5rem;margin:.75rem 0}
.opt{display:flex;align-items:center;gap:.75rem;width:100%;padding:.875rem 1rem;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius-md);cursor:pointer;color:var(--text);font-family:Georgia,serif;font-size:1.0625rem;text-align:left;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:border-color .15s,background .15s}
.opt:hover:not(.opt-locked){border-color:var(--accent);background:var(--accent-faint)}
.opt-letter{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--accent-faint);color:var(--accent);font-family:system-ui,sans-serif;font-size:.8125rem;font-weight:700;flex-shrink:0}
.opt-locked{cursor:default;opacity:.5}
.opt-sel{border-color:var(--accent);background:var(--accent-faint)}
.opt-right{border-color:var(--ok)!important;background:var(--ok-bg)!important;opacity:1!important;animation:pop .25s ease}
.opt-right .opt-letter{background:var(--ok);color:#fff}
.opt-wrong{border-color:var(--err)!important;background:var(--err-bg)!important;opacity:1!important;animation:shake .35s ease}
.opt-wrong .opt-letter{background:var(--err);color:#fff}
.fb{padding:.875rem;border-radius:var(--radius-sm);font-size:.9375rem;line-height:1.5;margin-top:.75rem}
.fb-ok{background:var(--ok-bg);border:1px solid var(--ok-border);color:var(--ok)}
.fb-err{background:var(--err-bg);border:1px solid var(--err-border);color:var(--err)}
.fb-warn{background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn)}
.fb-head{font-weight:700;display:block;margin-bottom:.2rem}
.fb-rule{display:block;margin-top:.35rem;font-size:.8125rem;opacity:.85}
.fb-answer{font-family:Georgia,serif;font-weight:600}
.row{display:flex;align-items:center;gap:.75rem}
.col{display:flex;flex-direction:column;gap:.75rem}
.mt{margin-top:1rem}.mt-sm{margin-top:.5rem}.mb{margin-bottom:1rem}
.gap-sm{gap:.5rem}
.center{text-align:center}
.between{justify-content:space-between}
.flex1{flex:1}
.dash-section{margin-bottom:1.25rem}
.dash-section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:.5rem;padding-left:.25rem}
.stat-row{display:flex;gap:.5rem;flex-wrap:wrap}
.stat-box{flex:1;min-width:90px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:.875rem;text-align:center;box-shadow:var(--card-shadow)}
.stat-val{font-size:1.5rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.stat-label{font-size:.6875rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin-top:.125rem}
.res-score{font-family:Georgia,serif;font-size:3rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.res-msg{font-size:1.125rem;color:var(--text-dim);margin-bottom:1.5rem}

.dp{min-height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 30%, var(--surface) 0%, var(--bg) 60%)}
.dp-top{padding:1rem 1.5rem 0;width:100%;max-width:680px;margin:0 auto}
.dp-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:1rem 1.5rem 8rem;width:100%;max-width:680px;margin:0 auto;gap:.5rem}
.dp .card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius-md);padding:1.5rem;box-shadow:0 4px 20px rgba(0,0,0,.25)}
.dp .card.card-ok{background:var(--ok-bg);border-color:var(--ok-border);border-left-color:var(--ok)}
.dp .card.card-err{background:var(--err-bg);border-color:var(--err-border);border-left-color:var(--err)}
.dp .serif{font-size:2rem;line-height:1.35;letter-spacing:-0.01em;color:#F5F3EF;font-weight:700;overflow-wrap:break-word}
.dp .sub{font-size:1.375rem;line-height:1.5;margin-top:.75rem;color:#D4D0CB;font-weight:500}
@media(prefers-color-scheme:light){.dp .serif{color:#1A1714}.dp .sub{color:#6E6960}}
:root[data-theme="light"] .dp .serif{color:#1A1714}
:root[data-theme="light"] .dp .sub{color:#6E6960}
.dp .field{font-size:clamp(1.25rem,3vw,1.5rem);padding:1.125rem 1.25rem;border-radius:var(--radius-md);margin-top:1.25rem}
.dp .keys{gap:10px;margin:.75rem 0;justify-content:center}
.dp .key{min-width:48px;height:48px;font-size:1.25rem;border-radius:var(--radius-md)}
.dp .keys-toggle{background:none;border:none;color:var(--text-dim);font-size:.875rem;cursor:pointer;padding:.5rem;margin-top:.5rem;-webkit-tap-highlight-color:transparent}
.dp .keys-toggle:hover{color:var(--text)}
.dp .btn{padding:1.125rem;font-size:clamp(1.0625rem,2.5vw,1.25rem);border-radius:var(--radius-md)}
.dp .opts{gap:.75rem;margin-top:1.25rem}
.dp .opt{padding:1.25rem 1.375rem;font-size:clamp(1.125rem,2.8vw,1.375rem);border-radius:var(--radius-md);border:1.5px solid var(--line);background:var(--surface-elevated);box-shadow:0 2px 8px rgba(0,0,0,.15);transition:border-color .2s,background .2s,box-shadow .2s,transform .2s}
.dp .opt:hover:not(.opt-locked){border-color:var(--accent);background:var(--accent-faint);box-shadow:0 0 0 1px var(--accent);transform:translateY(-1px)}
.dp .opt-right{border-radius:var(--radius-md)!important}
.dp .opt-wrong{border-radius:var(--radius-md)!important}
.dp .opt-letter{width:36px;height:36px;font-size:.9375rem;border-radius:50%;background:var(--accent);color:var(--accent-on);font-weight:700}
.dp .fb{padding:1.25rem 1.375rem;border-radius:var(--radius-md);font-size:clamp(1rem,2.5vw,1.1875rem);margin-top:1.5rem}
.dp .fb-head{font-size:clamp(1.0625rem,2.5vw,1.25rem)}
.dp .fb-rule{font-size:clamp(.9375rem,2.2vw,1.0625rem);line-height:1.55}
.dp .fb-answer{font-size:clamp(1.0625rem,2.5vw,1.25rem)}
.dp .prog-track{height:6px;border-radius:3px}
.dp-count{font-size:.875rem;color:var(--text-dim);font-variant-numeric:tabular-nums}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.015)}100%{transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes ringFill{to{stroke-dashoffset:var(--target)}}
.shake{animation:shake .35s ease}
.pop{animation:pop .3s ease}
.fade-up{animation:fadeUp .4s ease-out both}
.stagger>*{animation:fadeUp .4s ease-out both}
.stagger>:nth-child(1){animation-delay:0s}
.stagger>:nth-child(2){animation-delay:.06s}
.stagger>:nth-child(3){animation-delay:.12s}
.stagger>:nth-child(4){animation-delay:.18s}
.stagger>:nth-child(5){animation-delay:.24s}
.stagger>:nth-child(6){animation-delay:.3s}
.stagger>:nth-child(7){animation-delay:.36s}
.stagger>:nth-child(8){animation-delay:.42s}
.score-ring-fill{animation:ringFill 1.2s ease-out .3s forwards}
.score-wrap{position:relative;width:160px;height:160px;margin:0 auto}
.score-inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
@media(prefers-reduced-motion:reduce){.shake,.pop,.fade-up,.stagger>*,.score-ring-fill,.opt-right,.opt-wrong{animation:none}.prog-fill{transition:none}#app{transition:none}.dp .opt:hover:not(.opt-locked){transform:none}}

.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sync{display:flex;align-items:center;gap:.375rem;font-size:.75rem;color:var(--text-dim);padding:.375rem .75rem;border-radius:var(--radius-pill);background:var(--surface);border:1px solid var(--line)}
.sync-ok{color:var(--ok);border-color:var(--ok-border)}
.sync-err{color:var(--err);border-color:var(--err-border)}
.auth-logo{font-size:3rem;margin-bottom:.5rem}
.auth-title{font-family:'Inter',system-ui,sans-serif;font-size:1.5rem;font-weight:700;margin-bottom:.25rem;letter-spacing:-.01em}
.auth-sub{color:var(--text-dim);font-size:.875rem;margin-bottom:1.5rem}
.form-group{margin-bottom:1rem}
.form-label{display:block;font-size:.8125rem;font-weight:600;margin-bottom:.375rem;color:var(--text-dim)}
.form-help{font-size:.75rem;color:var(--text-dim);margin-top:.25rem}
.error-msg{color:var(--err);font-size:.875rem;font-weight:500;margin-bottom:.75rem}
.checkbox-row{display:flex;align-items:center;gap:.5rem;font-size:.875rem;margin:.75rem 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.checkbox-row input{width:18px;height:18px;accent-color:var(--accent)}
.streak-badge{display:inline-flex;align-items:center;gap:.375rem;font-size:.875rem;font-weight:700;color:var(--accent);padding:.3125rem .875rem;background:var(--accent-faint);border:1px solid var(--line);border-radius:var(--radius-pill)}

.fuel-row{display:flex;align-items:center;gap:.75rem;padding:.625rem 0;border-bottom:1px solid var(--line)}
.fuel-row:last-child{border-bottom:none}
.fuel-label{flex:1;font-size:.875rem;font-weight:500}
.fuel-count{font-size:.875rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:2.5rem;text-align:right}
.fuel-bar{flex:2;height:6px;border-radius:3px;background:var(--bar-track);overflow:hidden}
.fuel-bar-fill{height:100%;border-radius:3px;transition:width .3s}
.fuel-ok{background:var(--ok)}
.fuel-low{background:var(--warn)}
.fuel-empty{background:var(--err)}

.zone-indicator{display:flex;align-items:center;gap:.5rem;padding:.75rem 1rem;border-radius:var(--radius-md);font-size:.875rem;font-weight:600}
.zone-sweet{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-border)}
.zone-easy{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border)}
.zone-hard{background:var(--err-bg);color:var(--err);border:1px solid var(--err-border)}

.type-badge{display:inline-block;font-size:.6875rem;font-weight:600;padding:.125rem .5rem;border-radius:var(--radius-pill);text-transform:uppercase;letter-spacing:.04em}
.type-grammar{background:var(--accent-faint);color:var(--accent)}
.type-vocab{background:var(--ok-bg);color:var(--ok)}
.type-reading{background:var(--warn-bg);color:var(--warn)}
.type-writing{background:#F0ECE6;color:#7A6E5D}
@media(prefers-color-scheme:dark){.type-writing{background:#1C1A15;color:#C9B99A}}
:root[data-theme="dark"] .type-writing{background:#1C1A15;color:#C9B99A}
:root[data-theme="light"] .type-writing{background:#F0ECE6;color:#7A6E5D}
.type-reach{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border)}
.reach-label{font-size:.75rem;color:var(--warn);font-weight:600;letter-spacing:.04em}
.writing-fb-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:1rem;margin-bottom:.75rem;border-left:3px solid var(--accent);box-shadow:var(--card-shadow)}
.writing-fb-original{font-style:italic;color:var(--text-dim);font-size:.875rem;margin-bottom:.5rem}
.writing-fb-correction{font-size:.9375rem;line-height:1.6}
.writing-fb-correction mark{background:var(--ok-bg);color:var(--ok);border-radius:2px;padding:0 .125rem}

.sec-pills{display:flex;flex-wrap:wrap;gap:.5rem}
.sec-pill{font-size:.8125rem;font-weight:600;padding:.4375rem .875rem;border-radius:var(--radius-pill);white-space:nowrap}
.sec-done{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-border)}
.sec-current{background:var(--accent-faint);color:var(--accent);border:1px solid var(--accent)}
.sec-future{background:var(--surface);color:var(--text-dim);border:1px solid var(--line)}

.speak-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:none;background:var(--accent-faint);color:var(--accent);border-radius:50%;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .15s,transform .08s;flex-shrink:0;vertical-align:middle;margin-left:.25rem}
.speak-btn:hover{background:var(--accent);color:var(--accent-on)}
.speak-btn:active{transform:scale(.9)}
.speak-btn svg{width:16px;height:16px;fill:currentColor}
.dp .speak-btn{width:40px;height:40px}
.dp .speak-btn svg{width:20px;height:20px}
.speak-lg{width:72px!important;height:72px!important;margin:0}
.speak-lg svg{width:36px!important;height:36px!important}
.dictation-controls{display:flex;align-items:center;justify-content:center;gap:1rem;margin:.75rem 0}
.type-dictation{background:#ECFEFF;color:#0891B2}

const ALL_SECTION_IDS = Object.values(CURRICULUM).flatMap(ch => ch.sections.map(s => s.id));

function exerciseSection(exercise) {
  if (!exercise.tags) return null;
  for (const tag of exercise.tags) {
    if (ALL_SECTION_IDS.includes(tag)) return tag;
  }
  for (const tag of exercise.tags) {
    if (SECTION_TAG_MAP[tag]) return SECTION_TAG_MAP[tag];
  }
  return null;
}

function preprocessBatch(batch) {
  for (const ex of (batch.grammar || [])) {
    const section = exerciseSection(ex);
    if (section && !ex.tags.includes(section)) ex.tags.push(section);
    ex._section = section;
  }
  if (batch.reach) {
    for (const exs of Object.values(batch.reach)) {
      for (const ex of exs) {
        const section = exerciseSection(ex);
        if (section && ex.tags && !ex.tags.includes(section)) ex.tags.push(section);
        ex._section = section;
      }
    }
  }
}

function xpForLevel(lv) { return lv <= 1 ? 0 : (lv - 1) * (lv - 1) * 50; }
function xpLevel(total) { return Math.floor(Math.sqrt(total / 50)) + 1; }
function xpProgress(total) {
  const lv = xpLevel(total);
  const cur = xpForLevel(lv);
  const next = xpForLevel(lv + 1);
  return { level: lv, current: total - cur, needed: next - cur, pct: Math.round(((total - cur) / (next - cur)) * 100) };
}

function calcExerciseXP(exercise, correct, isReach) {
  if (!correct) return 0;
  let base = 0;
  if (exercise._isDictation) base = XP_TABLE.dictation;
  else if (exercise._isListening) base = XP_TABLE.listening;
  else if (exercise.word) base = (vocabMode(exercise) === 'production') ? XP_TABLE.vocab_prod : XP_TABLE.vocab_rec;
  else if (exercise.passage) base = XP_TABLE.reading;
  else if (exercise.tcf_tache || (exercise.prompt && exercise.guidelines)) base = XP_TABLE.writing;
  else if (exercise.type === 'mcq' || exercise.type === 'why') base = XP_TABLE.mcq;
  else if (exercise.type === 'blank') base = XP_TABLE.blank;
  else if (exercise.type === 'open') base = XP_TABLE.open;
  else base = 10;
  if (isReach) base += XP_TABLE.reach;
  if (Math.random() < 0.15) { S._lastBonus = true; return base * 2; }
  S._lastBonus = false;
  return base;
}

function addXP(amount) {
  if (!S.progress.xp) S.progress.xp = { total: 0, level: 1 };
  S.progress.xp.total += amount;
  S.progress.xp.level = xpLevel(S.progress.xp.total);
}

function unlockAchievement(id) {
  if (!S.progress.achievements) S.progress.achievements = {};
  if (S.progress.achievements[id]) return false;
  S.progress.achievements[id] = { unlocked: new Date().toISOString(), fresh: true };
  return true;
}

function checkAchievements() {
  const p = S.progress;
  const totalEx = Object.keys(p.exercises).length;
  const totalErrors = Object.values(p.errorPatterns).reduce((s, v) => s + v, 0);
  const vocabLearned = Object.values(p.srs).filter(c => c.reps >= 2).length;
  const sessionCount = p.sessions.length;
  const lastSession = p.sessions[p.sessions.length - 1];
  const hour = new Date().getHours();
  const newly = [];

  if (totalEx >= 1 && unlockAchievement('first-note')) newly.push('first-note');
  if (totalEx >= 100 && unlockAchievement('centurion')) newly.push('centurion');
  if (totalEx >= 500 && unlockAchievement('500-club')) newly.push('500-club');
  if (sessionCount >= 5 && unlockAchievement('deep-5')) newly.push('deep-5');
  if (lastSession) {
    if (lastSession.errorRate >= 15 && lastSession.errorRate <= 25 && unlockAchievement('sweet-spot')) newly.push('sweet-spot');
    if (lastSession.correct === lastSession.exercises && lastSession.exercises >= 10 && unlockAchievement('perfect')) newly.push('perfect');
    if (lastSession.exercises >= 30 && unlockAchievement('marathon')) newly.push('marathon');
  }
  if (p.streak.current >= 3 && unlockAchievement('streak-3')) newly.push('streak-3');
  if (p.streak.current >= 7 && unlockAchievement('streak-7')) newly.push('streak-7');
  if (p.streak.current >= 14 && unlockAchievement('streak-14')) newly.push('streak-14');
  if (p.streak.current >= 30 && unlockAchievement('streak-30')) newly.push('streak-30');
  if (p.curriculum.completedSections.length > 0 && unlockAchievement('section-master')) newly.push('section-master');
  if (p.curriculum.chapterPhase === 'TEST' && unlockAchievement('chapter-champ')) newly.push('chapter-champ');
  if (vocabLearned >= 50 && unlockAchievement('word-50')) newly.push('word-50');
  if (vocabLearned >= 100 && unlockAchievement('word-100')) newly.push('word-100');
  if (totalErrors >= 100 && unlockAchievement('error-100')) newly.push('error-100');
  if (p.writingSubmissions.length >= 5 && unlockAchievement('writer')) newly.push('writer');
  if (hour < 8 && unlockAchievement('early-bird')) newly.push('early-bird');
  if (hour >= 22 && unlockAchievement('night-owl')) newly.push('night-owl');
  const xpLv = p.xp ? p.xp.level : 1;
  if (xpLv >= 5 && unlockAchievement('level-5')) newly.push('level-5');
  if (xpLv >= 10 && unlockAchievement('level-10')) newly.push('level-10');
  if ((p.weeklyQuizzes || []).length >= 1 && unlockAchievement('quiz-first')) newly.push('quiz-first');
  const lastQuiz = (p.weeklyQuizzes || []).length > 0 ? p.weeklyQuizzes[p.weeklyQuizzes.length - 1] : null;
  if (lastQuiz && lastQuiz.pct >= 90 && unlockAchievement('quiz-ace')) newly.push('quiz-ace');
  if ((p.challengesDone || []).some(c => c.passed) && unlockAchievement('challenge-win')) newly.push('challenge-win');
  if ((p.bossDefeated || []).length > 0 && unlockAchievement('boss-slayer')) newly.push('boss-slayer');

  return newly;
}

function earnFreezeDays() {
  const p = S.progress;
  if (!p.streak.freezeDays && p.streak.freezeDays !== 0) p.streak.freezeDays = 1;
  if (p.streak.current > 0 && p.streak.current % 7 === 0 && p.streak.freezeDays < 3) {
    const lastEarned = p.streak._lastFreezeStreak || 0;
    if (p.streak.current > lastEarned) {
      p.streak.freezeDays++;
      p.streak._lastFreezeStreak = p.streak.current;
    }
  }
}

  init() {

    const pick = () => {
      const voices = speechSynthesis.getVoices();
      this.voice = voices.find(v => v.lang === 'fr-FR') ||
                   voices.find(v => v.lang.startsWith('fr')) || null;
      this.ready = voices.length > 0;
      const hadVoice = this.hasFrenchVoice;
      this.hasFrenchVoice = !!this.voice;
      if (!hadVoice && this.hasFrenchVoice) {
        document.querySelectorAll('.speak-btn-off').forEach(el => el.classList.remove('speak-btn-off'));
        document.querySelectorAll('.speak-link-off').forEach(el => el.classList.remove('speak-link-off'));
      }
    };
    pick();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = pick;
    }
  },
  speak(text, rate) {
    if (!window.speechSynthesis || !text) return;
    speechSynthesis.cancel();
    if (!this.voice) {
      const voices = speechSynthesis.getVoices();
      this.voice = voices.find(v => v.lang === 'fr-FR') ||
                   voices.find(v => v.lang.startsWith('fr')) || null;
    }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    if (this.voice) u.voice = this.voice;
    u.rate = rate || 1;
    speechSynthesis.speak(u);
  }
};


/* ═══════════════════════════════════════════════════════════════
   CRYPTO — AES-256-GCM password encryption for PAT
   ═══════════════════════════════════════════════════════════════ */

const Cry = {
  async deriveKey(pw, salt) {
    const raw = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:100000, hash:'SHA-256' }, raw, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
  },
  async encrypt(pw, text) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await this.deriveKey(pw, salt);
    const enc = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(text));
    return { s: this.b64(salt), i: this.b64(iv), d: this.b64(new Uint8Array(enc)) };
  },
  async decrypt(pw, bundle) {
    const salt = this.unb64(bundle.s), iv = this.unb64(bundle.i), data = this.unb64(bundle.d);
    const key = await this.deriveKey(pw, salt);
    const dec = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, data);
    return new TextDecoder().decode(dec);
  },
  b64(u8) { return btoa(String.fromCharCode(...u8)); },
  unb64(s) { return new Uint8Array(atob(s).split('').map(c => c.charCodeAt(0))); }
};


/* ═══════════════════════════════════════════════════════════════
   GITHUB API — Read/write files to the repo
   ═══════════════════════════════════════════════════════════════ */

class GH {
  constructor(token) {
    this.token = token;
    this.api = `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents`;
    this.shas = {};
  }
  headers() {
    const h = { 'Accept': 'application/vnd.github.v3+json' };
    if (this.token) h['Authorization'] = `Bearer ${this.token}`;
    return h;
  }
  encodePath(path) {
    return path.split('/').map(s => encodeURIComponent(s)).join('/');
  }
  async get(path) {
    const r = await fetch(`${this.api}/${this.encodePath(path)}`, { headers: this.headers() });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error(`GitHub ${r.status}: ${(await r.json()).message}`);
    const d = await r.json();
    this.shas[path] = d.sha;
    const bin = atob(d.content.replace(/\n/g, ''));
    return new TextDecoder().decode(new Uint8Array([...bin].map(c => c.charCodeAt(0))));
  }
  async put(path, content, msg) {
    const bytes = new TextEncoder().encode(content);
    const b64 = btoa(String.fromCharCode(...bytes));
    const body = { message: msg, content: b64 };
    if (this.shas[path]) body.sha = this.shas[path];
    const r = await fetch(`${this.api}/${this.encodePath(path)}`, {
      method: 'PUT',
      headers: { ...this.headers(), 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!r.ok) {
      const e = await r.json();
      if (r.status === 409 && !this.shas[path]) {
        await this.get(path);
        return this.put(path, content, msg);
      }
      throw new Error(`GitHub ${r.status}: ${e.message}`);
    }
    const d = await r.json();
    this.shas[path] = d.content.sha;
  }
}


/* ═══════════════════════════════════════════════════════════════
   SRS ENGINE — SM-2 spaced repetition for vocabulary
   ═══════════════════════════════════════════════════════════════ */

const SRS = {
  defaultCard() {
    return { ef: 2.5, interval: 0, reps: 0, nextReview: null, lastReview: null };
  },

  update(card, grade) {
    const today = todayStr();
    card.lastReview = today;
    if (grade >= 3) {
      if (card.reps === 0) card.interval = 1;
      else if (card.reps === 1) card.interval = 3;
      else card.interval = Math.round(card.interval * card.ef);
      card.ef = Math.max(1.3, card.ef + 0.1 - (5 - grade) * (0.08 + (5 - grade) * 0.02));
      card.reps++;
    } else {
      card.reps = 0;
      card.interval = 1;
    }
    const d = new Date(today + 'T00:00:00');
    d.setDate(d.getDate() + card.interval);
    card.nextReview = d.toISOString().slice(0, 10);
    return card;
  },

  isDue(card) {
    if (!card.nextReview) return true;
    return card.nextReview <= todayStr();
  },

  daysOverdue(card) {
    if (!card.nextReview) return 999;
    const diff = Math.floor((new Date(todayStr() + 'T00:00:00') - new Date(card.nextReview + 'T00:00:00')) / 86400000);
    return Math.max(0, diff);
  },

  gradeFromPct(pct) {
    if (pct >= 1.0) return 5;
    if (pct >= 0.8) return 4;
    if (pct >= 0.6) return 3;
    if (pct >= 0.4) return 2;
    if (pct >= 0.2) return 1;
    return 0;
  }
};


/* ═══════════════════════════════════════════════════════════════
   ANSWER CHECKING — accent-tolerant matching
   ═══════════════════════════════════════════════════════════════ */

function normText(s) {
  return s.trim().normalize('NFC').replace(/['’ʼ`′]/g, "'").replace(/\s+/g, ' ').replace(/[.!?,;…]+$/, '').toLowerCase();
}

function stripAccents(s) {
  return s.normalize('NFD').replace(/[̀-ͯ]/g, '');
}

function checkAnswer(given, correct, alternates) {
  const g = normText(given), c = normText(correct);
  if (g === c || stripAccents(g) === stripAccents(c)) return true;
  if (alternates) {
    for (const alt of alternates) {
      const a = normText(alt);
      if (g === a || stripAccents(g) === stripAccents(a)) return true;
    }
  }
  return false;
}


/* ═══════════════════════════════════════════════════════════════
   PROGRESS — V4 data model (spaced retrieval + tag mastery)
   ═══════════════════════════════════════════════════════════════ */

function defaultProgress() {
  return {
    v: 10,
    updated: null,
    exercises: {},
    srs: {},
    errorPatterns: {},
    tagMastery: {},
    writingSubmissions: [],
    speakingDone: [],
    weakTags: {},
    sessions: [],
    streak: { current: 0, best: 0, lastDate: null, freezeDays: 1, freezeUsed: [] },
    batch: { id: null, loaded: null },
    seenIds: [],
    curriculum: { chapter: 1, currentSection: 's1-gender', completedSections: [], chapterPhase: 'LEARN' },
    xp: { total: 0, level: 1 },
    achievements: {},
    weeklyQuizzes: [],
    challengesDone: [],
    bossDefeated: []
  };

function migrateProgress(p) {
  if (p.v <= 3) {
    if (p.exhaustedIds) { p.seenIds = p.exhaustedIds; delete p.exhaustedIds; }
    if (!p.tagMastery) p.tagMastery = {};
    for (const [id, rec] of Object.entries(p.exercises || {})) {
      if (!rec.streak) rec.streak = rec.correct > 0 ? 1 : 0;
      if (!rec.nextDue) rec.nextDue = todayStr();
      if (!rec.mastery) rec.mastery = rec.streak >= 4 ? 'locked' : rec.streak >= 2 ? 'familiar' : 'learning';
    }
    p.v = 4;
  }
  if (p.v <= 4) {
    if (!p.curriculum) {
      p.curriculum = { chapter: 1, currentSection: 's1-gender', completedSections: [], chapterPhase: 'LEARN' };
    }
    p.v = 5;
  }
  if (p.v <= 5) {
    if (!p.xp) p.xp = { total: 0, level: 1 };
    if (!p.achievements) p.achievements = {};
    if (p.streak.freezeDays === undefined) p.streak.freezeDays = 1;
    if (!p.streak.freezeUsed) p.streak.freezeUsed = [];
    p.v = 6;
  }
  if (p.v <= 6) {
    if (!p.speakingDone) p.speakingDone = [];
    p.v = 7;
  }
  if (p.v <= 7) {
    p.v = 8;
  }
  if (p.v <= 8) {
    if (!p.weakTags) p.weakTags = {};
    p.v = 9;
  }
  if (p.v <= 9) {
    if (!p.weeklyQuizzes) p.weeklyQuizzes = [];
    if (!p.challengesDone) p.challengesDone = [];
    if (!p.bossDefeated) p.bossDefeated = [];
    p.v = 10;
  }
  if (!p.seenIds) p.seenIds = [];
  if (!p.tagMastery) p.tagMastery = {};
  if (!p.weakTags) p.weakTags = {};
  if (!p.curriculum) p.curriculum = { chapter: 1, currentSection: 's1-gender', completedSections: [], chapterPhase: 'LEARN' };
  if (!p.xp) p.xp = { total: 0, level: 1 };
  if (!p.achievements) p.achievements = {};
  if (p.streak.freezeDays === undefined) p.streak.freezeDays = 1;
  if (!p.streak.freezeUsed) p.streak.freezeUsed = [];
  if (!p.speakingDone) p.speakingDone = [];
  if (!p.weeklyQuizzes) p.weeklyQuizzes = [];
  if (!p.challengesDone) p.challengesDone = [];
  if (!p.bossDefeated) p.bossDefeated = [];
  return p;
}

function exerciseInterval(streak) {
  if (streak <= 1) return 0;
  if (streak === 2) return 1;
  if (streak === 3) return 3;
  if (streak === 4) return 7;
  return Math.min(30, 7 * Math.pow(1.5, streak - 4));
}

function recordExercise(id, correct, tags) {
  const p = S.progress;
  if (!p.exercises[id]) p.exercises[id] = { attempts: 0, correct: 0, streak: 0, lastSeen: null, nextDue: null, mastery: 'learning' };
  const rec = p.exercises[id];
  rec.attempts++;
  if (correct) {
    rec.correct++;
    rec.streak++;
  } else {
    rec.streak = 0;
  }
  rec.lastSeen = todayStr();
  if (rec.streak >= 4) rec.mastery = 'locked';
  else if (rec.streak >= 2) rec.mastery = 'familiar';
  else rec.mastery = 'learning';
  const interval = exerciseInterval(rec.streak);
  const d = new Date(todayStr() + 'T00:00:00');
  d.setDate(d.getDate() + interval);
  rec.nextDue = d.toISOString().slice(0, 10);
  if (!p.seenIds.includes(id)) p.seenIds.push(id);
  if (tags) {
    if (!correct) {
      for (const tag of tags) p.errorPatterns[tag] = (p.errorPatterns[tag] || 0) + 1;
    }
    updateTagMastery(tags, correct, S.queue[S.qi]);
  }
  const exercise = S.queue[S.qi];
  const xpGain = calcExerciseXP(exercise, correct, exercise && exercise._isReach);
  if (xpGain > 0) {
    addXP(xpGain);
    S._sessionXP = (S._sessionXP || 0) + xpGain;
    if (exercise._isReach && correct) unlockAchievement('clarissa');
  }
  saveLocal();
}

function updateTagMastery(tags, correct, exercise) {
  if (!exercise || !exercise.type) return;
  const p = S.progress;
  const type = exercise.type;
  for (const tag of tags) {
    if (!p.tagMastery[tag]) p.tagMastery[tag] = {};
    const tm = p.tagMastery[tag];
    const key = (type === 'mcq' || type === 'why') ? 'mcq' : (type === 'blank') ? 'blank' : 'open';
    if (!tm[key]) tm[key] = { attempts: 0, correct: 0 };
    tm[key].attempts++;
    if (correct) tm[key].correct++;
  }
}

function tagUnlockedType(tag) {
  const tm = S.progress.tagMastery[tag];
  if (!tm) return 'mcq';
  const mcq = tm.mcq || { attempts: 0, correct: 0 };
  const blank = tm.blank || { attempts: 0, correct: 0 };
  if (blank.attempts >= 4 && blank.correct / blank.attempts >= 0.75) return 'open';
  if (mcq.attempts >= 6 && mcq.correct / mcq.attempts >= 0.75) return 'blank';
  return 'mcq';
}

function sectionStatus(sectionId) {
  const unlocked = tagUnlockedType(sectionId);
  if (unlocked === 'open') return 'complete';
  if (unlocked === 'blank') return 'advancing';
  const tm = S.progress.tagMastery[sectionId];
  if (tm && tm.mcq && tm.mcq.attempts > 0) return 'learning';
  return 'new';
}

function exercisePassesGate(exercise) {
  if (!exercise.tags || exercise.tags.length === 0) return true;
  if (exercise.type === 'why') return true;
  const maxUnlocked = exercise.tags.reduce((best, tag) => {
    const level = tagUnlockedType(tag);
    const rank = { mcq: 0, blank: 1, open: 2 };
    return rank[level] > rank[best] ? level : best;
  }, 'mcq');
  const typeRank = { mcq: 0, blank: 1, open: 2 };
  const exType = (exercise.type === 'mcq' || exercise.type === 'why') ? 'mcq' : (exercise.type === 'blank') ? 'blank' : 'open';
  return typeRank[exType] <= typeRank[maxUnlocked];
}

function exerciseSkill(q) {
  if (!q) return 'grammar';
  if (q._isDictation) return 'dictation';
  if (q._isListening) return 'listening';
  if (q.word) return 'vocab';
  if (q.passage) return 'reading';
  if (q.tcf_tache || (q.prompt && q.guidelines)) return 'writing';
  return 'grammar';
}

function trackAnswer(rightCount, wrongCount, errorDetail) {
  const q = S.queue[S.qi];
  const skill = exerciseSkill(q);
  const stats = S.sessionStats;
  if (!stats) return;

  const now = Date.now();
  const responseTime = S._exerciseStartTime ? now - S._exerciseStartTime : 0;
  if (!stats.responseTimes) stats.responseTimes = [];
  if (responseTime > 0 && responseTime < 300000) stats.responseTimes.push(responseTime);
  S._exerciseStartTime = now;

  if (!stats.bySkill[skill]) stats.bySkill[skill] = { right: 0, wrong: 0 };
  stats.bySkill[skill].right += rightCount;
  stats.bySkill[skill].wrong += wrongCount;

  const rawTags = q && q.tags ? q.tags : [];
  const tags = rawTags.length > 0 ? rawTags : [skill];
  for (const tag of tags) {
    if (!stats.byTag[tag]) stats.byTag[tag] = { right: 0, wrong: 0, consRight: 0, consWrong: 0 };
    const t = stats.byTag[tag];
    t.right += rightCount;
    t.wrong += wrongCount;
    if (wrongCount === 0) {
      t.consRight++;
      t.consWrong = 0;
    } else {
      t.consWrong++;
      t.consRight = 0;
    }
  }

  if (errorDetail && wrongCount > 0) {
    if (!stats.errors) stats.errors = [];
    stats.errors.push({ tags: tags.slice(), wrong: errorDetail.wrong, correct: errorDetail.correct, skill, id: q ? q.id : null });
  }
}

function diagnoseErrors(tag) {
  const stats = S.sessionStats;
  if (!stats || !stats.errors) return null;
  const errors = stats.errors.filter(e => e.tags && e.tags.includes(tag));
  if (errors.length < 2) return null;

  const wrongCounts = {};
  errors.forEach(e => {
    if (e.wrong) wrongCounts[e.wrong] = (wrongCounts[e.wrong] || 0) + 1;
  });
  const repeated = Object.entries(wrongCounts).find(([, count]) => count >= 2);
  if (repeated) return `You keep choosing "${repeated[0]}." What makes it wrong here?`;

  const accentOnly = errors.filter(e =>
    e.wrong && e.correct &&
    stripAccents(e.wrong.toLowerCase().trim()) === stripAccents(e.correct.toLowerCase().trim())
  );
  if (accentOnly.length >= 2) return 'You\'re close every time. Watch the accents.';

  const genderPairs = [['le', 'la'], ['un', 'une'], ['du', 'de la'], ['mon', 'ma'], ['ton', 'ta'], ['son', 'sa'], ['ce', 'cette']];
  const genderSwaps = errors.filter(e => {
    if (!e.wrong || !e.correct) return false;
    const w = e.wrong.toLowerCase().trim(), c = e.correct.toLowerCase().trim();
    const w1 = w.split(/\s+/)[0], c1 = c.split(/\s+/)[0];
    return genderPairs.some(([a, b]) => (w1 === a && c1 === b) || (w1 === b && c1 === a) || (w === a && c === b) || (w === b && c === a));
  });
  if (genderSwaps.length >= 2) return 'Gender confusion. Check if the noun is masculine or feminine before picking the article.';

  const conjugationEnds = errors.filter(e => {
    if (!e.wrong || !e.correct) return false;
    const w = e.wrong.toLowerCase().trim(), c = e.correct.toLowerCase().trim();
    return w.length >= 3 && c.length >= 3 && w.slice(0, -2) === c.slice(0, -2) && w.slice(-2) !== c.slice(-2);
  });
  if (conjugationEnds.length >= 2) return 'Right verb, wrong ending. Check who is doing the action (je/tu/il/nous/vous/ils).';

  const nearMisses = errors.filter(e => {
    if (!e.wrong || !e.correct) return false;
    const w = e.wrong.toLowerCase().trim(), c = e.correct.toLowerCase().trim();
    return w.length > 2 && c.length > 2 && (w.includes(c.slice(0, 3)) || c.includes(w.slice(0, 3)));
  });
  if (nearMisses.length >= 2) return 'You\'re close but mixing up similar forms. Slow down and check the ending.';

  return null;
}

function updateWeakTags() {
  if (!S.progress || !S.sessionStats || !S.sessionStats.byTag) return;
  const wt = S.progress.weakTags;
  const today = todayStr();
  for (const [tag, data] of Object.entries(S.sessionStats.byTag)) {
    const total = data.right + data.wrong;
    if (total < 2) continue;
    const errorRate = data.wrong / total;
    if (errorRate > 0.5) {
      if (!wt[tag]) wt[tag] = { count: 0, firstSeen: today, lastSeen: today };
      wt[tag].count++;
      wt[tag].lastSeen = today;
    } else if (errorRate < 0.25 && wt[tag]) {
      wt[tag].count--;
      if (wt[tag].count <= 0) delete wt[tag];
    }
  }
}

function persistentWeakTags() {
  if (!S.progress || !S.progress.weakTags) return [];
  return Object.entries(S.progress.weakTags)
    .filter(([, data]) => data.count >= 2)
    .sort((a, b) => b[1].count - a[1].count)
    .map(([tag, data]) => ({ tag, count: data.count, lastSeen: data.lastSeen }));
}

function checkSmartClose() {
  const total = S.sessionTotal;
  if (total < 4) return false;
  const errorRate = ((total - S.sessionCorrect) / total) * 100;
  if (errorRate >= 35) return true;
  if (errorRate >= 25 && !S._smartCloseWarned) {
    S._smartCloseWarned = true;
    S._showAdaptiveMsg = 'Your error rate is climbing. Take your time on the next one.';
  }
  return false;
}

function insertConfidenceBuilder(tag) {
  const prevQ = S.queue[S.qi - 1];
  const skill = prevQ ? exerciseSkill(prevQ) : 'grammar';

  if (skill === 'vocab') {
    const vocab = Batch.all('vocabulary');
    const easy = vocab.filter(q => {
      if (S.queue.some(qe => qe.id === q.id)) return false;
      const card = getVocabCard(q.id);
      return card.lastReview && card.reps >= 2;
    });
    if (easy.length > 0) {
      const ex = { ...easy[Math.floor(Math.random() * easy.length)], _isConfidenceBuilder: true };
      S.queue.splice(S.qi + 1, 0, ex);
      return true;
    }
  }

  if (skill === 'listening') {
    const listening = Batch.all('listening');
    const easy = listening.filter(q => {
      if (S.queue.some(qe => qe.id === q.id)) return false;
      return (!q.tier || q.tier <= 2) && S.progress.exercises[q.id];
    });
    if (easy.length > 0) {
      const ex = { ...easy[Math.floor(Math.random() * easy.length)], _isListening: true, _isConfidenceBuilder: true };
      S.queue.splice(S.qi + 1, 0, ex);
      return true;
    }
  }

  const allGrammar = Batch.all('grammar');
  const tagMatch = allGrammar.filter(q => {
    if (q.difficulty && q.difficulty > 1) return false;
    if (!q.tags || !q.tags.includes(tag)) return false;
    if (S.queue.some(qe => qe.id === q.id)) return false;
    const rec = S.progress.exercises[q.id];
    return rec && rec.correct > 0;
  });
  const pool = tagMatch.length > 0 ? tagMatch : allGrammar.filter(q => {
    if (q.difficulty && q.difficulty > 1) return false;
    if (S.queue.some(qe => qe.id === q.id)) return false;
    const rec = S.progress.exercises[q.id];
    return rec && rec.correct > 0;
  });
  if (pool.length === 0) return false;
  const ex = { ...pool[Math.floor(Math.random() * pool.length)], _isConfidenceBuilder: true };
  S.queue.splice(S.qi + 1, 0, ex);
  return true;
}

function tryEscalation(tags) {
  if (!tags || tags.length === 0) return false;
  const prevQ = S.queue[S.qi - 1];
  const skill = prevQ ? exerciseSkill(prevQ) : 'grammar';

  if (skill === 'vocab') {
    const vocab = Batch.all('vocabulary');
    const prodCandidates = vocab.filter(q => {
      if (S.queue.some(qe => qe.id === q.id)) return false;
      const card = getVocabCard(q.id);
      return card.reps >= 1 && card.reps < 2 && (q.sentence_blank_en || q.sentence_en);
    });
    if (prodCandidates.length > 0) {
      const ex = { ...prodCandidates[0], _isEscalation: true };
      S.queue.splice(S.qi + 1, 0, ex);
      return true;
    }
    return false;
  }

  if (skill === 'listening') {
    const listening = Batch.all('listening');
    const currentTier = prevQ ? (prevQ.tier || 1) : 1;
    const harder = listening.filter(q => {
      if (!q.tier || q.tier <= currentTier) return false;
      if (S.queue.some(qe => qe.id === q.id)) return false;
      if (S.progress.exercises[q.id]) return false;
      return true;
    });
    if (harder.length > 0) {
      harder.sort((a, b) => (a.tier || 1) - (b.tier || 1));
      const ex = { ...harder[0], _isListening: true, _isEscalation: true };
      S.queue.splice(S.qi + 1, 0, ex);
      return true;
    }
    return false;
  }

  const nextIdx = S.qi + 1;
  if (nextIdx >= S.queue.length) return false;
  const nextQ = S.queue[nextIdx];
  const nextDiff = nextQ.difficulty || 2;

  const allGrammar = Batch.all('grammar');
  const harder = allGrammar.filter(q => {
    if (!q.difficulty || q.difficulty <= nextDiff) return false;
    if (!q.tags) return false;
    const hasTag = tags.some(t => q.tags.includes(t));
    if (!hasTag) return false;
    if (S.queue.some(qe => qe.id === q.id)) return false;
    if (!exercisePassesGate(q)) return false;
    return true;
  });
  if (harder.length === 0) return false;
  harder.sort((a, b) => (a.difficulty || 2) - (b.difficulty || 2));
  S.queue.splice(nextIdx, 0, { ...harder[0], _isEscalation: true });
  return true;
}

function adaptiveThreshold() {
  const n = S.progress && S.progress.sessions ? S.progress.sessions.length : 0;
  if (n <= 10) return 2;
  if (n <= 30) return 3;
  return 4;
}

function checkAdaptiveTriggers() {
  const mode = S.sessionMode || 'normal';
  if (mode === 'quiz' || mode === 'challenge' || mode === 'boss') return false;
  if (checkSmartClose()) {
    S._smartCloseReason = 'high_errors';
    endSession();
    return true;
  }

  const prevQ = S.queue[S.qi - 1];
  if (!prevQ) return false;
  const prevTags = prevQ.tags && prevQ.tags.length > 0 ? prevQ.tags : [exerciseSkill(prevQ)];
  const thresh = adaptiveThreshold();

  for (const tag of prevTags) {
    const tagStat = S.sessionStats.byTag[tag];
    if (!tagStat) continue;
    if (tagStat.consWrong >= thresh) {
      const diag = diagnoseErrors(tag);
      if (insertConfidenceBuilder(tag)) {
        S._showAdaptiveMsg = diag || 'encourage';
      }
      tagStat.consWrong = 0;
      return false;
    }
    if (tagStat.consRight >= thresh) {
      if (tryEscalation(prevTags)) {
        S._showAdaptiveMsg = 'push';
      }
      tagStat.consRight = 0;
      return false;
    }
  }
  return false;
}

function skillAccuracy() {
  if (!S.progress || !S.progress.sessions) return { grammar: { attempts: 0, correct: 0, pct: -1 }, vocab: { attempts: 0, correct: 0, pct: -1 }, reading: { attempts: 0, correct: 0, pct: -1 }, listening: { attempts: 0, correct: 0, pct: -1 }, writing: { attempts: 0, correct: 0, pct: -1 }, dictation: { attempts: 0, correct: 0, pct: -1 } };
  const sessions = S.progress.sessions.slice(-10);
  const result = {};
  const skills = ['grammar', 'vocab', 'reading', 'listening', 'writing', 'dictation'];
  for (const sk of skills) result[sk] = { attempts: 0, correct: 0, pct: -1 };
  for (const sess of sessions) {
    if (!sess.skills) continue;
    for (const sk of skills) {
      if (sess.skills[sk]) {
        result[sk].attempts += sess.skills[sk].a || 0;
        result[sk].correct += sess.skills[sk].c || 0;
      }
    }
  }
  for (const sk of skills) {
    result[sk].pct = result[sk].attempts > 0 ? Math.round((result[sk].correct / result[sk].attempts) * 100) : -1;
  }
  return result;
}

function weakestSkill() {
  const acc = skillAccuracy();
  let weakest = null, lowest = 101;
  for (const [skill, data] of Object.entries(acc)) {
    if (data.attempts >= 5 && data.pct < lowest) {
      lowest = data.pct;
      weakest = skill;
    }
  }
  return weakest && lowest < 70 ? { skill: weakest, pct: lowest } : null;
}

function sessionsSinceLastQuiz() {
  const quizzes = S.progress.weeklyQuizzes || [];
  if (quizzes.length === 0) return S.progress.sessions.length;
  const lastQuizDate = quizzes[quizzes.length - 1].date;
  let count = 0;
  for (let i = S.progress.sessions.length - 1; i >= 0; i--) {
    if (S.progress.sessions[i].date <= lastQuizDate) break;
    count++;
  }
  return count;
}

function canTakeWeeklyQuiz() {
  return S.progress.sessions.length >= 7 && sessionsSinceLastQuiz() >= 7;
}

function buildQuizQueue() {
  const stage = sessionStage();
  const pool = { grammar: [], vocab: [], reading: [], listening: [], dictation: [] };

  const allGrammar = Batch.all('grammar').filter(q => exercisePassesGate(q));
  shuffle(allGrammar);
  pool.grammar = allGrammar;

  if (stage.vocab) {
    const vocab = Batch.all('vocabulary');
    shuffle(vocab);
    pool.vocab = vocab;
  }
  if (stage.reading) {
    const reading = Batch.all('reading');
    shuffle(reading);
    pool.reading = reading;
  }
  if (stage.listening) {
    let listening = Batch.all('listening');
    if (stage.maxListenTier > 0 && stage.maxListenTier < 5) {
      listening = listening.filter(q => !q.tier || q.tier <= stage.maxListenTier);
    }
    shuffle(listening);
    pool.listening = listening;
  }
  if (stage.dictation) {
    const dictation = Batch.all('dictation');
    shuffle(dictation);
    pool.dictation = dictation;
  }

  const queue = [];
  queue.push(...pool.grammar.slice(0, 4));

  if (pool.vocab.length >= 2) queue.push(...pool.vocab.slice(0, 2));
  else queue.push(...pool.grammar.slice(4, 6));

  if (pool.reading.length >= 1) queue.push(pool.reading[0]);
  else queue.push(...pool.grammar.slice(queue.length));

  if (pool.listening.length >= 1) {
    const lq = pool.listening[0];
    lq._isListening = true;
    queue.push(lq);
  } else queue.push(...pool.grammar.slice(queue.length));

  if (pool.dictation.length >= 1) {
    const dq = pool.dictation[0];
    dq._isDictation = true;
    queue.push(dq);
  } else queue.push(...pool.grammar.slice(queue.length));

  const weak = weakestSkill();
  if (weak && pool[weak.skill] && pool[weak.skill].length > queue.filter(q => exerciseSkill(q) === weak.skill).length) {
    const extra = pool[weak.skill].find(q => !queue.includes(q));
    if (extra) {
      if (weak.skill === 'listening') extra._isListening = true;
      if (weak.skill === 'dictation') extra._isDictation = true;
      queue.push(extra);
    } else {
      queue.push(...pool.grammar.slice(queue.length));
    }
  } else {
    queue.push(...pool.grammar.slice(queue.length));
  }

  return queue.slice(0, 10);
}

function challengeableSkills() {
  const acc = skillAccuracy();
  const results = [];
  const tagM = S.progress.tagMastery || {};
  const done = S.progress.challengesDone || [];
  const today = todayStr();

  for (const [tag, tm] of Object.entries(tagM)) {
    if (!tm.mcq || !tm.mcq.attempts) continue;
    if (tm.mcq.attempts < 6) continue;
    const pct = Math.round((tm.mcq.correct / tm.mcq.attempts) * 100);
    if (pct < 80) continue;
    if (done.some(c => c.tag === tag && c.date === today)) continue;
    const available = Batch.all('grammar').filter(q => q.tags && q.tags.includes(tag));
    if (available.length < 5) continue;
    results.push({ tag, pct, count: available.length });
  }

  for (const [skill, data] of Object.entries(acc)) {
    if (data.attempts < 10 || data.pct < 80) continue;
    if (done.some(c => c.tag === skill && c.date === today)) continue;
    if (results.some(r => r.tag === skill)) continue;
    results.push({ tag: skill, pct: data.pct, count: 99 });
  }

  results.sort((a, b) => b.pct - a.pct);
  return results.slice(0, 3);
}

function buildChallengeQueue(tag) {
  const skills = ['grammar', 'vocab', 'reading', 'listening', 'dictation'];
  if (skills.includes(tag)) {
    const types = { grammar: 'grammar', vocab: 'vocabulary', reading: 'reading', listening: 'listening', dictation: 'dictation' };
    const all = Batch.all(types[tag] || tag);
    shuffle(all);
    const queue = all.slice(0, 5);
    queue.forEach(q => {
      if (tag === 'listening') q._isListening = true;
      if (tag === 'dictation') q._isDictation = true;
    });
    return queue;
  }
  const allGrammar = Batch.all('grammar').filter(q => q.tags && q.tags.includes(tag));
  shuffle(allGrammar);
  return allGrammar.slice(0, 5);
}

function canBossBattle() {
  const ch = S.progress.curriculum.chapter;
  const defeated = S.progress.bossDefeated || [];
  const checkpoints = [5, 10, 15];
  for (const cp of checkpoints) {
    if (ch >= cp && !defeated.includes(cp)) return cp;
  }
  return null;
}

function buildBossQueue(upToChapter) {
  const allGrammar = Batch.all('grammar').filter(q => {
    const d = q.difficulty || 2;
    return d >= 2;
  });
  shuffle(allGrammar);

  const vocab = Batch.all('vocabulary');
  shuffle(vocab);

  const dictation = Batch.all('dictation');
  shuffle(dictation);

  const queue = [];
  queue.push(...allGrammar.slice(0, 8));
  queue.push(...vocab.slice(0, 3).map(q => q));
  const dq = dictation.slice(0, 2);
  dq.forEach(q => { q._isDictation = true; });
  queue.push(...dq);

  const reading = Batch.all('reading');
  if (reading.length > 0) {
    shuffle(reading);
    queue.push(reading[0]);
  }

  const listening = Batch.all('listening');
  if (listening.length > 0) {
    shuffle(listening);
    const lq = listening[0];
    lq._isListening = true;
    queue.push(lq);
  }

  shuffle(queue);
  return queue.slice(0, 15);
}

  const timerEl = document.getElementById('session-timer');
  if (timerEl) {
    const mins = Math.floor(remaining / 60);
    const secs = remaining % 60;
    timerEl.textContent = mins + ':' + (secs < 10 ? '0' : '') + secs;
    timerEl.className = 'quiz-timer' + (remaining <= 30 ? ' timer-danger' : '');
  }
  if (remaining <= 0) {
    stopTimer();
    S._smartCloseReason = 'timer';
    endSession();
  }

function getClaudeKey() {
  try { return localStorage.getItem('fdv3_claude_key') || null; } catch (e) { return null; }
}

function setClaudeKey(key) {
  try { localStorage.setItem('fdv3_claude_key', key); } catch (e) { /* storage full */ }
}

function hasClaudeKey() { return !!getClaudeKey(); }

async function saveClaudeKeyEncrypted(key) {
  if (!S.gh) return;
  try {
    const pw = S._lastPassword;
    if (!pw) return;
    const enc = await Cry.encrypt(pw, key);
    await S.gh.put('claude-key.enc', JSON.stringify(enc), 'Claude API key (encrypted)');
  } catch (e) { /* silent */ }
}

async function loadClaudeKeyEncrypted(pw) {
  if (!S.gh) return null;
  try {
    const raw = await S.gh.get('claude-key.enc');
    if (!raw) return null;
    const bundle = JSON.parse(raw);
    return await Cry.decrypt(pw, bundle);
  } catch (e) { return null; }
}

const TCF_RUBRIC_PROMPT = `You are a TCF (Test de connaissance du français) writing evaluator. Grade this submission using the official TCF rubric.

Return ONLY valid JSON in this exact format, no markdown, no explanation outside the JSON:
{
  "rubric": {
    "vocabulary": <1-5>,
    "grammar": <1-5>,
    "coherence": <1-5>,
    "organization": <1-5>
  },
  "corrections": [
    {"original": "incorrect phrase", "corrected": "correct phrase", "category": "grammar|spelling|vocabulary|structure"}
  ],
  "comment": "One encouraging sentence about the submission with one specific tip."
}

Scoring guide:
1 = Very limited, major errors throughout
2 = Limited, frequent errors
3 = Adequate, some errors but meaning clear
4 = Good, minor errors only
5 = Excellent, near-native accuracy`;

async function evaluateWriting(exercise, submission) {
  const key = getClaudeKey();
  if (!key) return null;

  const tacheContext = exercise.tcf_tache
    ? `TCF Tâche ${exercise.tcf_tache}. ` + (
      exercise.tcf_tache === 1 ? 'Informal message reply. Expected: 60-120 words, informal register.'
      : exercise.tcf_tache === 2 ? 'Formal/semi-formal article or newsletter. Expected: 120-150 words, formal register.'
      : 'Opinion essay with two viewpoints. Expected: 120-180 words, argumentative structure.'
    )
    : 'General French writing exercise.';

  const prompt = exercise.tcf_tache
    ? `Original prompt: ${exercise.message_text || exercise.context || exercise.instruction || ''}
Student level: A1-A2 (beginner)
${tacheContext}

Student's submission:
${submission}`
    : `Writing prompt: ${exercise.prompt || exercise.instruction || ''}
Student level: ${exercise.level || 'A1'}

Student's submission:
${submission}`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-opus-4-6',
        max_tokens: 1024,
        system: TCF_RUBRIC_PROMPT,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    if (!resp.ok) {
      const errBody = await resp.text().catch(() => '');
      throw new Error('API ' + resp.status + ': ' + errBody.slice(0, 200));
    }
    const data = await resp.json();
    const text = data.content && data.content[0] && data.content[0].text;
    if (!text) return null;
    const cleaned = text.replace(/```json\s*/g, '').replace(/```\s*/g, '').trim();
    return JSON.parse(cleaned);
  } catch (e) {
    console.warn('Writing eval failed:', e.message);
    return null;
  }
}

function detectEnergy() {
  const stats = S.sessionStats;
  if (!stats) return 'neutral';
  const totalRight = Object.values(stats.bySkill).reduce((s, d) => s + d.right, 0);
  const totalWrong = Object.values(stats.bySkill).reduce((s, d) => s + d.wrong, 0);
  const total = totalRight + totalWrong;
  if (total < 3) return 'neutral';
  const accuracy = totalRight / total;

  const times = stats.responseTimes || [];
  const recentTimes = times.slice(-3);
  const avgTime = recentTimes.length > 0 ? recentTimes.reduce((s, t) => s + t, 0) / recentTimes.length : 0;
  const isSlowResponding = avgTime > 20000;

  if (accuracy > 0.85 && !isSlowResponding) return 'good';
  if (accuracy < 0.5 || (accuracy < 0.65 && isSlowResponding)) return 'bad';
  return 'neutral';
}

function checkEnergy() {
  const mode = S.sessionMode || 'normal';
  if (mode !== 'normal') return;
  const total = S.sessionTotal;
  if (total < 3 || total % 3 !== 0) return;

  const energy = detectEnergy();
  if (energy === S._energyState) return;
  S._energyState = energy;

  if (energy === 'good' && !S._energyGoodShown) {
    S._energyGoodShown = true;
    const bonus = Batch.all('grammar').filter(q => exercisePassesGate(q) && !S.queue.includes(q));
    if (bonus.length >= 2) {
      shuffle(bonus);
      S.queue.push(...bonus.slice(0, 2));
    }
    S._showAdaptiveMsg = 'You\'re in the zone. Added bonus exercises. Push it.';
  }
  if (energy === 'bad' && !S._energyBadShown) {
    S._energyBadShown = true;
    if (S.queue.length - S.qi > 3) {
      S.queue.length = S.qi + 2;
    }
    S._showAdaptiveMsg = 'Some days are harder. You showed up — that\'s what matters. Wrapping up soon.';
  }
}

function streakRiskLevel() {
  const streak = S.progress.streak.current;
  if (streak < 3) return null;
  const hour = new Date().getHours();
  if (hour < 19) return null;
  const lastSession = S.progress.sessions[S.progress.sessions.length - 1];
  if (lastSession && lastSession.date === todayStr()) return null;
  if (streak >= 7) return 'critical';
  if (streak >= 5) return 'high';
  return 'moderate';
}

function renderNudgeBannerEnhanced() {
  if (S.progress.sessions.length === 0) return '';
  const hour = new Date().getHours();
  const lastSession = S.progress.sessions[S.progress.sessions.length - 1];
  const todayDone = lastSession && lastSession.date === todayStr();
  if (todayDone) return '';
  if (hour < 18) return '';

  const streak = S.progress.streak.current;
  const risk = streakRiskLevel();

  if (risk === 'critical') {
    const isBest = streak >= S.progress.streak.best;
    return `
      <div class="nudge-banner nudge-urgent">
        <div class="nudge-icon">\u{1F6A8}</div>
        <div class="nudge-text">${isBest ? 'This is your longest streak ever.' : `You've built ${streak} days.`} 3 exercises. That's all it takes.</div>
      </div>`;
  }
  if (risk === 'high') {
    return `
      <div class="nudge-banner nudge-urgent">
        <div class="nudge-icon">\u{1F525}</div>
        <div class="nudge-text">You've built ${streak} days. Don't let it slip.</div>
      </div>`;
  }
  if (risk === 'moderate') {
    return `
      <div class="nudge-banner">
        <div class="nudge-icon">\u{1F4AA}</div>
        <div class="nudge-text">Your ${streak}-day streak is still alive. A quick 2-minute session keeps it going.</div>
      </div>`;
  }
  return `
    <div class="nudge-banner">
      <div class="nudge-icon">\u{1F4AA}</div>
      <div class="nudge-text">You haven't practiced today. A quick session keeps the streak alive.</div>
    </div>`;
}

function renderWeeklyReport() {
  const today = new Date();
  if (today.getDay() !== 1) return '';

  const sessions = S.progress.sessions || [];
  if (sessions.length < 2) return '';

  const todayStr_ = todayStr();
  const oneWeekAgo = new Date(today);
  oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
  const weekAgoStr = oneWeekAgo.toISOString().slice(0, 10);
  const twoWeeksAgo = new Date(today);
  twoWeeksAgo.setDate(twoWeeksAgo.getDate() - 14);
  const twoWeeksAgoStr = twoWeeksAgo.toISOString().slice(0, 10);

  const thisWeek = sessions.filter(s => s.date >= weekAgoStr && s.date <= todayStr_);
  const lastWeek = sessions.filter(s => s.date >= twoWeeksAgoStr && s.date < weekAgoStr);

  if (thisWeek.length === 0) return '';

  const thisCount = thisWeek.length;
  const lastCount = lastWeek.length;
  const thisAvgAcc = thisWeek.length > 0 ? Math.round(thisWeek.reduce((s, w) => s + (100 - w.errorRate), 0) / thisWeek.length) : 0;
  const lastAvgAcc = lastWeek.length > 0 ? Math.round(lastWeek.reduce((s, w) => s + (100 - w.errorRate), 0) / lastWeek.length) : 0;
  const thisExercises = thisWeek.reduce((s, w) => s + w.exercises, 0);
  const streak = S.progress.streak.current;

  const acc = skillAccuracy();
  const improved = [];
  const needsWork = [];
  const labels = { grammar: 'Grammar', vocab: 'Vocab', reading: 'Reading', listening: 'Listening', writing: 'Writing', dictation: 'Dictation' };
  for (const [sk, d] of Object.entries(acc)) {
    if (d.attempts < 5) continue;
    if (d.pct >= 75) improved.push(labels[sk] || sk);
    else if (d.pct < 50) needsWork.push(labels[sk] || sk);
  }

  const accDiff = thisAvgAcc - lastAvgAcc;
  const countDiff = thisCount - lastCount;

  function changeIndicator(diff, suffix) {
    if (diff === 0 || !lastCount) return '';
    const cls = diff > 0 ? 'weekly-report-up' : 'weekly-report-down';
    const arrow = diff > 0 ? '↑' : '↓';
    return `<span class="weekly-report-change ${cls}">${arrow}${Math.abs(diff)}${suffix || ''}</span>`;
  }

  return `
    <div class="weekly-report">
      <div class="weekly-report-title">\u{1F4CA} Weekly Progress</div>
      <div class="weekly-report-row">
        <span class="weekly-report-label">Sessions</span>
        <span class="weekly-report-val">${thisCount}${changeIndicator(countDiff)}</span>
      </div>
      <div class="weekly-report-row">
        <span class="weekly-report-label">Exercises</span>
        <span class="weekly-report-val">${thisExercises}</span>
      </div>
      <div class="weekly-report-row">
        <span class="weekly-report-label">Avg Accuracy</span>
        <span class="weekly-report-val">${thisAvgAcc}%${changeIndicator(accDiff, '%')}</span>
      </div>
      <div class="weekly-report-row">
        <span class="weekly-report-label">Streak</span>
        <span class="weekly-report-val">\u{1F525} ${streak} day${streak !== 1 ? 's' : ''}</span>
      </div>
      ${improved.length > 0 ? `
        <div class="weekly-report-row">
          <span class="weekly-report-label">Strong</span>
          <span class="weekly-report-val" style="color:var(--ok)">${improved.join(', ')}</span>
        </div>
      ` : ''}
      ${needsWork.length > 0 ? `
        <div class="weekly-report-row">
          <span class="weekly-report-label">Needs work</span>
          <span class="weekly-report-val" style="color:var(--err)">${needsWork.join(', ')}</span>
        </div>
      ` : ''}
    </div>`;
}


function getVocabCard(wordId) {
  if (!S.progress.srs[wordId]) S.progress.srs[wordId] = SRS.defaultCard();
  return S.progress.srs[wordId];
}

function updateStreak() {
  const p = S.progress;
  const today = todayStr();
  if (p.streak.lastDate === today) return;
  const yesterday = new Date(today + 'T00:00:00');
  yesterday.setDate(yesterday.getDate() - 1);
  const yStr = yesterday.toISOString().slice(0, 10);
  if (p.streak.lastDate === yStr) {
    p.streak.current++;
  } else if (p.streak.lastDate) {
    const lastD = new Date(p.streak.lastDate + 'T00:00:00');
    const todayD = new Date(today + 'T00:00:00');
    const gapDays = Math.floor((todayD - lastD) / 86400000);
    if (gapDays <= 2 && p.streak.freezeDays > 0) {
      p.streak.freezeDays--;
      p.streak.freezeUsed.push(yStr);
      p.streak.current++;
      S._usedFreeze = true;
      unlockAchievement('freeze-used');
    } else {
      p.streak.current = 1;
    }
  } else {
    p.streak.current = 1;
  }
  if (p.streak.current > p.streak.best) p.streak.best = p.streak.current;
  p.streak.lastDate = today;
  earnFreezeDays();
}

function recordSession(correct, total, durationMs) {
  const errorRate = total > 0 ? Math.round(((total - correct) / total) * 100) : 0;
  const skills = {};
  if (S.sessionStats && S.sessionStats.bySkill) {
    for (const [sk, data] of Object.entries(S.sessionStats.bySkill)) {
      skills[sk] = { a: data.right + data.wrong, c: data.right };
    }
  }
  S.progress.sessions.push({
    date: todayStr(),
    duration: Math.round(durationMs / 1000),
    exercises: total,
    correct: correct,
    errorRate: errorRate,
    skills: skills
  });
  if (S.progress.sessions.length > 30) S.progress.sessions = S.progress.sessions.slice(-30);
  updateStreak();
}


/* ═══════════════════════════════════════════════════════════════
   BATCH MANAGEMENT — load and query exercise batches
   ═══════════════════════════════════════════════════════════════ */

const Batch = {
  batches: [],
  registry: null,

  addBatch(json) {
    const batch = typeof json === 'string' ? JSON.parse(json) : json;
    if (!this.batches.find(b => b.batch_id === batch.batch_id)) {
      preprocessBatch(batch);
      this.batches.push(batch);
    }
  },

  get current() {
    return this.batches.length > 0 ? this.batches[this.batches.length - 1] : null;
  },

  all(type) {
    return this.batches.flatMap(b => b[type] || []);
  },

  fuel() {
    if (this.batches.length === 0) return { grammar: 0, vocab: 0, reading: 0, writing: 0, dictation: 0, listening: 0, speaking: 0 };
    const seen = S.progress.seenIds;
    const spDone = S.progress.speakingDone || [];
    return {
      grammar: this.all('grammar').filter(q => !seen.includes(q.id)).length,
      vocab: this.all('vocabulary').filter(q => !seen.includes(q.id)).length,
      reading: this.all('reading').filter(q => !seen.includes(q.id)).length,
      writing: this.all('writing').filter(q => !seen.includes(q.id)).length,
      dictation: this.all('dictation').filter(q => !seen.includes(q.id)).length,
      listening: this.all('listening').filter(q => !seen.includes(q.id)).length,
      speaking: this.all('speaking').filter(q => !spDone.includes(q.id)).length,
    };
  },

  totalFuel() {
    const f = this.fuel();
    return f.grammar + f.vocab + f.reading + f.writing + f.dictation + f.listening;
  },

  getReachExercises(tag) {
    for (const batch of [...this.batches].reverse()) {
      if (batch.reach && batch.reach[tag]) {
        const pool = batch.reach[tag].filter(q => !S.progress.seenIds.includes(q.id));
        if (pool.length > 0) return pool;
      }
    }
    return [];
  },

  reachFuel() {
    const result = {};
    for (const batch of this.batches) {
      if (!batch.reach) continue;
      for (const [tag, exs] of Object.entries(batch.reach)) {
        if (!result[tag]) result[tag] = 0;
        result[tag] += exs.filter(q => !S.progress.seenIds.includes(q.id)).length;
      }
    }
    return result;
  },

  needsRefuel() {
    const f = this.fuel();
    return this.batches.length === 0 || f.grammar <= 5 || f.vocab <= 3 || f.reading === 0 || f.writing === 0;
  }
};

   REFUEL.md GENERATOR — self-contained handoff for any Claude session
   ═══════════════════════════════════════════════════════════════ */

function generateRefuel() {
  const p = S.progress;
  const fuel = Batch.fuel();
  const reachFuel = Batch.reachFuel();
  const cur = p.curriculum;
  const curriculum = { chapter: cur.chapter, section: cur.currentSection, phase: cur.chapterPhase };

  const recentSessions = p.sessions.slice(-5);
  const avgErrorRate = recentSessions.length > 0
    ? Math.round(recentSessions.reduce((s, r) => s + r.errorRate, 0) / recentSessions.length)
    : 0;

  const topErrors = Object.entries(p.errorPatterns)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 8)
    .map(([tag, count]) => `${tag} (${count} errors)`)
    .join(', ');

  const weakReachTags = Object.entries(reachFuel)
    .filter(([, count]) => count <= 2)
    .map(([tag]) => tag);

  const srsJson = JSON.stringify(p.srs, null, 2);

  const pendingWriting = p.writingSubmissions
    .map(ws => `### ${ws.id} [${ws.type || 'essay'}] (submitted ${ws.submitted})\n${ws.text}`)
    .join('\n\n');

  const exhaustedStr = p.seenIds.join(', ');

  const grammarTarget = Math.max(0, 25 - fuel.grammar);
  const vocabTarget = Math.max(0, 10 - fuel.vocab);
  const readingTarget = Math.max(0, 2 - fuel.reading);
  const writingTarget = Math.max(0, 3 - fuel.writing);
  const dictationTarget = Math.max(0, 5 - (fuel.dictation || 0));
  const listeningTarget = Math.max(0, 5 - (fuel.listening || 0));
  const speakingTarget = Math.max(0, 3 - (fuel.speaking || 0));

  let difficultyDirective;
  const last3 = p.sessions.slice(-3);
  const avg3 = last3.length > 0 ? Math.round(last3.reduce((s, r) => s + r.errorRate, 0) / last3.length) : 0;
  if (last3.length < 2) {
    difficultyDirective = 'NOT ENOUGH DATA — use difficulty 2 (moderate) as default.';
  } else if (avg3 < 15) {
    difficultyDirective = `TOO EASY (${avg3}% errors). Increase difficulty to 3-4. Reduce MCQ to 30%, blank 40%, open 30%. Harder distractors. Less context hints.`;
  } else if (avg3 <= 25) {
    difficultyDirective = `SWEET ZONE (${avg3}% errors). Maintain current difficulty. Keep the mix balanced.`;
  } else {
    difficultyDirective = `TOO HARD (${avg3}% errors). Decrease difficulty to 1-2. Increase MCQ to 60%. Add more context hints. Reduce batch to 15 grammar.`;
  }

  const tagMasteryLines = Object.entries(p.tagMastery).map(([tag, tm]) => {
    const mcq = tm.mcq || { attempts: 0, correct: 0 };
    const blank = tm.blank || { attempts: 0, correct: 0 };
    const open = tm.open || { attempts: 0, correct: 0 };
    const mcqPct = mcq.attempts > 0 ? Math.round(mcq.correct / mcq.attempts * 100) : 0;
    const blankPct = blank.attempts > 0 ? Math.round(blank.correct / blank.attempts * 100) : 0;
    const unlocked = tagUnlockedType(tag);
    const types = unlocked === 'open' ? 'MCQ+Blank+Open' : unlocked === 'blank' ? 'MCQ+Blank' : 'MCQ only';
    return `- ${tag}: MCQ ${mcqPct}% (${mcq.attempts}), Blank ${blankPct}% (${blank.attempts}). Generate: ${types}`;
  }).join('\n');

  const exerciseStats = Object.values(p.exercises);
  const totalSeen = exerciseStats.length;
  const learning = exerciseStats.filter(e => e.mastery === 'learning').length;
  const familiar = exerciseStats.filter(e => e.mastery === 'familiar').length;
  const locked = exerciseStats.filter(e => e.mastery === 'locked').length;
  const dueToday = exerciseStats.filter(e => e.nextDue && e.nextDue <= todayStr()).length;

  return `# French Drill App — Refuel Request

## What This Is
Paste this into a Claude Code session. Run \`/french-batch\` or tell Claude to generate the next batch.
The app repo is at \`~/Projects/french-drills-v3/\`. Push the generated batch to \`batches/current.json\`.

## Current Position
- Chapter: ${curriculum.chapter}, Section: ${curriculum.section}, Phase: ${curriculum.phase}
- Sections completed: ${cur.completedSections.length > 0 ? cur.completedSections.join(', ') : 'none'}
- Next section: ${(() => {
    const ch = CURRICULUM[cur.chapter];
    if (!ch) return 'unknown';
    const ids = ch.sections.map(s => s.id);
    const idx = ids.indexOf(cur.currentSection);
    return idx < ids.length - 1 ? ids[idx + 1] : 'last section';
  })()}
- Batch ID: ${p.batch.id || 'none'}

## Difficulty Directive
${difficultyDirective}

## Performance (last ${recentSessions.length} sessions)
- Average error rate: ${avgErrorRate}%
- Top error patterns: ${topErrors || 'none yet'}

## Tag Mastery (determines which exercise types to generate per pattern)
${tagMasteryLines || 'No tag data yet — generate MCQ-only for all patterns.'}

## Exercise Pool State
- Total exercises seen: ${totalSeen}
- Due for review today: ${dueToday}
- Learning (every session): ${learning}
- Familiar (2-3 day intervals): ${familiar}
- Locked (7+ day intervals): ${locked}

## What's Running Low
- Grammar exercises remaining: ${fuel.grammar} ${fuel.grammar <= 5 ? '⚠️' : ''}
- Vocab words remaining: ${fuel.vocab} ${fuel.vocab <= 3 ? '⚠️' : ''}
- Reading passages remaining: ${fuel.reading} ${fuel.reading === 0 ? '⚠️' : ''}
- Writing prompts remaining: ${fuel.writing} ${fuel.writing === 0 ? '⚠️' : ''} (TCF format: tâche 1/2/3)
- Dictation sentences remaining: ${fuel.dictation || 0} ${(fuel.dictation || 0) <= 2 ? '⚠️' : ''}
- Listening exercises remaining: ${fuel.listening || 0} ${(fuel.listening || 0) <= 2 ? '⚠️' : ''} (need audio MP3 files via OpenAI TTS)
- Speaking prompts remaining: ${fuel.speaking || 0} ${(fuel.speaking || 0) <= 1 ? '⚠️' : ''}
${weakReachTags.length > 0 ? `- Reach bank low for: ${weakReachTags.join(', ')}` : ''}

## Vocabulary SRS State
\`\`\`json
${srsJson}
\`\`\`

${pendingWriting ? `## Writing Submissions Awaiting Review\n${pendingWriting}\n` : ''}
## Seen Exercise IDs (do NOT regenerate these)
${exhaustedStr || 'none'}

## Section Tags (MANDATORY on every grammar exercise)
Every grammar exercise must include its section tag. Current chapter sections:
${(() => {
    const ch = CURRICULUM[cur.chapter];
    if (!ch) return 'No section map for this chapter.';
    return ch.sections.map(s => '- `' + s.id + '` — ' + s.name).join('\n');
  })()}

## Batch Target
Generate: ${grammarTarget} grammar (focused on section \`${cur.currentSection}\`), 5 reach per weak pattern (${weakReachTags.join(', ') || 'none weak'}), ${vocabTarget} vocab (include distractors + sentence_blank_en for each), ${readingTarget} reading, ${writingTarget} writing (TCF format: type="tcf" with tcf_tache=1/2/3, one per tâche), ${dictationTarget} dictation (sentence_fr + sentence_en + level + tags), ${listeningTarget} listening (with audio MP3 via OpenAI TTS, tier 1-5), ${speakingTarget} speaking (one per TCF tâche)${pendingWriting ? ', feedback for pending writing (include rubric: vocabulary/grammar/coherence/organization each 1-5)' : ''}.
Batches: ${Batch.batches.length} loaded (${Batch.batches.map(b => b.batch_id).join(', ')}).
Push to: github.com/SyedAliMoiz/french-drills-v3 → batches/ (new batch file + update registry.json)
`;
}

async function copyRefuel() {
  const md = generateRefuel();
  try {
    await navigator.clipboard.writeText(md);
    return true;
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = md;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }
}
