function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function formatDuration(ms) {
  const secs = Math.floor(ms / 1000);
  if (secs < 60) return secs + 's';
  const mins = Math.floor(secs / 60);
  const rem = secs % 60;
  return mins + 'm ' + (rem < 10 ? '0' : '') + rem + 's';
}

let _activeInput = null;

function insertAccent(ch) {
  if (!_activeInput || _activeInput.disabled) return;
  const s = _activeInput.selectionStart, e = _activeInput.selectionEnd;
  _activeInput.value = _activeInput.value.slice(0, s) + ch + _activeInput.value.slice(e);
  _activeInput.selectionStart = _activeInput.selectionEnd = s + 1;
  _activeInput.focus();
}

function renderAccentBar(disabled) {
  return (!disabled ? '<div class="center"><button class="keys-toggle" id="keys-toggle">accents ↑</button></div>' : '') +
    '<div class="keys" id="keys">' +
    ACCENTS.map(c => '<button class="key" data-c="' + c + '"' + (disabled ? ' disabled' : '') + '>' + c + '</button>').join('') +
    '</div>';
}

function bindAccentKeys() {
  const inputs = document.querySelectorAll('.field:not(:disabled)');
  inputs.forEach(inp => inp.addEventListener('focus', () => { _activeInput = inp; }));
  if (inputs.length > 0) {
    setTimeout(() => inputs[0].focus(), 60);
    setTimeout(() => {
      if (inputs[0]) inputs[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);
    _activeInput = inputs[0];
  }
  const toggle = $('keys-toggle'), keysEl = $('keys');
  if (toggle && keysEl) {
    toggle.onclick = () => {
      const open = keysEl.style.display === 'none';
      keysEl.style.display = open ? 'flex' : 'none';
      toggle.textContent = open ? 'accents ↑' : 'accents ↓';
    };
  }
  document.querySelectorAll('.key').forEach(k => {
    k.addEventListener('mousedown', e => e.preventDefault());
    k.onclick = () => insertAccent(k.dataset.c);
  });
}

function scoreRing(pct) {
  const r = 70, c = Math.round(2 * Math.PI * r);
  const offset = Math.round(c * (1 - pct / 100));
  return `<div class="score-wrap"><svg width="160" height="160" viewBox="0 0 160 160"><circle cx="80" cy="80" r="${r}" fill="none" stroke="var(--bar-track)" stroke-width="6"/><circle cx="80" cy="80" r="${r}" fill="none" stroke="var(--accent)" stroke-width="6" stroke-dasharray="${c}" stroke-dashoffset="${c}" stroke-linecap="round" transform="rotate(-90 80 80)" class="score-ring-fill" style="--target:${offset}"/></svg><div class="score-inner"><div class="res-score">${pct}%</div></div></div>`;
}

function speakBtn(text, cls) {
  if (!text) return '';
  if (!window.speechSynthesis) return '';

async function doSetup() {
  const pw1 = $('pw1').value, pw2 = $('pw2').value, pat = $('pat').value;
  S.error = null;
  if (!pw1 || pw1.length < 4) { S.error = 'Password must be at least 4 characters.'; render(); return; }
  if (pw1 !== pw2) { S.error = "Passwords don't match."; render(); return; }
  if (!pat || pat.length < 10) { S.error = 'Please enter a valid GitHub token.'; render(); return; }
  $('setup-btn').disabled = true;
  $('setup-btn').innerHTML = '<span class="spin"></span> Setting up...';
  try {
    const gh = new GH(pat);
    try { await gh.get('README.md'); } catch (e) { /* may not exist */ }
    const enc = await Cry.encrypt(pw1, pat);
    await gh.put('config.enc', JSON.stringify(enc), 'Setup: encrypted config');
    const prog = defaultProgress();
    prog.updated = new Date().toISOString();
    await gh.put('PROGRESS.json', JSON.stringify(prog, null, 2), 'Setup: initial progress');
    localStorage.setItem('fdv3_token', pat);
    localStorage.setItem('fdv3_setup', '1');
    S.gh = gh;
    S.progress = prog;
    S.error = null;
    await loadBatches();
    S.screen = 'home';
    render();
  } catch (e) {
    S.error = `Setup failed: ${e.message}`;
    render();
  }
}

/* ═══════════════════════════════════════════════════════════════
   BATCH LOADING — fetch current batch from repo
   ═══════════════════════════════════════════════════════════════ */

async function loadBatches() {
  if (!S.gh) return;
  Batch.batches = [];
  try {
    const regRaw = await S.gh.get('batches/registry.json');
    if (regRaw) {
      const reg = JSON.parse(regRaw);
      Batch.registry = reg;
      for (const entry of reg.batches) {
        try {
          const raw = await S.gh.get(`batches/${entry.file}`);
          if (raw) Batch.addBatch(raw);
        } catch (e) { /* skip missing batch */ }
      }
    }
  } catch (e) { /* no registry */ }
  if (Batch.batches.length === 0) {
    try {
      const raw = await S.gh.get('batches/current.json');
      if (raw) Batch.addBatch(raw);
    } catch (e) { /* no batch */ }
  }
  if (Batch.current) {
    S.progress.batch.id = Batch.current.batch_id;
    S.progress.batch.loaded = new Date().toISOString();
  }
  syncCurriculumFromMastery();
}

function syncCurriculumFromMastery() {
  if (!S.progress || !S.progress.curriculum) return;
  const cur = S.progress.curriculum;
  if (cur.chapterPhase !== 'LEARN') return;
  const chapter = CURRICULUM[cur.chapter];
  if (!chapter) return;

  const sectionIds = chapter.sections.map(s => s.id);
  for (const id of sectionIds) {
    const status = sectionStatus(id);
    if ((status === 'advancing' || status === 'complete') && !cur.completedSections.includes(id)) {
      cur.completedSections.push(id);
    }
  }

  const firstIncomplete = sectionIds.find(id => !cur.completedSections.includes(id));
  if (firstIncomplete) {
    const currentIdx = sectionIds.indexOf(cur.currentSection);
    const targetIdx = sectionIds.indexOf(firstIncomplete);
    if (targetIdx > currentIdx) cur.currentSection = firstIncomplete;
  }
}

function renderSectionProgress() {
  const cur = S.progress.curriculum;
  const chapter = CURRICULUM[cur.chapter];
  if (!chapter) return '';
  const sectionIds = chapter.sections.map(s => s.id);
  const currentIdx = sectionIds.indexOf(cur.currentSection);

  const pills = chapter.sections.map((s, i) => {
    const status = sectionStatus(s.id);
    const isCompleted = cur.completedSections.includes(s.id) || status === 'complete' || status === 'advancing';
    const isCurrent = s.id === cur.currentSection;
    let cls = 'sec-pill';
    let icon = '';
    if (isCompleted && !isCurrent) { cls += ' sec-done'; icon = '✓ '; }
    else if (isCurrent) { cls += ' sec-current'; icon = '▶ '; }
    else { cls += ' sec-future'; }
    return `<span class="${cls}">${icon}${esc(s.name)}</span>`;
  }).join('');

  const completed = chapter.sections.filter(s => cur.completedSections.includes(s.id) || sectionStatus(s.id) === 'complete').length;
  const pct = Math.round((completed / chapter.sections.length) * 100);

  return `

  S.sessionTotal = 0;
  S.sessionStartTime = Date.now();
  S._sessionXP = 0;
  S._lastBonus = false;
  S._usedFreeze = false;
  S._prevLevel = S.progress.xp ? S.progress.xp.level : 1;
  S.sessionStats = { byTag: {}, bySkill: {}, errors: [] };
  S._smartCloseReason = null;
  S._smartCloseWarned = false;
  S._showAdaptiveMsg = null;
  S._sessionFocus = weakestSkill();
  S._persistentWeak = persistentWeakTags();
  stopTimer();
  S._timerStart = null;
  S._timerSeconds = null;

  S.qi = 0;
  S.answered = false;
  S.currentAnswer = null;

  S.screen = 'session';

function sessionStage() {
  const n = S.progress.sessions.length;
  if (n <= 5) return { cap: 5, grammar: true, vocab: false, dictation: false, reading: false, writing: false, listening: false, maxListenTier: 0, maxWriteTache: 0 };
  if (n <= 12) return { cap: 10, grammar: true, vocab: true, dictation: false, reading: false, writing: false, listening: false, maxListenTier: 0, maxWriteTache: 0 };
  if (n <= 25) return { cap: 15, grammar: true, vocab: true, dictation: true, reading: true, writing: false, listening: false, maxListenTier: 0, maxWriteTache: 0 };
  if (n <= 50) return { cap: 20, grammar: true, vocab: true, dictation: true, reading: true, writing: true, listening: true, maxListenTier: 2, maxWriteTache: 1 };
  return { cap: 30, grammar: true, vocab: true, dictation: true, reading: true, writing: true, listening: true, maxListenTier: 5, maxWriteTache: 3 };
}

function buildSessionQueue() {
  if (Batch.batches.length === 0) return [];
  const today = todayStr();
  const cur = S.progress.curriculum;
  const chapter = CURRICULUM[cur.chapter];
  const stage = sessionStage();

  const activeSections = [];
  if (chapter) {
    const sectionIds = chapter.sections.map(s => s.id);
    const currentIdx = sectionIds.indexOf(cur.currentSection);
    for (let i = 0; i <= Math.max(currentIdx, 0); i++) activeSections.push(sectionIds[i]);
  }

  const allGrammar = Batch.all('grammar').filter(q => {
    if (!exercisePassesGate(q)) return false;
    if (activeSections.length === 0) return true;
    const section = q._section || exerciseSection(q);
    if (!section) return true;
    return activeSections.includes(section);
  });

  const currentSectionExercises = allGrammar.filter(q => {
    const section = q._section || exerciseSection(q);
    return section === cur.currentSection;
  });
  const reviewExercises = allGrammar.filter(q => {
    const section = q._section || exerciseSection(q);
    return section !== cur.currentSection;
  });

  const due = [], errored = [], fresh = [];
  for (const q of currentSectionExercises) {
    const rec = S.progress.exercises[q.id];
    if (!rec) { fresh.push(q); continue; }
    if (rec.streak === 0 && rec.attempts > 0) { errored.push(q); continue; }
    if (rec.nextDue && rec.nextDue <= today) { due.push(q); continue; }
  }

  const reviewDue = [];
  for (const q of reviewExercises) {
    const rec = S.progress.exercises[q.id];
    if (rec && rec.nextDue && rec.nextDue <= today) reviewDue.push(q);
  }

  due.sort((a, b) => {
    const ra = S.progress.exercises[a.id], rb = S.progress.exercises[b.id];
    return (ra.nextDue || '').localeCompare(rb.nextDue || '');
  });

  const weakTagList = persistentWeakTags().map(w => w.tag);
  const weakTagExercises = weakTagList.length > 0 ? allGrammar.filter(q => {
    if (!q.tags) return false;
    return q.tags.some(t => weakTagList.includes(t));
  }).filter(q => {
    const rec = S.progress.exercises[q.id];
    return !rec || rec.streak === 0 || (rec.nextDue && rec.nextDue <= today);
  }) : [];

  const weakSlice = interleaveByTag(weakTagExercises).slice(0, 3);
  const weakIds = new Set(weakSlice.map(q => q.id));
  const grammarPool = [
    ...weakSlice,
    ...interleaveByTag(errored).filter(q => !weakIds.has(q.id)).slice(0, 5),
    ...interleaveByTag(due).filter(q => !weakIds.has(q.id)).slice(0, 5),
    ...interleaveByTag(fresh).filter(q => !weakIds.has(q.id)).slice(0, 8),
    ...shuffle(reviewDue).filter(q => !weakIds.has(q.id)).slice(0, 3)
  ];

  const focus = S._sessionFocus ? S._sessionFocus.skill : null;
  const isBonus = S._bonusRound;
  if (isBonus) { stage.cap = 5; S._bonusRound = false; }

  if (isBonus) {
    const hardGrammar = allGrammar.filter(q => (q.difficulty || 2) >= 3 && exercisePassesGate(q));
    const medGrammar = hardGrammar.length >= 3 ? hardGrammar : allGrammar.filter(q => (q.difficulty || 2) >= 2 && exercisePassesGate(q));
    shuffle(medGrammar);
    return medGrammar.slice(0, 5);
  }

  const queue = [...grammarPool];

  if (stage.vocab) {
    const vocab = Batch.all('vocabulary');
    const dueVocab = vocab.filter(q => SRS.isDue(getVocabCard(q.id)));
    shuffle(dueVocab);
    const newVocab = vocab.filter(q => !getVocabCard(q.id).lastReview && !dueVocab.includes(q));
    const dueLimit = focus === 'vocab' ? 8 : 5;
    const newLimit = focus === 'vocab' ? 5 : 3;
    queue.push(...dueVocab.slice(0, dueLimit), ...newVocab.slice(0, newLimit));
  }

  if (stage.dictation) {
    const dictation = Batch.all('dictation');
    const dictLimit = focus === 'dictation' ? 5 : 3;
    const dictPool = dictation.filter(q => !S.progress.exercises[q.id]).slice(0, dictLimit);
    dictPool.forEach(q => { q._isDictation = true; });
    queue.push(...dictPool);
  }

  if (stage.reading) {
    const reading = Batch.all('reading');
    const readLimit = focus === 'reading' ? 2 : 1;
    queue.push(...reading.filter(q => !S.progress.exercises[q.id]).slice(0, readLimit));
  }

  if (stage.writing) {
    const writing = Batch.all('writing');
    const writingFb = Batch.batches.flatMap(b => b.writing_feedback || []);
    const hasPendingWriting = S.progress.writingSubmissions.some(ws => {
      return !writingFb.find(f => f.id === ws.id);
    });
    if (!hasPendingWriting) {
      let pool = writing.filter(q => !S.progress.exercises[q.id]);
      if (stage.maxWriteTache > 0 && stage.maxWriteTache < 3) {
        pool = pool.filter(q => !q.tcf_tache || q.tcf_tache <= stage.maxWriteTache);
      }
      queue.push(...pool.slice(0, 3));
    }
  }

  if (stage.listening) {
    const listening = Batch.all('listening');
    let pool = listening.filter(q => !S.progress.exercises[q.id]);
    if (stage.maxListenTier > 0 && stage.maxListenTier < 5) {
      pool = pool.filter(q => !q.tier || q.tier <= stage.maxListenTier);
    }
    const listenLimit = focus === 'listening' ? 4 : 2;
    const listPool = pool.slice(0, listenLimit);
    listPool.forEach(q => { q._isListening = true; });
    queue.push(...listPool);
  }

  return queue.slice(0, stage.cap);
}

function interleaveByTag(exercises) {
  if (exercises.length <= 1) return exercises;
  const groups = {};
  for (const q of exercises) {
    const tag = (q.tags && q.tags[0]) || '_none';
    if (!groups[tag]) groups[tag] = [];
    groups[tag].push(q);
  }
  for (const tag in groups) shuffle(groups[tag]);
  const tags = Object.keys(groups);
  const result = [];
  let round = 0, added = true;
  while (added) {
    added = false;
    for (const tag of tags) {
      if (round < groups[tag].length) {
        result.push(groups[tag][round]);
        added = true;
      }
    }
    round++;
  }
  return result;
}

function queueReach(tags) {
  if (!tags || Batch.batches.length === 0) return;
  for (const tag of tags) {
    const pool = Batch.getReachExercises(tag);
    if (pool.length > 0) {
      const ex = { ...pool[0], _isReach: true };
      S.queue.splice(S.qi + 1, 0, ex);
      if (!S.progress.seenIds.includes(pool[0].id)) S.progress.seenIds.push(pool[0].id);
      return;
    }
  }
}

function renderAdaptiveInterstitial() {
  const msg = S._showAdaptiveMsg;
  const isEncourage = msg === 'encourage' || (msg && msg !== 'push');
  const isPush = msg === 'push';
  const displayMsg = msg === 'encourage' ? 'You know this pattern. Try an easier one to rebuild confidence.'
    : msg === 'push' ? 'You\'re on a roll. Here\'s a harder one to push you.'
    : msg;
  const cls = isPush ? 'adaptive-msg-push' : 'adaptive-msg-encourage';
  const q = S.queue[S.qi];
  const badge = q && q._isConfidenceBuilder ? '<span class="type-confidence" style="margin-right:.5rem">CONFIDENCE</span>'
    : q && q._isEscalation ? '<span class="type-escalation" style="margin-right:.5rem">CHALLENGE</span>' : '';

  app().innerHTML = `
    <div class="dp">
      <div class="dp-body" style="text-align:center">
        <div style="font-size:2.5rem;margin-bottom:1rem">${isPush ? '\u{1F525}' : '\u{1F4AA}'}</div>
        <div class="adaptive-msg ${cls}" style="font-size:1rem;padding:1.25rem;max-width:360px;margin:0 auto">
          ${badge}${esc(displayMsg)}
        </div>
        <button class="btn btn-p mt" id="adaptive-ok-btn" style="max-width:200px;margin:1.5rem auto 0">Got it</button>
      </div>
    </div>`;
  $('adaptive-ok-btn').onclick = () => {
    S._showAdaptiveMsg = null;
    render();
  };
}

function renderSession() {
  if (S.qi >= S.queue.length) {
    endSession();
    return;
  }
  if (S._showAdaptiveMsg) {
    renderAdaptiveInterstitial();
    return;
  }
  const q = S.queue[S.qi];
  const progress = Math.round(((S.qi) / S.queue.length) * 100);

  if (q.type === 'mcq') renderMCQ(q, progress);
  else if (q.type === 'blank' || q.type === 'open') renderBlank(q, progress);
  else if (q.type === 'why') renderMCQ(q, progress);
  else if (q._isDictation) renderDictation(q, progress);
  else if (q._isListening) renderListening(q, progress);
  else if (q.word) renderVocabCard(q, progress);
  else if (q.passage) renderReading(q, progress);
  else if (q.tcf_tache) renderWriting(q, progress);
  else if (q.prompt && q.guidelines) renderWriting(q, progress);
  else advanceSession();
}

function vocabMode(q) {
  const card = getVocabCard(q.id);
  if (card.reps >= 2 && (q.sentence_blank_en || q.sentence_en)) return 'production';
  return 'recognition';
}

function renderVocabCard(q, progress) {
  const card = getVocabCard(q.id);
  const mode = vocabMode(q);

  if (mode === 'recognition') return renderVocabRecognition(q, card, progress);
  return renderVocabProduction(q, card, progress);
}

function renderVocabRecognition(q, card, progress) {
  const distractors = q.distractors || [];
  const options = shuffle([q.meaning, ...distractors.slice(0, 2)]);
  const correctIdx = options.indexOf(q.meaning);
  const sentence = q.sentence_fr || '';
  const highlighted = sentence.replace(new RegExp(`\\b${q.word}\\b`, 'gi'), `<strong>${q.word}</strong>`);

  app().innerHTML = `
    <div class="dp">
      ${renderSessionHeader(progress, 'Vocab', 'type-vocab')}
      <div class="dp-body">
        <div class="card${S.answered ? (S.currentAnswer === correctIdx ? ' card-ok' : ' card-err') : ''}">
          ${sentence ? `<div class="serif" style="font-size:1.25rem;line-height:1.5">${highlighted} ${speakBtn(q.sentence_fr || q.word)}</div>` : `<div class="serif">${esc(q.word)} ${speakBtn(q.word)}</div>`}
          <div class="sub mt-sm">What does <strong>${esc(q.word)}</strong> mean?${q.gender ? ' (' + q.gender + ')' : ''}</div>
        </div>
        <div class="opts">
          ${options.map((opt, i) => {
            let cls = 'opt';
            if (S.answered) {
              cls += ' opt-locked';
              if (i === correctIdx) cls += ' opt-right';
              else if (i === S.currentAnswer) cls += ' opt-wrong';
            }
            return `<button class="${cls}" data-i="${i}"><span class="opt-letter">${['A','B','C'][i]}</span><span>${esc(opt)}</span></button>`;
          }).join('')}
        </div>
        ${S.answered ? `
          <div class="fb fade-up ${S.currentAnswer === correctIdx ? 'fb-ok' : 'fb-err'}">
            <span class="fb-head">${S.currentAnswer === correctIdx ? 'Correct' : 'Wrong'}</span>
            <span class="fb-answer">${esc(q.word)} = ${esc(q.meaning)} ${speakBtn(q.word)}</span>
            ${q.pronunciation ? `<span class="fb-rule">${esc(q.pronunciation)}</span>` : ''}
            ${q.sentence_en ? `<span class="fb-rule">${esc(q.sentence_en)}</span>` : ''}
          </div>
          <button class="btn btn-p mt fade-up" id="next-btn" style="animation-delay:.1s">Continue</button>
        ` : ''}
      </div>
    </div>`;

  if (!S.answered) {
    document.querySelectorAll('.opt').forEach(el => {
      el.onclick = () => {
        const i = parseInt(el.dataset.i);
        S.currentAnswer = i;
        S.answered = true;
        S.sessionTotal++;
        const ok = i === correctIdx;
        if (ok) S.sessionCorrect++;
        trackAnswer(ok ? 1 : 0, ok ? 0 : 1, !ok ? { wrong: options[i], correct: q.meaning } : null);
        SRS.update(card, ok ? 4 : 1);
        saveLocal();
        render();
      };
    });
  } else {
    $('next-btn').onclick = advanceSession;
    $('next-btn').focus();
    document.addEventListener('keydown', function handler(e) {
      if (e.key === 'Enter' && !e.repeat) { document.removeEventListener('keydown', handler); advanceSession(); }
    });
  }
}

function renderWriting(q, progress) {
  const isTCF = !!q.tcf_tache;
  const wtype = isTCF ? 'tcf' : (q.type || 'essay');
  const rows = isTCF ? 8 : (wtype === 'micro' ? 3 : wtype === 'translate' ? 4 : 6);
  const placeholder = wtype === 'translate' ? 'Write the French translation...' : 'Write in French...';
  const typeLabel = isTCF ? (TCF_TACHE_INFO[q.tcf_tache] || {}).name || 'Writing' : (wtype === 'micro' ? 'Quick Write' : wtype === 'translate' ? 'Translation' : 'Writing');
  const wordMin = q.word_min || 0;
  const wordMax = q.word_max || 0;

  const promptHTML = isTCF ? renderTCFPrompt(q) : `
    <div class="writing-type">${esc(typeLabel)}</div>
    <div class="serif" style="font-size:1.25rem">${esc(q.prompt)}</div>
    ${q.guidelines ? `<div class="sub mt-sm">${esc(q.guidelines)}</div>` : ''}
    <div class="sub" style="margin-top:.25rem">Level: ${esc(q.level || 'A1')}</div>
    ${wtype === 'translate' && q.source_en ? `<div class="source-text">${esc(q.source_en)}</div>` : ''}
    ${renderWritingTemplate(q)}`;

  app().innerHTML = `
    <div class="dp">
      ${renderSessionHeader(progress, typeLabel, 'type-writing')}
      <div class="dp-body">
        <div class="card">${promptHTML}</div>
        ${isTCF ? `
          <div class="tpl-toggle" id="tpl-toggle">${CHEVRON_SVG} Writing Tips</div>
          <div class="tpl-body" id="tpl-body">
            <ul style="padding-left:1.25rem;margin:0">${(TCF_TACHE_INFO[q.tcf_tache] || {tips:[]}).tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
          </div>
        ` : ''}
        <textarea class="field mt" id="writing-area" rows="${rows}" placeholder="${placeholder}" style="resize:vertical;font-size:1rem;line-height:1.6"></textarea>
        ${wordMin || wordMax ? `<div class="word-count" id="word-count">0 words</div>` : ''}
        ${renderAccentBar(false)}
        <button class="btn btn-p mt" id="submit-writing-btn">Submit</button>
        <button class="btn-link" id="skip-writing-btn">Skip for now</button>
      </div>
    </div>`;

  bindAccentKeys();
  const toggle = $('tpl-toggle'), body = $('tpl-body');
  if (toggle && body) {
    toggle.onclick = () => {
      toggle.classList.toggle('open');
      body.classList.toggle('show');
    };
  }

  const wcEl = $('word-count');
  if (wcEl) {
    $('writing-area').addEventListener('input', () => {
      const words = $('writing-area').value.trim().split(/\s+/).filter(w => w.length > 0).length;
      wcEl.textContent = words + ' word' + (words !== 1 ? 's' : '');
      wcEl.className = 'word-count' + (wordMax && words > wordMax ? ' over' : (wordMin && words >= wordMin && (!wordMax || words <= wordMax) ? ' good' : ''));
    });
  }

  $('submit-writing-btn').onclick = async () => {
    const text = $('writing-area').value.trim();
    if (!text) return;
    S.progress.writingSubmissions.push({ id: q.id, type: wtype, tache: q.tcf_tache || null, text, submitted: new Date().toISOString() });
    if (!S.progress.seenIds.includes(q.id)) S.progress.seenIds.push(q.id);
    S.sessionTotal++;
    S.sessionCorrect++;
    trackAnswer(1, 0);
    const xp = calcExerciseXP(q, true, q._isReach);
    addXP(xp);
    S._sessionXP = (S._sessionXP || 0) + xp;

    if (hasClaudeKey()) {
      $('submit-writing-btn').disabled = true;
      $('submit-writing-btn').innerHTML = '<span class="spin"></span> Getting feedback...';
      if ($('skip-writing-btn')) $('skip-writing-btn').style.display = 'none';
      try {
        const feedback = await evaluateWriting(q, text);
        if (feedback) {
          const sub = S.progress.writingSubmissions[S.progress.writingSubmissions.length - 1];
          sub.feedback = feedback;
          saveLocal();
          const container = document.createElement('div');
          container.innerHTML = renderWritingEvaluation(feedback);
          $('submit-writing-btn').parentNode.insertBefore(container, $('submit-writing-btn'));
          $('submit-writing-btn').textContent = 'Continue';
          $('submit-writing-btn').disabled = false;
          $('submit-writing-btn').onclick = () => advanceSession();
        } else {
          advanceSession();
        }
      } catch (e) {
        advanceSession();
      }
    } else {
      advanceSession();
    }
  };
  $('skip-writing-btn').onclick = () => {
    trackAnswer(0, 1, { wrong: '(skipped)', correct: '(writing exercise)' });
    S.sessionTotal++;
    advanceSession();
  };
}

function renderListening(q, progress) {
  const tierInfo = q.tier_name || ('Tier ' + (q.tier || '?'));
  const canReplay = !q.tier || q.tier <= 3;
  const PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>';
  const optionCount = q.options ? q.options.length : (q.statements ? q.statements.length : 0);
  const options = q.options || q.statements || [];
  const question = q.question || (q.situation ? 'Quelle situation correspond ?' : 'Choose the correct answer.');

  app().innerHTML = `
    <div class="dp">
      ${renderSessionHeader(progress, 'Listening', 'type-listening')}
      <div class="dp-body">
        <div class="audio-player">
          <button class="audio-play-btn" id="audio-play">${PLAY_SVG}</button>
          <div class="audio-info">
            <div class="audio-tier">${esc(tierInfo)} · ${esc(q.level || '')}</div>
            <div class="audio-status" id="audio-status">Press play to listen</div>
          </div>
        </div>
        <div id="listening-question" style="display:none">
          <div class="card">
            <div class="card-title">${esc(question)}</div>
            <div class="opts mt-sm" id="listening-opts">
              ${options.map((opt, i) => `<button class="opt" data-idx="${i}">${esc(opt)}</button>`).join('')}
            </div>
          </div>
          <div class="listening-passage" id="listening-passage">
            <div class="label" style="margin-bottom:.375rem">Transcript</div>
            ${esc(q.passage_text || '')}
          </div>
        </div>
      </div>
    </div>`;

  let played = 0;
  const audioEl = q.audio ? new Audio(q.audio) : null;
  const playBtn = $('audio-play');
  const statusEl = $('audio-status');

  playBtn.onclick = () => {
    if (audioEl) {
      played++;
      if (!canReplay && played > 1) { statusEl.textContent = 'No replay allowed at this tier'; return; }
      if (played > 2) { statusEl.textContent = 'Maximum replays reached'; return; }
      statusEl.textContent = 'Playing...';
      playBtn.disabled = true;
      audioEl.play().catch(() => { statusEl.textContent = 'Audio not available — read the transcript'; showQuestion(); });
      audioEl.onended = () => {
        playBtn.disabled = false;
        statusEl.textContent = canReplay && played < 2 ? 'Listen again?' : 'Now answer the question';
        showQuestion();
      };
    } else {
      statusEl.textContent = 'No audio file — read the transcript';
      showQuestion();
      $('listening-passage').classList.add('show');
    }
  };

  function showQuestion() {
    $('listening-question').style.display = 'block';
  }

  const optsEl = $('listening-opts');
  optsEl.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => {
      if (S.answered) return;
      S.answered = true;
      const idx = parseInt(btn.dataset.idx);
      const correct = idx === q.correct;
      optsEl.querySelectorAll('.opt').forEach(o => o.classList.add('opt-locked'));
      btn.classList.add(correct ? 'opt-right' : 'opt-wrong');
      if (!correct) {
        optsEl.querySelector(`[data-idx="${q.correct}"]`).classList.add('opt-right');
      }
      $('listening-passage').classList.add('show');
      if (!S.progress.seenIds.includes(q.id)) S.progress.seenIds.push(q.id);
      S.sessionTotal++;
      if (correct) S.sessionCorrect++;
      const listenOpts = q.options || q.statements || [];
      trackAnswer(correct ? 1 : 0, correct ? 0 : 1, !correct ? { wrong: listenOpts[idx] || '', correct: listenOpts[q.correct] || '' } : null);
      recordExercise(q.id, correct, q.tags || []);
      const xp = calcExerciseXP(q, correct, q._isReach);
      addXP(xp);
      S._sessionXP = (S._sessionXP || 0) + xp;
      if (!correct) queueReach(q.tags || []);
      setTimeout(advanceSession, correct ? 1200 : 2500);
    };
  });
}

function advanceSession() {
  S.qi++;
  S.answered = false;
  S.currentAnswer = null;
  S.selfExplainPhase = false;
  S.readingSelections = {};
  S._lastTyped = '';
  S._showAdaptiveMsg = null;
  if (S.qi >= S.queue.length) {
    endSession();
  } else {
    checkEnergy();
    if (checkAdaptiveTriggers()) return;
    const appEl = document.getElementById('app');
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      appEl.style.opacity = '0';
    }
    render();
    requestAnimationFrame(() => { appEl.style.opacity = '1'; });
  }
}

function checkSectionAdvancement() {
  const cur = S.progress.curriculum;
  if (cur.chapterPhase !== 'LEARN') return null;
  const chapter = CURRICULUM[cur.chapter];
  if (!chapter) return null;

  const sectionIds = chapter.sections.map(s => s.id);
  const currentIdx = sectionIds.indexOf(cur.currentSection);
  const status = sectionStatus(cur.currentSection);

  if ((status === 'advancing' || status === 'complete') && !cur.completedSections.includes(cur.currentSection)) {
    cur.completedSections.push(cur.currentSection);
  }

  if (status === 'advancing' || status === 'complete') {
    if (currentIdx < sectionIds.length - 1) {
      const advanced = cur.currentSection;
      cur.currentSection = sectionIds[currentIdx + 1];
      return advanced;
    }
  }

  const allComplete = sectionIds.every(id => {
    const s = sectionStatus(id);
    return s === 'complete';
  });
  if (allComplete) cur.chapterPhase = 'TEST';

  return null;
}

function endSession() {
  stopTimer();
  const duration = Date.now() - (S.sessionStartTime || Date.now());
  const mode = S.sessionMode || 'normal';

  if (mode === 'quiz') {
    const quizResult = {
      date: todayStr(),
      score: S.sessionCorrect,
      total: S.sessionTotal,
      pct: S.sessionTotal > 0 ? Math.round((S.sessionCorrect / S.sessionTotal) * 100) : 0,
      duration: Math.round(duration / 1000),
      timedOut: S._smartCloseReason === 'timer'
    };
    if (S.sessionStats && S.sessionStats.bySkill) {
      quizResult.skills = {};
      for (const [sk, data] of Object.entries(S.sessionStats.bySkill)) {
        quizResult.skills[sk] = { a: data.right + data.wrong, c: data.right };
      }
    }
    S.progress.weeklyQuizzes.push(quizResult);
    if (S.progress.weeklyQuizzes.length > 20) S.progress.weeklyQuizzes = S.progress.weeklyQuizzes.slice(-20);
    S._quizResult = quizResult;
    S._prevQuiz = S.progress.weeklyQuizzes.length >= 2 ? S.progress.weeklyQuizzes[S.progress.weeklyQuizzes.length - 2] : null;
  }

  if (mode === 'challenge') {
    const passed = S.sessionTotal > 0 && S.sessionCorrect === S.sessionTotal;
    S.progress.challengesDone.push({
      tag: S._challengeTag,
      date: todayStr(),
      passed: passed,
      score: S.sessionCorrect,
      total: S.sessionTotal,
      timedOut: S._smartCloseReason === 'timer'
    });
    S._challengePassed = passed;
    if (passed) {
      addXP(50);
      S._sessionXP = (S._sessionXP || 0) + 50;
    }
  }

  if (mode === 'boss') {
    const pct = S.sessionTotal > 0 ? Math.round((S.sessionCorrect / S.sessionTotal) * 100) : 0;
    const passed = pct >= 70;
    if (passed && S._bossChapter) {
      if (!S.progress.bossDefeated.includes(S._bossChapter)) {
        S.progress.bossDefeated.push(S._bossChapter);
      }
      addXP(200);
      S._sessionXP = (S._sessionXP || 0) + 200;
    }
    S._bossPassed = passed;
    S._bossPct = pct;
  }

  if (mode === 'normal') {
    recordSession(S.sessionCorrect, S.sessionTotal, duration);
    updateWeakTags();
    S._advancedSection = checkSectionAdvancement();
  } else {
    recordSession(S.sessionCorrect, S.sessionTotal, duration);
  }

  S._newAchievements = checkAchievements();
  S._leveledUp = S.progress.xp && S.progress.xp.level > S._prevLevel;
  saveLocal();
  syncToGitHub();
  S.screen = 'results';
  render();
}


/* ═══════════════════════════════════════════════════════════════
   RESULTS — end-of-session summary
   ═══════════════════════════════════════════════════════════════ */

function renderResults() {
  const total = S.sessionTotal;
  const correct = S.sessionCorrect;
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
  const errorRate = total > 0 ? 100 - pct : 0;
  const duration = Date.now() - (S.sessionStartTime || Date.now());
  const sessionXP = S._sessionXP || 0;
  const prog = xpProgress(S.progress.xp ? S.progress.xp.total : 0);
  const newAch = S._newAchievements || [];
  const mode = S.sessionMode || 'normal';

  let zoneClass, zoneLabel;
  if (errorRate >= 15 && errorRate <= 25) { zoneClass = 'zone-sweet'; zoneLabel = 'Sweet zone — right level of challenge'; }
  else if (errorRate < 15) { zoneClass = 'zone-easy'; zoneLabel = 'Too easy — difficulty should increase'; }
  else { zoneClass = 'zone-hard'; zoneLabel = 'Too hard — review the basics first'; }

  const smartClose = S._smartCloseReason === 'high_errors';
  const timedOut = S._smartCloseReason === 'timer';
  const offerBonus = mode === 'normal' && !smartClose && errorRate < 10 && total >= 4 && S.progress.sessions.length > 5 && Batch.totalFuel() > 0;

  let modeHeader = '';
  if (mode === 'quiz') {
    modeHeader = `
      <div class="quiz-card fade-up" style="margin-bottom:1rem">
        <div class="quiz-card-title">\u{1F4CB} Weekly Quiz ${timedOut ? '(Time Up)' : 'Complete'}</div>
        <div class="quiz-card-sub">${correct}/${total} across all skills${timedOut ? ' — ran out of time' : ''}</div>
        ${(() => {
          const prev = S._prevQuiz;
          if (!prev) return '<div class="quiz-card-sub mt-sm">First quiz recorded. Next one unlocks after 7 more sessions.</div>';
          const curPct = pct;
          const prevPct = prev.pct;
          const diff = curPct - prevPct;
          const cls = diff > 0 ? 'quiz-compare-up' : diff < 0 ? 'quiz-compare-down' : 'quiz-compare-same';
          const arrow = diff > 0 ? '↑' : diff < 0 ? '↓' : '→';
          return `
            <div class="quiz-compare">
              <div class="quiz-compare-item">
                <div class="quiz-compare-val">${prevPct}%</div>
                <div class="quiz-compare-label">Last Quiz</div>
              </div>
              <div class="quiz-compare-item">
                <div class="quiz-compare-val ${cls}">${curPct}%</div>
                <div class="quiz-compare-label">This Quiz</div>
              </div>
              <div class="quiz-compare-item">
                <div class="quiz-compare-val ${cls}">${arrow} ${Math.abs(diff)}%</div>
                <div class="quiz-compare-label">Change</div>
              </div>
            </div>`;
        })()}
      </div>`;
  } else if (mode === 'challenge') {
    const passed = S._challengePassed;
    const tag = S._challengeTag || '?';
    modeHeader = `
      <div class="center fade-up" style="margin-bottom:1rem">
        <div style="font-size:3rem">${passed ? '\u{26A1}' : '\u{1F4AA}'}</div>
        <div style="font-weight:700;font-size:1.25rem;margin-top:.5rem">${passed ? 'Challenge Won!' : 'Challenge Failed'}</div>
        <div class="sub">${passed ? `Perfect on ${esc(tag)}! +50 bonus XP.` : `${correct}/${total} on ${esc(tag)}. Need 5/5 to win. Try again anytime.`}</div>
      </div>`;
  } else if (mode === 'boss') {
    const passed = S._bossPassed;
    const ch = S._bossChapter || '?';
    modeHeader = `
      <div class="center fade-up" style="margin-bottom:1rem">
        ${passed ? '<div class="boss-celebration">\u{1F389}\u{1F409}\u{1F389}</div>' : '<div style="font-size:3rem">\u{1F409}</div>'}
        <div style="font-weight:700;font-size:1.25rem;margin-top:.5rem">${passed ? `Boss Defeated! Chapters 1–${ch}` : 'Boss Wins This Round'}</div>
        <div class="sub">${passed ? `${pct}% accuracy. +200 bonus XP. Massive.` : `${pct}% accuracy (need 70% to win). Keep practicing and try again.`}</div>
      </div>`;
  }

  const tagSummary = (() => {
    const ss = S.sessionStats;
    if (!ss || !ss.byTag) return '';
    const struggled = [];
    for (const [tag, d] of Object.entries(ss.byTag)) {
      const t = d.right + d.wrong;
      if (t >= 2 && d.right / t < 0.5) struggled.push(tag);
    }
    return struggled.length > 0 ? '<div class="sub mt-sm center"><span style="color:var(--err)">' + struggled.join(', ') + ' needs work</span></div>' : '';
  })();

  app().innerHTML = `
    <div class="wrap" style="padding-top:8vh">
      ${modeHeader}

      <div class="center mb fade-up">
        ${scoreRing(pct)}
        <div class="res-msg mt-sm">${correct} of ${total} correct · ${formatDuration(duration)}</div>
        ${smartClose && mode === 'normal' ? '<div class="sub mt-sm">Session ended early. Shorter sessions build stronger habits.</div>' : ''}
        ${sessionXP > 0 ? `<div class="sub mt-sm" style="color:var(--accent)">+${sessionXP} XP${S._leveledUp ? ' · Level ' + prog.level + '!' : ''}</div>` : ''}
        ${S.progress.streak.current > 0 ? `<div class="sub mt-sm">\u{1F525} ${S.progress.streak.current} day streak</div>` : ''}
      </div>

      ${tagSummary}

      ${S._advancedSection ? `<div class="sub center fade-up" style="color:var(--ok);margin-bottom:.75rem">${esc((() => {
        const ch = CURRICULUM[S.progress.curriculum.chapter];
        const sec = ch && ch.sections.find(s => s.id === S._advancedSection);
        return sec ? sec.name : S._advancedSection;
      })())} complete. Moving on.</div>` : ''}

      ${newAch.length > 0 ? `<div class="sub center fade-up" style="margin-bottom:.75rem">${newAch.map(id => { const a = ACHIEVEMENTS[id]; return a ? a.icon + ' ' + esc(a.name) : ''; }).filter(Boolean).join(' · ')}</div>` : ''}

      ${S._usedFreeze ? '<div class="sub center fade-up" style="margin-bottom:.75rem">\u{2744}\u{FE0F} Streak freeze used. ' + S.progress.streak.freezeDays + ' remaining.</div>' : ''}

      ${offerBonus ? `
        <button class="btn btn-g mt" id="bonus-btn">Challenge Round (5 harder exercises)</button>
      ` : ''}

      <button class="btn btn-p mt" id="home-btn">Done</button>
      ${mode === 'normal' && Batch.totalFuel() > 0 ? '<button class="btn btn-g mt-sm" id="again-btn">Practice More</button>' : ''}
    </div>`;

  $('home-btn').onclick = () => { S.sessionMode = 'normal'; S.screen = 'home'; render(); };
  if ($('again-btn')) $('again-btn').onclick = startSession;
  if ($('bonus-btn')) $('bonus-btn').onclick = () => { S._bonusRound = true; startSession(); };
}


/* ═══════════════════════════════════════════════════════════════
   IGNITION — Guitar Strings motivation tab
   ═══════════════════════════════════════════════════════════════ */

function renderIgnition() {
  unlockAchievement('ignition');
  saveLocal();

  app().innerHTML = `
    <div class="wrap">
      <button class="gs-back" id="gs-back">\u{2190} Back</button>
      <div class="hdr" style="margin-bottom:.25rem">\u{1F3B8} Guitar Strings</div>
      <div class="sub mb">Real people who went from zero French to fluent life. When motivation fades, these stories pull it back.</div>
      ${GUITAR_STRINGS.map(gs => `
        <div class="gs-card">
          <div class="gs-name">${esc(gs.name)}</div>
          <div class="gs-origin">${esc(gs.origin)}</div>
          <div class="gs-quote">${esc(gs.quote)}</div>
          <div class="sub" style="font-size:.8125rem;margin-bottom:.375rem">${esc(gs.result)}</div>
          <div class="gs-key">${esc(gs.key)}</div>
        </div>
      `).join('')}
      <div class="center mt mb">
        <div class="sub">From Daniel Coyle's Ignition framework. Guitar strings pluck motivation from identity connection, not willpower.</div>
      </div>
    </div>`;

  $('gs-back').onclick = () => { S.screen = 'home'; render(); };
}


/* ═══════════════════════════════════════════════════════════════
   ACHIEVEMENTS — full badge gallery
   ═══════════════════════════════════════════════════════════════ */

function renderAchievements() {
  const ach = S.progress.achievements || {};
  const unlocked = Object.keys(ach).filter(id => ach[id].unlocked);
  const total = Object.keys(ACHIEVEMENTS).length;

  app().innerHTML = `
    <div class="wrap">
      <button class="gs-back" id="ach-back">\u{2190} Back</button>
      <div class="hdr" style="margin-bottom:.25rem">\u{1F3C6} Achievements</div>
      <div class="sub mb">${unlocked.length} of ${total} unlocked</div>
      <div class="ach-grid">
        ${Object.entries(ACHIEVEMENTS).map(([id, a]) => {
          const isUnlocked = !!ach[id];
          return `<div class="ach-card${isUnlocked ? '' : ' ach-locked'}"><div class="ach-icon">${a.icon}</div><div class="ach-name">${esc(a.name)}</div><div class="ach-desc">${esc(a.desc)}</div></div>`;
        }).join('')}
      </div>
    </div>`;

  $('ach-back').onclick = () => { S.screen = 'home'; render(); };
}


/* ═══════════════════════════════════════════════════════════════
   SHARE — generate a shareable progress image
   ═══════════════════════════════════════════════════════════════ */

async function shareProgress() {
  const p = S.progress;
  const prog = xpProgress(p.xp ? p.xp.total : 0);
  const streak = p.streak.current;
  const totalEx = Object.keys(p.exercises).length;
  const achCount = Object.keys(p.achievements || {}).filter(id => p.achievements[id].unlocked).length;
  const cur = p.curriculum;

  const text = [
    '\u{1F1EB}\u{1F1F7} French Drills Progress',
    '',
    `Level ${prog.level} · ${(p.xp ? p.xp.total : 0).toLocaleString()} XP`,
    `\u{1F525} ${streak} day streak`,
    `${totalEx} exercises completed`,
    `${achCount}/${Object.keys(ACHIEVEMENTS).length} achievements`,
    '',
    `Chapter ${cur.chapter} · ${cur.completedSections.length} sections done`,
    '',
    'syedalimoiz.com/french-drills-v3/'
  ].join('\n');

  try {
    if (navigator.share) {
      await navigator.share({ text });
    } else {
      await navigator.clipboard.writeText(text);
      const btn = $('share-btn');
      if (btn) { btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = '\u{1F4E4} Share Progress'; }, 2000); }
    }
  } catch (e) {
    try {
      await navigator.clipboard.writeText(text);
      const btn = $('share-btn');
      if (btn) { btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = '\u{1F4E4} Share Progress'; }, 2000); }
    } catch (e2) { /* silent */ }
  }
}


/* ═══════════════════════════════════════════════════════════════
   SAVE & SYNC — localStorage + GitHub
   ═══════════════════════════════════════════════════════════════ */

function saveLocal() {
  if (!S.progress) return;
  S.progress.updated = new Date().toISOString();
  try { localStorage.setItem('fdv3_progress', JSON.stringify(S.progress)); } catch (e) { /* storage full */ }
}

function loadLocal() {
  try {
    const raw = localStorage.getItem('fdv3_progress');
    if (raw) return JSON.parse(raw);
  } catch (e) { /* corrupted */ }
  return null;
}

async function syncToGitHub() {
  if (!S.gh || !S.progress) return;
  try {
    S.progress.updated = new Date().toISOString();
    await S.gh.put('PROGRESS.json', JSON.stringify(S.progress, null, 2), `Progress update ${todayStr()}`);
  } catch (e) {
    // silent fail
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) saveLocal();
});


/* ═══════════════════════════════════════════════════════════════
   BOOT — check auth, load data, show appropriate screen
   ═══════════════════════════════════════════════════════════════ */

document.addEventListener('click', e => {
  const btn = e.target.closest('.speak-btn');
  if (btn) {
    e.stopPropagation();
    if (btn.classList.contains('speak-btn-off')) {
      if (!window.speechSynthesis) return;
      const voices = speechSynthesis.getVoices();
      const fr = voices.find(v => v.lang === 'fr-FR') || voices.find(v => v.lang.startsWith('fr'));
      if (fr) {
        Speech.voice = fr;
        Speech.hasFrenchVoice = true;
        btn.classList.remove('speak-btn-off');
      } else return;
    }
    Speech.speak(btn.dataset.speak, parseFloat(btn.dataset.rate) || 1);
  }
});

async function init() {
  Speech.init();
  const savedToken = localStorage.getItem('fdv3_token');
  const wasSetUp = localStorage.getItem('fdv3_setup');

  if (savedToken) {
    try {
      const gh = new GH(savedToken);
      const progRaw = await gh.get('PROGRESS.json');
      S.gh = gh;
      S.progress = progRaw ? migrateProgress(JSON.parse(progRaw)) : defaultProgress();
      const localProg = loadLocal();
      if (localProg) {
        const migrated = migrateProgress(localProg);
        if (migrated.updated && S.progress.updated && migrated.updated > S.progress.updated) {
          S.progress = migrated;
        }
      }
      await loadBatches();
      S.screen = 'home';
    } catch (e) {
      localStorage.removeItem('fdv3_token');
      S.screen = 'login';
    }
  } else if (wasSetUp) {
    S.screen = 'login';
  } else {
    try {
      const gh = new GH(null);
      const configRaw = await gh.get('config.enc');
      if (configRaw) {
        localStorage.setItem('fdv3_setup', '1');
        S.screen = 'login';
      } else {
        S.screen = 'setup';
      }
    } catch (e) {
      S.screen = 'setup';
    }
  }
  render();
}

init();
</script>
