<script>
'use strict';


/* ═══════════════════════════════════════════════════════════════
   CONFIG
   ═══════════════════════════════════════════════════════════════ */

const CFG = { owner: 'syedalimoiz', repo: 'french-drills-v3' };
const ACCENTS = ['é','è','ê','ë','à','â','î','ï','ô','ù','û','ç'];


/* ═══════════════════════════════════════════════════════════════
   CRYPTO — AES-256-GCM password encryption for PAT
   ═══════════════════════════════════════════════════════════════ */

const Cry = {
  async deriveKey(pw, salt) {
    const raw = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:100000, hash:'SHA-256' }, raw, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
  },
  async encrypt(pw, text) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await this.deriveKey(pw, salt);
    const enc = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(text));
    return { s: this.b64(salt), i: this.b64(iv), d: this.b64(new Uint8Array(enc)) };
  },
  async decrypt(pw, bundle) {
    const salt = this.unb64(bundle.s), iv = this.unb64(bundle.i), data = this.unb64(bundle.d);
    const key = await this.deriveKey(pw, salt);
    const dec = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, data);
    return new TextDecoder().decode(dec);
  },
  b64(u8) { return btoa(String.fromCharCode(...u8)); },
  unb64(s) { return new Uint8Array(atob(s).split('').map(c => c.charCodeAt(0))); }
};


/* ═══════════════════════════════════════════════════════════════
   GITHUB API — Read/write files to the repo
   ═══════════════════════════════════════════════════════════════ */

class GH {
  constructor(token) {
    this.token = token;
    this.api = `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents`;
    this.shas = {};
  }
  headers() {
    const h = { 'Accept': 'application/vnd.github.v3+json' };
    if (this.token) h['Authorization'] = `Bearer ${this.token}`;
    return h;
  }
  encodePath(path) {
    return path.split('/').map(s => encodeURIComponent(s)).join('/');
  }
  async get(path) {
    const r = await fetch(`${this.api}/${this.encodePath(path)}`, { headers: this.headers() });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error(`GitHub ${r.status}: ${(await r.json()).message}`);
    const d = await r.json();
    this.shas[path] = d.sha;
    const bin = atob(d.content.replace(/\n/g, ''));
    return new TextDecoder().decode(new Uint8Array([...bin].map(c => c.charCodeAt(0))));
  }
  async put(path, content, msg) {
    const bytes = new TextEncoder().encode(content);
    const b64 = btoa(String.fromCharCode(...bytes));
    const body = { message: msg, content: b64 };
    if (this.shas[path]) body.sha = this.shas[path];
    const r = await fetch(`${this.api}/${this.encodePath(path)}`, {
      method: 'PUT',
      headers: { ...this.headers(), 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!r.ok) {
      const e = await r.json();
      if (r.status === 409 && !this.shas[path]) {
        await this.get(path);
        return this.put(path, content, msg);
      }
      throw new Error(`GitHub ${r.status}: ${e.message}`);
    }
    const d = await r.json();
    this.shas[path] = d.content.sha;
  }
}


/* ═══════════════════════════════════════════════════════════════
   SRS ENGINE — SM-2 spaced repetition for vocabulary
   ═══════════════════════════════════════════════════════════════ */

const SRS = {
  defaultCard() {
    return { ef: 2.5, interval: 0, reps: 0, nextReview: null, lastReview: null };
  },

  update(card, grade) {
    const today = todayStr();
    card.lastReview = today;
    if (grade >= 3) {
      if (card.reps === 0) card.interval = 1;
      else if (card.reps === 1) card.interval = 3;
      else card.interval = Math.round(card.interval * card.ef);
      card.ef = Math.max(1.3, card.ef + 0.1 - (5 - grade) * (0.08 + (5 - grade) * 0.02));
      card.reps++;
    } else {
      card.reps = 0;
      card.interval = 1;
    }
    const d = new Date(today + 'T00:00:00');
    d.setDate(d.getDate() + card.interval);
    card.nextReview = d.toISOString().slice(0, 10);
    return card;
  },

  isDue(card) {
    if (!card.nextReview) return true;
    return card.nextReview <= todayStr();
  },

  daysOverdue(card) {
    if (!card.nextReview) return 999;
    const diff = Math.floor((new Date(todayStr() + 'T00:00:00') - new Date(card.nextReview + 'T00:00:00')) / 86400000);
    return Math.max(0, diff);
  },

  gradeFromPct(pct) {
    if (pct >= 1.0) return 5;
    if (pct >= 0.8) return 4;
    if (pct >= 0.6) return 3;
    if (pct >= 0.4) return 2;
    if (pct >= 0.2) return 1;
    return 0;
  }
};


/* ═══════════════════════════════════════════════════════════════
   ANSWER CHECKING — accent-tolerant matching
   ═══════════════════════════════════════════════════════════════ */

function normText(s) {
  return s.trim().normalize('NFC').replace(/['’ʼ`′]/g, "'").replace(/\s+/g, ' ').replace(/[.!?,;…]+$/, '').toLowerCase();
}

function stripAccents(s) {
  return s.normalize('NFD').replace(/[̀-ͯ]/g, '');
}

function checkAnswer(given, correct, alternates) {
  const g = normText(given), c = normText(correct);
  if (g === c || stripAccents(g) === stripAccents(c)) return true;
  if (alternates) {
    for (const alt of alternates) {
      const a = normText(alt);
      if (g === a || stripAccents(g) === stripAccents(a)) return true;
    }
  }
  return false;
}


/* ═══════════════════════════════════════════════════════════════
   PROGRESS — V3 data model
   ═══════════════════════════════════════════════════════════════ */

function defaultProgress() {
  return {
    v: 3,
    updated: null,
    exercises: {},
    srs: {},
    errorPatterns: {},
    writingSubmissions: [],
    sessions: [],
    streak: { current: 0, best: 0, lastDate: null },
    batch: { id: null, loaded: null },
    exhaustedIds: []
  };
}

function recordExercise(id, correct, tags) {
  const p = S.progress;
  if (!p.exercises[id]) p.exercises[id] = { attempts: 0, correct: 0, lastSeen: null };
  const rec = p.exercises[id];
  rec.attempts++;
  if (correct) rec.correct++;
  rec.lastSeen = todayStr();
  if (!correct && tags) {
    for (const tag of tags) {
      p.errorPatterns[tag] = (p.errorPatterns[tag] || 0) + 1;
    }
  }
}

function getVocabCard(wordId) {
  if (!S.progress.srs[wordId]) S.progress.srs[wordId] = SRS.defaultCard();
  return S.progress.srs[wordId];
}

function updateStreak() {
  const p = S.progress;
  const today = todayStr();
  if (p.streak.lastDate === today) return;
  const yesterday = new Date(today + 'T00:00:00');
  yesterday.setDate(yesterday.getDate() - 1);
  const yStr = yesterday.toISOString().slice(0, 10);
  if (p.streak.lastDate === yStr) {
    p.streak.current++;
  } else if (p.streak.lastDate !== today) {
    p.streak.current = 1;
  }
  if (p.streak.current > p.streak.best) p.streak.best = p.streak.current;
  p.streak.lastDate = today;
}

function recordSession(correct, total, durationMs) {
  const errorRate = total > 0 ? Math.round(((total - correct) / total) * 100) : 0;
  S.progress.sessions.push({
    date: todayStr(),
    duration: Math.round(durationMs / 1000),
    exercises: total,
    correct: correct,
    errorRate: errorRate
  });
  if (S.progress.sessions.length > 30) S.progress.sessions = S.progress.sessions.slice(-30);
  updateStreak();
}


/* ═══════════════════════════════════════════════════════════════
   BATCH MANAGEMENT — load and query exercise batches
   ═══════════════════════════════════════════════════════════════ */

const Batch = {
  current: null,

  load(json) {
    this.current = typeof json === 'string' ? JSON.parse(json) : json;
  },

  fuel() {
    if (!this.current) return { grammar: 0, vocab: 0, reading: 0, writing: 0 };
    const ex = S.progress.exhaustedIds;
    const gCount = (this.current.grammar || []).filter(q => !ex.includes(q.id)).length;
    const vCount = (this.current.vocabulary || []).filter(q => !ex.includes(q.id)).length;
    const rCount = (this.current.reading || []).filter(q => !ex.includes(q.id)).length;
    const wCount = (this.current.writing || []).filter(q => !ex.includes(q.id)).length;
    return { grammar: gCount, vocab: vCount, reading: rCount, writing: wCount };
  },

  totalFuel() {
    const f = this.fuel();
    return f.grammar + f.vocab + f.reading + f.writing;
  },

  getReachExercises(tag) {
    if (!this.current || !this.current.reach || !this.current.reach[tag]) return [];
    return this.current.reach[tag].filter(q => !S.progress.exhaustedIds.includes(q.id));
  },

  reachFuel() {
    if (!this.current || !this.current.reach) return {};
    const result = {};
    for (const [tag, exs] of Object.entries(this.current.reach)) {
      result[tag] = exs.filter(q => !S.progress.exhaustedIds.includes(q.id)).length;
    }
    return result;
  },

  needsRefuel() {
    const f = this.fuel();
    return !this.current || f.grammar <= 5 || f.vocab <= 3 || f.reading === 0 || f.writing === 0;
  }
};


/* ═══════════════════════════════════════════════════════════════
   REFUEL.md GENERATOR — self-contained handoff for any Claude session
   ═══════════════════════════════════════════════════════════════ */

function generateRefuel() {
  const p = S.progress;
  const fuel = Batch.fuel();
  const reachFuel = Batch.reachFuel();
  const curriculum = Batch.current ? Batch.current.curriculum : { chapter: 1, section: 'unknown', phase: 'LEARN' };

  const recentSessions = p.sessions.slice(-5);
  const avgErrorRate = recentSessions.length > 0
    ? Math.round(recentSessions.reduce((s, r) => s + r.errorRate, 0) / recentSessions.length)
    : 0;

  const topErrors = Object.entries(p.errorPatterns)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 8)
    .map(([tag, count]) => `${tag} (${count} errors)`)
    .join(', ');

  const weakReachTags = Object.entries(reachFuel)
    .filter(([, count]) => count <= 2)
    .map(([tag]) => tag);

  const srsJson = JSON.stringify(p.srs, null, 2);

  const pendingWriting = p.writingSubmissions
    .map(ws => `### ${ws.id} (submitted ${ws.submitted})\n${ws.text}`)
    .join('\n\n');

  const exhaustedStr = p.exhaustedIds.join(', ');

  const grammarTarget = Math.max(0, 25 - fuel.grammar);
  const vocabTarget = Math.max(0, 10 - fuel.vocab);
  const readingTarget = Math.max(0, 2 - fuel.reading);
  const writingTarget = Math.max(0, 1 - fuel.writing);

  return `# French Drill App — Refuel Request

## What This Is
Paste this into a Claude Code session. Run \`/french-batch\` or tell Claude to generate the next batch.
The app repo is at \`~/Projects/french-drills-v3/\`. Push the generated batch to \`batches/current.json\`.

## Current Position
- Chapter: ${curriculum.chapter}, Section: ${curriculum.section}, Phase: ${curriculum.phase}
- Batch ID: ${p.batch.id || 'none'}

## Performance (last ${recentSessions.length} sessions)
- Average error rate: ${avgErrorRate}%${avgErrorRate >= 15 && avgErrorRate <= 25 ? ' (sweet zone)' : avgErrorRate < 15 ? ' (too easy — increase difficulty)' : ' (too hard — review basics)'}
- Top error patterns: ${topErrors || 'none yet'}

## What's Running Low
- Grammar exercises remaining: ${fuel.grammar} ${fuel.grammar <= 5 ? '⚠️' : ''}
- Vocab words remaining: ${fuel.vocab} ${fuel.vocab <= 3 ? '⚠️' : ''}
- Reading passages remaining: ${fuel.reading} ${fuel.reading === 0 ? '⚠️' : ''}
- Writing prompts remaining: ${fuel.writing} ${fuel.writing === 0 ? '⚠️' : ''}
${weakReachTags.length > 0 ? `- Reach bank low for: ${weakReachTags.join(', ')}` : ''}

## Vocabulary SRS State
\`\`\`json
${srsJson}
\`\`\`

${pendingWriting ? `## Writing Submissions Awaiting Review\n${pendingWriting}\n` : ''}
## Exhausted Exercise IDs
${exhaustedStr || 'none'}

## Batch Target
Generate: ${grammarTarget} grammar, 5 reach per weak pattern (${weakReachTags.join(', ') || 'none weak'}), ${vocabTarget} vocab, ${readingTarget} reading, ${writingTarget} writing${pendingWriting ? ', feedback for pending writing' : ''}.
Push to: github.com/SyedAliMoiz/french-drills-v3 → batches/current.json
`;
}

async function copyRefuel() {
  const md = generateRefuel();
  try {
    await navigator.clipboard.writeText(md);
    return true;
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = md;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }
}

const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

function todayStr() { return new Date().toISOString().slice(0, 10); }

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function formatDuration(ms) {
  const secs = Math.floor(ms / 1000);
  if (secs < 60) return secs + 's';
  const mins = Math.floor(secs / 60);
  const rem = secs % 60;
  return mins + 'm ' + (rem < 10 ? '0' : '') + rem + 's';
}

let _activeInput = null;

function insertAccent(ch) {
  if (!_activeInput || _activeInput.disabled) return;
  const s = _activeInput.selectionStart, e = _activeInput.selectionEnd;
  _activeInput.value = _activeInput.value.slice(0, s) + ch + _activeInput.value.slice(e);
  _activeInput.selectionStart = _activeInput.selectionEnd = s + 1;
  _activeInput.focus();
}

function renderAccentBar(disabled) {
  return (!disabled ? '<div class="center"><button class="keys-toggle" id="keys-toggle">accents ↑</button></div>' : '') +
    '<div class="keys" id="keys">' +
    ACCENTS.map(c => '<button class="key" data-c="' + c + '"' + (disabled ? ' disabled' : '') + '>' + c + '</button>').join('') +
    '</div>';
}

function bindAccentKeys() {
  const inputs = document.querySelectorAll('.field:not(:disabled)');
  inputs.forEach(inp => inp.addEventListener('focus', () => { _activeInput = inp; }));
  if (inputs.length > 0) {
    setTimeout(() => inputs[0].focus(), 60);
    _activeInput = inputs[0];
  }
  const toggle = $('keys-toggle'), keysEl = $('keys');
  if (toggle && keysEl) {
    toggle.onclick = () => {
      const open = keysEl.style.display === 'none';
      keysEl.style.display = open ? 'flex' : 'none';
      toggle.textContent = open ? 'accents ↑' : 'accents ↓';
    };
  }
  document.querySelectorAll('.key').forEach(k => {
    k.addEventListener('mousedown', e => e.preventDefault());
    k.onclick = () => insertAccent(k.dataset.c);
  });
}

  $('login-btn').disabled = true;
  $('login-btn').innerHTML = '<span class="spin"></span> Unlocking...';

    gh.token = pat;
    if ($('remember').checked) localStorage.setItem('fdv3_token', pat);

              <div class="card-sub">Exercises are running low. Copy the refuel file and paste it into a Claude Code session.</div>
              <button class="btn btn-g btn-sm mt-sm" id="refuel-btn" style="width:auto;padding:.5rem 1rem">Copy REFUEL.md</button>
              <span class="sub" id="refuel-status" style="margin-left:.5rem"></span>
            </div>
          ` : ''}
        </div>

        <button class="btn btn-p" id="start-btn" ${total === 0 ? 'disabled' : ''}>
          ${todayDone ? 'Practice Again' : 'Start Session'}
        </button>
      `}

      ${zoneHTML ? `<div class="mt">${zoneHTML}</div>` : ''}

      ${S.progress.sessions.length > 1 ? `
        <div class="dash-section mt">
          <div class="dash-section-title">Recent Sessions</div>
          <div class="card">
            ${S.progress.sessions.slice(-5).reverse().map(s => `
              <div class="fuel-row">
                <span class="sub">${s.date.slice(5)}</span>
                <div class="fuel-bar"><div class="fuel-bar-fill ${s.errorRate <= 25 ? 'fuel-ok' : 'fuel-low'}" style="width:${100 - s.errorRate}%"></div></div>
                <span class="fuel-count">${s.correct}/${s.exercises}</span>
              </div>
            `).join('')}
          </div>
        </div>
      ` : ''}

      ${renderWritingFeedback()}

      <div class="mt center">
        <button class="btn-link" id="logout-btn">Lock app</button>
      </div>
    </div>`;

  if ($('start-btn')) $('start-btn').onclick = startSession;
  if ($('refuel-btn')) $('refuel-btn').onclick = async () => {
    const ok = await copyRefuel();
    $('refuel-status').textContent = ok ? 'Copied!' : 'Copy failed';
    $('refuel-btn').textContent = ok ? 'Copied' : 'Try again';
    if (ok) setTimeout(() => { if ($('refuel-status')) $('refuel-status').textContent = ''; }, 3000);
  };
  document.querySelectorAll('.dismiss-fb').forEach(el => {
    el.onclick = () => { el.closest('.writing-fb-card').remove(); };
  });
  $('logout-btn').onclick = () => {
    localStorage.removeItem('fdv3_token');
    S.gh = null;
    S.progress = null;
    Batch.current = null;
    S.screen = 'login';
    render();
  };
}


/* ═══════════════════════════════════════════════════════════════
   SESSION — drill exercises one at a time
   ═══════════════════════════════════════════════════════════════ */

function startSession() {
  if (!Batch.current) return;
  S.sessionCorrect = 0;
  S.sessionTotal = 0;
  S.sessionStartTime = Date.now();
  S.queue = buildSessionQueue();
  S.qi = 0;
  S.answered = false;
  S.currentAnswer = null;
  S.reachQueue = [];
  if (S.queue.length === 0) { S.screen = 'home'; render(); return; }
  S.screen = 'session';
  render();
}

function buildSessionQueue() {
  if (!Batch.current) return [];
  const ex = S.progress.exhaustedIds;
  const grammar = (Batch.current.grammar || []).filter(q => !ex.includes(q.id));
  const vocab = (Batch.current.vocabulary || []).filter(q => !ex.includes(q.id));
  const reading = (Batch.current.reading || []).filter(q => !ex.includes(q.id));
  const writing = (Batch.current.writing || []).filter(q => !ex.includes(q.id));

  const queue = [];

  const errored = grammar.filter(q => {
    const rec = S.progress.exercises[q.id];
    return rec && rec.attempts > 0 && rec.correct < rec.attempts;
  });
  shuffle(errored);
  queue.push(...errored.slice(0, 5));

  const fresh = grammar.filter(q => !S.progress.exercises[q.id] && !queue.includes(q));
  shuffle(fresh);
  queue.push(...fresh.slice(0, 5));

  const dueVocab = vocab.filter(q => {
    const card = getVocabCard(q.id);
    return SRS.isDue(card);
  });
  shuffle(dueVocab);
  queue.push(...dueVocab.slice(0, 5));

  const newVocab = vocab.filter(q => !getVocabCard(q.id).lastReview && !queue.includes(q));
  queue.push(...newVocab.slice(0, 3));

  queue.push(...reading.slice(0, 1));
  queue.push(...writing.slice(0, 1));

  return queue;
}

function queueReach(tags) {
  if (!tags || !Batch.current || !Batch.current.reach) return;
  for (const tag of tags) {
    const pool = Batch.getReachExercises(tag);
    if (pool.length > 0) {
      const ex = { ...pool[0], _isReach: true };
      S.queue.splice(S.qi + 1, 0, ex);
      if (!S.progress.exhaustedIds.includes(pool[0].id)) S.progress.exhaustedIds.push(pool[0].id);
      return;
    }
  }
}

function renderSession() {
  if (S.qi >= S.queue.length) {
    endSession();
    return;
  }
  const q = S.queue[S.qi];
  const progress = Math.round(((S.qi) / S.queue.length) * 100);

  if (q.type === 'mcq') renderMCQ(q, progress);
  else if (q.type === 'blank' || q.type === 'open') renderBlank(q, progress);
  else if (q.type === 'why') renderMCQ(q, progress);
  else if (q.word) renderVocabCard(q, progress);
  else if (q.passage) renderReading(q, progress);
  else if (q.prompt && q.guidelines) renderWriting(q, progress);
  else advanceSession();
}

function renderSessionHeader(progress, typeLabel, typeClass) {
  const q = S.queue[S.qi];
  const isReach = q && q._isReach;
  return `
    <div class="dp-top">
      <div class="row between">
        <div class="dp-count">${S.qi + 1} / ${S.queue.length}</div>
        <div class="row gap-sm">
          ${isReach ? '<span class="type-badge type-reach">REACH</span>' : ''}
          <span class="type-badge ${typeClass}">${typeLabel}</span>
        </div>
      </div>
      <div class="prog-track mt-sm"><div class="prog-fill" style="width:${progress}%"></div></div>
    </div>`;
}

function renderMCQ(q, progress) {
  const letters = ['A', 'B', 'C', 'D'];
  app().innerHTML = `
    <div class="dp">
      ${renderSessionHeader(progress, 'Grammar', 'type-grammar')}
      <div class="dp-body">
        <div class="card${S.answered ? (S.currentAnswer === q.correct ? ' card-ok' : ' card-err') : ''}">
          <div class="serif">${esc(q.stem)}</div>
          ${q.context ? `<div class="sub">${esc(q.context)}</div>` : ''}
        </div>
        <div class="opts" id="opts">
          ${q.options.map((opt, i) => {
            let cls = 'opt';
            if (S.answered) {
              cls += ' opt-locked';
              if (i === q.correct) cls += ' opt-right';
              else if (i === S.currentAnswer) cls += ' opt-wrong';
            }
            return `<button class="${cls}" data-i="${i}"><span class="opt-letter">${letters[i]}</span><span>${esc(opt)}</span></button>`;
          }).join('')}
        </div>
        ${S.answered ? `
          <div class="fb ${S.currentAnswer === q.correct ? 'fb-ok' : 'fb-err'}">
            <span class="fb-head">${S.currentAnswer === q.correct ? 'Correct' : 'Wrong'}</span>
            ${q.rule ? `<span class="fb-rule">${esc(q.rule)}</span>` : ''}
          </div>
          <button class="btn btn-p mt" id="next-btn">Continue</button>
        ` : ''}
      </div>
    </div>`;

  if (!S.answered) {
    document.querySelectorAll('.opt').forEach(el => {
      el.onclick = () => {
        const i = parseInt(el.dataset.i);
        S.currentAnswer = i;
        S.answered = true;
        S.sessionTotal++;
        const correct = i === q.correct;
        if (correct) S.sessionCorrect++;
        recordExercise(q.id, correct, q.tags);
        if (!correct && !q._isReach) queueReach(q.tags);
        render();
      };
    });
  } else {
    $('next-btn').onclick = advanceSession;
    $('next-btn').focus();
    document.addEventListener('keydown', function handler(e) {
      if (e.key === 'Enter' && !e.repeat) { document.removeEventListener('keydown', handler); advanceSession(); }
    });
  }
}

function renderBlank(q, progress) {
  app().innerHTML = `
    <div class="dp">
      ${renderSessionHeader(progress, 'Grammar', 'type-grammar')}
      <div class="dp-body">
        <div class="card${S.answered ? (S.currentAnswer ? ' card-ok' : ' card-err') : ''}">
          <div class="serif">${esc(q.stem)}</div>
          ${q.context ? `<div class="sub">${esc(q.context)}</div>` : ''}
        </div>
        <input type="text" class="field" id="answer" placeholder="Type your answer..." autocomplete="off" autocapitalize="off" spellcheck="false" ${S.answered ? 'disabled' : ''}>
        ${renderAccentBar(S.answered)}
        ${!S.answered ? '<button class="btn btn-p mt" id="check-btn">Check</button>' : ''}
        ${S.answered ? `
          <div class="fb ${S.currentAnswer ? 'fb-ok' : 'fb-err'}">
            <span class="fb-head">${S.currentAnswer ? 'Correct' : 'Wrong'}</span>
            <span class="fb-answer">${esc(typeof q.correct === 'number' ? q.options[q.correct] : q.correct)}</span>
            ${q.rule ? `<span class="fb-rule">${esc(q.rule)}</span>` : ''}
          </div>
          <button class="btn btn-p mt" id="next-btn">Continue</button>
        ` : ''}
      </div>
    </div>`;

  if (!S.answered) {
    bindAccentKeys();
    const checkFn = () => {
      const val = $('answer').value;
      if (!val.trim()) return;
      const correctStr = typeof q.correct === 'number' ? q.options[q.correct] : q.correct;
      const ok = checkAnswer(val, correctStr, q.alternates);
      S.currentAnswer = ok;
      S.answered = true;
      S.sessionTotal++;
      if (ok) S.sessionCorrect++;
      recordExercise(q.id, ok, q.tags);
      if (!ok) { $('answer').classList.add('field-err'); if (!q._isReach) queueReach(q.tags); }
      else $('answer').classList.add('field-ok');
      render();
    };
    $('check-btn').onclick = checkFn;
    $('answer').addEventListener('keydown', e => { if (e.key === 'Enter') checkFn(); });
  } else {
    $('next-btn').onclick = advanceSession;
    $('next-btn').focus();
    document.addEventListener('keydown', function handler(e) {
      if (e.key === 'Enter' && !e.repeat) { document.removeEventListener('keydown', handler); advanceSession(); }
    });
  }
}

function renderVocabCard(q, progress) {
  const card = getVocabCard(q.id);
  app().innerHTML = `
    <div class="dp">
      ${renderSessionHeader(progress, 'Vocab', 'type-vocab')}
      <div class="dp-body">
        <div class="card${S.answered ? (S.currentAnswer ? ' card-ok' : ' card-err') : ''}">
          <div class="serif">${esc(q.meaning)}</div>
          <div class="sub">What is this in French?${q.gender ? ' (' + q.gender + ')' : ''}</div>
        </div>
        <input type="text" class="field" id="answer" placeholder="Type the French word..." autocomplete="off" autocapitalize="off" spellcheck="false" ${S.answered ? 'disabled' : ''}>
        ${renderAccentBar(S.answered)}
        ${!S.answered ? '<button class="btn btn-p mt" id="check-btn">Check</button>' : ''}
        ${S.answered ? `
          <div class="fb ${S.currentAnswer ? 'fb-ok' : 'fb-err'}">
            <span class="fb-head">${S.currentAnswer ? 'Correct' : 'Wrong'}</span>
            <span class="fb-answer">${esc(q.word)}</span>
            ${q.pronunciation ? `<span class="fb-rule">${esc(q.pronunciation)}</span>` : ''}
            ${q.sentence_fr ? `<span class="fb-rule">${esc(q.sentence_fr)}</span>` : ''}
          </div>
          <button class="btn btn-p mt" id="next-btn">Continue</button>
        ` : ''}
      </div>
    </div>`;

  if (!S.answered) {
    bindAccentKeys();
    const checkFn = () => {
      const val = $('answer').value;
      if (!val.trim()) return;
      const ok = checkAnswer(val, q.word, q.alternates);
      S.currentAnswer = ok;
      S.answered = true;
      S.sessionTotal++;
      if (ok) S.sessionCorrect++;
      const grade = ok ? 4 : 1;
      SRS.update(card, grade);
      render();
    };
    $('check-btn').onclick = checkFn;
    $('answer').addEventListener('keydown', e => { if (e.key === 'Enter') checkFn(); });
  } else {
    $('next-btn').onclick = advanceSession;
    $('next-btn').focus();
    document.addEventListener('keydown', function handler(e) {
      if (e.key === 'Enter' && !e.repeat) { document.removeEventListener('keydown', handler); advanceSession(); }
    });
  }
}

function renderReading(q, progress) {
  const rq = q.questions || [];
  app().innerHTML = `
    <div class="dp">
      ${renderSessionHeader(progress, 'Reading', 'type-reading')}
      <div class="dp-body" style="justify-content:flex-start;padding-top:1.5rem">
        <div class="card" style="background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.25rem;box-shadow:var(--card-shadow)">
          <div style="font-weight:600;margin-bottom:.5rem">${esc(q.title || 'Reading')}</div>
          <div class="serif" style="font-size:1.125rem;line-height:1.7;font-weight:400">${esc(q.passage)}</div>
          ${q.vocab_highlights ? `<div class="mt-sm sub">${Object.entries(q.vocab_highlights).map(([fr, en]) => `<strong>${esc(fr)}</strong> = ${esc(en)}`).join(' · ')}</div>` : ''}
        </div>
        ${rq.length > 0 ? `
          <div class="mt">
            ${rq.map((rqi, idx) => `
              <div class="card" style="background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem;box-shadow:var(--card-shadow);margin-bottom:.5rem">
                <div style="font-weight:600;font-size:.9375rem;margin-bottom:.5rem">${esc(rqi.q)}</div>
                ${rqi.type === 'mcq' ? `
                  <div class="opts" style="margin:0">
                    ${rqi.options.map((o, oi) => `<button class="opt rq-opt" data-qi="${idx}" data-oi="${oi}"><span class="opt-letter">${['A','B','C','D'][oi]}</span><span>${esc(o)}</span></button>`).join('')}
                  </div>
                ` : ''}
              </div>
            `).join('')}
          </div>
        ` : ''}
        <button class="btn btn-p mt" id="reading-done-btn">${rq.length > 0 ? 'Check Answers' : 'Done Reading'}</button>
      </div>
    </div>`;

  $('reading-done-btn').onclick = () => {
    S.sessionTotal++;
    S.sessionCorrect++;
    if (!S.progress.exhaustedIds.includes(q.id)) S.progress.exhaustedIds.push(q.id);
    advanceSession();
  };
}

function renderWriting(q, progress) {
  app().innerHTML = `
    <div class="dp">
      ${renderSessionHeader(progress, 'Writing', 'type-writing')}
      <div class="dp-body" style="justify-content:flex-start;padding-top:1.5rem">
        <div class="card" style="background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.25rem;box-shadow:var(--card-shadow)">
          <div class="serif" style="font-size:1.25rem">${esc(q.prompt)}</div>
          <div class="sub mt-sm">${esc(q.guidelines)}</div>
          <div class="sub" style="margin-top:.25rem">Level: ${esc(q.level || 'A1')}</div>
        </div>
        <textarea class="field mt" id="writing-area" rows="6" placeholder="Write in French..." style="resize:vertical;font-size:1rem;line-height:1.6"></textarea>
        ${renderAccentBar(false)}
        <button class="btn btn-p mt" id="submit-writing-btn">Submit</button>
        <button class="btn-link" id="skip-writing-btn">Skip for now</button>
      </div>
    </div>`;

  bindAccentKeys();
  $('submit-writing-btn').onclick = () => {
    const text = $('writing-area').value.trim();
    if (!text) return;
    S.progress.writingSubmissions.push({ id: q.id, text, submitted: new Date().toISOString() });
    if (!S.progress.exhaustedIds.includes(q.id)) S.progress.exhaustedIds.push(q.id);
    S.sessionTotal++;
    S.sessionCorrect++;
    advanceSession();
  };
  $('skip-writing-btn').onclick = advanceSession;
}

function advanceSession() {
  S.qi++;
  S.answered = false;
  S.currentAnswer = null;
  if (S.qi >= S.queue.length) {
    endSession();
  } else {
    render();
  }
}

function endSession() {
  const duration = Date.now() - (S.sessionStartTime || Date.now());
  recordSession(S.sessionCorrect, S.sessionTotal, duration);
  saveLocal();
  syncToGitHub();
  S.screen = 'results';
  render();
}


/* ═══════════════════════════════════════════════════════════════
   RESULTS — end-of-session summary
   ═══════════════════════════════════════════════════════════════ */

function renderResults() {
  const total = S.sessionTotal;
  const correct = S.sessionCorrect;
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
  const errorRate = total > 0 ? 100 - pct : 0;
  const duration = Date.now() - (S.sessionStartTime || Date.now());

  let zoneClass, zoneLabel;
  if (errorRate >= 15 && errorRate <= 25) { zoneClass = 'zone-sweet'; zoneLabel = 'Sweet zone — right level of challenge'; }
  else if (errorRate < 15) { zoneClass = 'zone-easy'; zoneLabel = 'Too easy — difficulty should increase'; }
  else { zoneClass = 'zone-hard'; zoneLabel = 'Too hard — review the basics first'; }

  app().innerHTML = `
    <div class="wrap" style="padding-top:8vh">
      <div class="center mb">
        <div class="res-score">${pct}%</div>
        <div class="res-msg">${correct} of ${total} correct · ${formatDuration(duration)}</div>
      </div>

      <div class="zone-indicator ${zoneClass}">${zoneLabel}</div>
      <div class="sub mt-sm center">Coyle's 20% Rule: aim for 15–25% errors. That's where growth happens.</div>

      ${S.progress.streak.current > 0 ? `
        <div class="center mt">
          <div class="streak-badge">\u{1F525} ${S.progress.streak.current} day streak</div>
        </div>
      ` : ''}

      <div class="stat-row mt">
        <div class="stat-box">
          <div class="stat-val">${errorRate}%</div>
          <div class="stat-label">Error Rate</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${total}</div>
          <div class="stat-label">Exercises</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${formatDuration(duration)}</div>
          <div class="stat-label">Time</div>
        </div>
      </div>

      ${Batch.needsRefuel() ? `
        <div class="card mt" style="border-left:3px solid var(--warn)">
          <div class="card-title" style="color:var(--warn)">Fuel is low</div>
          <div class="card-sub">Copy the refuel file and paste it into Claude Code to generate more exercises.</div>
          <button class="btn btn-g btn-sm mt-sm" id="res-refuel-btn" style="width:auto;padding:.5rem 1rem">Copy REFUEL.md</button>
          <span class="sub" id="res-refuel-status" style="margin-left:.5rem"></span>
        </div>
      ` : ''}

      <button class="btn btn-p mt" id="home-btn">Back to Home</button>
      ${Batch.totalFuel() > 0 ? '<button class="btn btn-g mt-sm" id="again-btn">Practice More</button>' : ''}
    </div>`;

  $('home-btn').onclick = () => { S.screen = 'home'; render(); };
  if ($('again-btn')) $('again-btn').onclick = startSession;
  if ($('res-refuel-btn')) $('res-refuel-btn').onclick = async () => {
    const ok = await copyRefuel();
    $('res-refuel-status').textContent = ok ? 'Copied!' : 'Copy failed';
    $('res-refuel-btn').textContent = ok ? 'Copied' : 'Try again';
  };
}


/* ═══════════════════════════════════════════════════════════════
   SAVE & SYNC — localStorage + GitHub
   ═══════════════════════════════════════════════════════════════ */

function saveLocal() {
  if (!S.progress) return;
  S.progress.updated = new Date().toISOString();
  try { localStorage.setItem('fdv3_progress', JSON.stringify(S.progress)); } catch (e) { /* storage full */ }
}

function loadLocal() {
  try {
    const raw = localStorage.getItem('fdv3_progress');
    if (raw) return JSON.parse(raw);
  } catch (e) { /* corrupted */ }
  return null;
}

async function syncToGitHub() {
  if (!S.gh || !S.progress) return;
  try {
    S.progress.updated = new Date().toISOString();
    await S.gh.put('PROGRESS.json', JSON.stringify(S.progress, null, 2), `Progress update ${todayStr()}`);
  } catch (e) {
    // silent fail
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) saveLocal();
});


/* ═══════════════════════════════════════════════════════════════
   BOOT — check auth, load data, show appropriate screen
   ═══════════════════════════════════════════════════════════════ */

async function init() {
  const savedToken = localStorage.getItem('fdv3_token');
  const wasSetUp = localStorage.getItem('fdv3_setup');

  if (savedToken) {
    try {
      const gh = new GH(savedToken);
      const progRaw = await gh.get('PROGRESS.json');
      S.gh = gh;
      S.progress = progRaw ? JSON.parse(progRaw) : defaultProgress();
      const localProg = loadLocal();
      if (localProg && localProg.updated && S.progress.updated && localProg.updated > S.progress.updated) {
        S.progress = localProg;
      }
      await loadBatch();
      S.screen = 'home';
    } catch (e) {
      localStorage.removeItem('fdv3_token');
      S.screen = wasSetUp ? 'login' : 'setup';
    }
  } else {
    S.screen = wasSetUp ? 'login' : 'setup';
  }
  render();
}

init();
</script>
